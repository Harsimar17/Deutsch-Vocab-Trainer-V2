spring.application.name=vocab-backend
server.port=${PORT:8080}

# Firebase project — the same values as firebaseConfig in index.html. The web
# API key is a public project identifier (it already ships in the page), not a
# secret. No service-account key is needed: every Firestore call is made with
# the page's own Firebase ID token, so Firestore's security rules apply exactly
# as they did when the page wrote to Firestore directly.
app.firebase.project-id=a2-vocab-trainer
app.firebase.web-api-key=AIzaSyBRzM4RvIBEbgmAhWHED57d4hE2MhvX4_Y
# Point at the Firestore emulator for local testing, e.g. http://localhost:8081/v1
app.firebase.firestore-base-url=${FIRESTORE_BASE_URL:https://firestore.googleapis.com/v1}

# Vocabulary + stories served by GET /api/vocab: read from GitHub (the same URL the
# page used to fetch), re-checked in the background every refresh-interval. The copy
# bundled into the jar is only used while GitHub can't be reached.
app.vocab.url=${VOCAB_URL:https://harsimar17.github.io/Deutsch-Vocab-Helper/german_vocab.json}
app.vocab.refresh-interval=5m
app.vocab.fallback=classpath:data/german_vocab.json

# "+ Add word" commits german_vocab.json here (the GitHub token comes from the page per request).
app.github.api-url=https://api.github.com
app.github.owner=Harsimar17
app.github.repo=Deutsch-Vocab-Helper
app.github.branch=main
app.github.path=german_vocab.json

# Each user's progress lives in scores/<their Firebase uid>. This is the old shared
# record from before user accounts; POST /api/users can copy it into a new account once.
app.legacy-progress-doc-id=harsimar-progress

# User accounts. Sessions are the app's own JWT (HS256), valid until session-idle-timeout
# passes with no request — every authenticated response carries a fresh token in X-Auth-Token.
# Set JWT_SECRET (32+ random characters) in production; without it a random key is made at
# startup and everyone has to log in again after a restart.
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.session-idle-timeout=24h
# Required header (X-Admin-Key) for POST /api/users. Empty = creating users is switched off.
app.auth.admin-key=${ADMIN_API_KEY:}

# Origins allowed to call the API (the GitHub Pages site and local dev servers).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://harsimar17.github.io,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8766}

# Keep-alive for Render's free tier (sleeps after 15 min without traffic): the app
# pings its own public /health every interval. Render sets RENDER_EXTERNAL_URL itself;
# with no URL (e.g. locally) the job is off. KEEP_ALIVE_URL overrides it for other hosts.
app.keep-alive.url=${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
app.keep-alive.interval=PT10M
