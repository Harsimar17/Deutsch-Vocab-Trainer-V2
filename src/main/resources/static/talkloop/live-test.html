<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gemini Live Test</title>
<style>
  /* One narrow column: setup card, a big call button, then the running transcript. */
  :root {
    --bg: #f3f5f8; --card: #ffffff; --fg: #1b2330; --muted: #5f6b7d; --line: #d9dee6;
    --accent: #2f6fe4; --accent-fg: #ffffff; --you: #e6eefc; --them: #eef1f4; --danger: #c8372d; --ok: #1f8a4c;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151b; --card: #1a2028; --fg: #e5e9ef; --muted: #98a3b3; --line: #2c3540;
      --accent: #6a9cff; --accent-fg: #0d1420; --you: #1f2f4d; --them: #232a33; --danger: #f07167; --ok: #4fc483; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
  main { max-width: 640px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .muted { color: var(--muted); font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 0.875rem; }
  input, select, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.875rem; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: 400; }
  .checks input { width: auto; }
  button { font: inherit; font-weight: 600; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 16px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #call { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 12px 26px; font-size: 1rem; }
  #call.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  #state { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.listening { background: var(--ok); }
  .dot.speaking { background: var(--accent); }
  .dot.connecting { background: var(--muted); }
  #meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #meter > div { height: 100%; width: 0; background: var(--ok); transition: width 80ms linear; }
  #heard { min-height: 1.5em; font-style: italic; color: var(--muted); }
  #log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #log li { padding: 8px 12px; border-radius: 10px; max-width: 88%; overflow-wrap: anywhere; }
  #log li.you { background: var(--you); justify-self: end; }
  #log li.them { background: var(--them); justify-self: start; }
  #log li.sys { justify-self: center; color: var(--muted); font-size: 0.8rem; background: none; padding: 0; }
  #log .who { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 600; }
  #status { min-height: 1.2em; }
  #status.error { color: var(--danger); }
  details summary { cursor: pointer; font-weight: 600; font-size: 0.875rem; }
  #debug { font: 12px/1.4 var(--mono); white-space: pre-wrap; max-height: 200px; overflow: auto; color: var(--muted); margin: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { #meter > div { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gemini Live test</h1>
    <p class="muted">Talk to Gemini by voice, like Gemini's voice mode. Your key stays in this browser and goes only to Google.</p>
  </header>

  <section class="card" id="setup">
    <label>Gemini API key
      <input id="key" type="password" autocomplete="off" placeholder="AIza… or AQ.…" />
    </label>
    <div class="row">
      <label>Model
        <select id="model"><option value="">Paste your key to load the models</option></select>
      </label>
      <label>Voice
        <select id="voice">
          <option>Puck</option><option>Kore</option><option>Charon</option><option>Aoede</option>
          <option>Fenrir</option><option>Leda</option><option>Orus</option><option>Zephyr</option>
        </select>
      </label>
    </div>
    <label>Instructions for Gemini
      <textarea id="prompt">You are a friendly German conversation partner for a B1 learner. Speak German in short, natural sentences, at a relaxed pace. Ask one question at a time. If the learner makes a mistake, repeat their sentence correctly once, then carry on.</textarea>
    </label>
    <div class="checks">
      <label><input id="echo" type="checkbox" checked /> Echo cancellation</label>
      <label><input id="noise" type="checkbox" checked /> Noise suppression</label>
      <label><input id="gain" type="checkbox" checked /> Auto gain</label>
      <label><input id="first" type="checkbox" checked /> Gemini speaks first</label>
    </div>
  </section>

  <section class="card">
    <div class="controls">
      <button id="call" type="button">Start talking</button>
      <button id="mute" type="button" disabled>Mute</button>
      <div id="state"><span class="dot" id="dot"></span><span id="state-text">Not connected</span></div>
    </div>
    <div id="meter" aria-hidden="true"><div></div></div>
    <div id="heard" aria-live="polite"></div>
    <p id="status" class="muted" aria-live="polite"></p>
    <ul id="log"></ul>
    <details>
      <summary>Details</summary>
      <pre id="debug"></pre>
    </details>
  </section>
</main>

<script>
const LIVE_URL = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
const IN_RATE = 16000; // what the Live API wants from the mic: 16-bit PCM, mono
const CHUNK = 1600; // 100 ms of mic audio per message
const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor("tap", Tap);`;

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d = "") { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
};

const t0 = performance.now();
function debug(text) {
  const box = $("debug");
  box.textContent += `${((performance.now() - t0) / 1000).toFixed(1)}s  ${text}\n`;
  box.scrollTop = box.scrollHeight;
}
function status(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
}

// ---------- key and model ----------
// Shares Talkloop's saved Gemini key (same site), so there is nothing to paste if it is set there.
$("key").value = store.get("live_test_key") || store.get("gemini_key");
$("prompt").value = store.get("live_test_prompt") || $("prompt").value;
$("voice").value = store.get("live_test_voice") || "Puck";
$("prompt").addEventListener("change", () => store.set("live_test_prompt", $("prompt").value));
$("voice").addEventListener("change", () => store.set("live_test_voice", $("voice").value));
$("model").addEventListener("change", () => store.set("live_test_model", $("model").value));

let loadedFor = "";
async function loadModels() {
  const key = $("key").value.trim();
  if (!key || key === loadedFor) return;
  loadedFor = key;
  store.set("live_test_key", key);
  $("model").innerHTML = "<option>Loading…</option>";
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error(`Google answered ${res.status}: check the key`);
    const models = ((await res.json()).models ?? []).filter((m) => m.supportedGenerationMethods?.includes("bidiGenerateContent"));
    if (!models.length) throw new Error("this key has no live (voice) model");
    // Newest version first; native-audio models before the rest.
    const version = (n) => Number(n.match(/gemini-(\d+(?:\.\d+)?)/)?.[1] ?? 0);
    const rank = (n) => version(n) * 10 + (/native-audio|live/.test(n) ? 1 : 0);
    models.sort((a, b) => rank(b.name) - rank(a.name));
    $("model").innerHTML = "";
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m.name;
      o.textContent = m.name.replace(/^models\//, "");
      $("model").append(o);
    }
    const saved = store.get("live_test_model");
    if (models.some((m) => m.name === saved)) $("model").value = saved;
    debug(`live models: ${models.map((m) => m.name).join(", ")}`);
    status("");
  } catch (error) {
    loadedFor = "";
    $("model").innerHTML = "<option value=\"\">No models loaded</option>";
    status(`Couldn't load the models: ${error.message}.`, true);
  }
}
$("key").addEventListener("change", loadModels);
$("key").addEventListener("paste", () => setTimeout(loadModels, 0));
loadModels();

// ---------- the call ----------
let call = null;
let audioCtx = null;
let workletCtx = null;

function setState(kind, text) {
  $("dot").className = `dot ${kind}`;
  $("state-text").textContent = text;
}
function refreshState() {
  if (!call) return setState("", "Not connected");
  if (!call.ready) return setState("connecting", "Connecting…");
  if (call.speaking) return setState("speaking", "Gemini is speaking");
  if (call.muted) return setState("", "Muted");
  setState("listening", "Listening");
}

function addLine(kind, text, who) {
  const li = document.createElement("li");
  li.className = kind;
  if (who) {
    const w = document.createElement("span");
    w.className = "who";
    w.textContent = who;
    li.append(w);
  }
  li.append(document.createTextNode(text));
  $("log").append(li);
  li.scrollIntoView({ block: "nearest" });
  return li;
}

function send(msg) {
  if (call?.ws?.readyState === WebSocket.OPEN) call.ws.send(JSON.stringify(msg));
}
function toBase64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

// The mic's samples, at the audio context's rate, down to 16 kHz 16-bit PCM in 100 ms messages.
function micSamples(samples, rate) {
  if (!call) return;
  let peak = 0;
  for (const v of samples) peak = Math.max(peak, Math.abs(v));
  call.level = Math.max(peak, call.level * 0.85);
  if (call.muted || !call.ready) return;
  const step = rate / IN_RATE;
  let pos = call.micPos;
  for (; pos < samples.length; pos += step) {
    const v = Math.max(-1, Math.min(1, samples[Math.floor(pos)]));
    call.micBuf[call.micLen++] = v < 0 ? v * 0x8000 : v * 0x7fff;
    if (call.micLen === CHUNK) {
      send({ realtimeInput: { audio: { data: toBase64(new Uint8Array(call.micBuf.buffer)), mimeType: `audio/pcm;rate=${IN_RATE}` } } });
      call.micLen = 0;
    }
  }
  call.micPos = pos - samples.length;
}
function drawMeter() {
  if (!call) { $("meter").firstElementChild.style.width = "0"; return; }
  $("meter").firstElementChild.style.width = `${Math.min(100, call.level * 160)}%`;
  requestAnimationFrame(drawMeter);
}

// Gemini's voice, played gap-free as its chunks arrive.
function play(b64, mimeType) {
  const rate = Number(mimeType?.match(/rate=(\d+)/)?.[1] ?? 24000);
  const pcm = new Int16Array(fromBase64(b64).buffer);
  const buffer = audioCtx.createBuffer(1, pcm.length, rate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 0x8000;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.connect(audioCtx.destination);
  const at = Math.max(audioCtx.currentTime + 0.04, call.playHead);
  src.start(at);
  call.playHead = at + buffer.duration;
  call.sources.add(src);
  if (!call.speaking && call.turnEndAt) debug(`first audio ${((performance.now() - call.turnEndAt) / 1000).toFixed(2)}s after you stopped`);
  call.turnEndAt = 0;
  call.speaking = true;
  refreshState();
  src.onended = () => {
    if (!call) return;
    call.sources.delete(src);
    if (!call.sources.size) { call.speaking = false; refreshState(); }
  };
}
function stopVoice() {
  for (const src of call.sources) { try { src.stop(); } catch { /* ended */ } }
  call.sources.clear();
  call.playHead = 0;
  call.speaking = false;
  refreshState();
}

function flushYou() {
  const said = call.heard.trim();
  call.heard = "";
  $("heard").textContent = "";
  if (said) addLine("you", said, "You");
}
function flushThem() {
  call.reply = "";
  call.replyLi = null;
}

function onMessage(msg) {
  if (msg.setupComplete) {
    call.ready = true;
    status("Connected. Start talking.");
    refreshState();
    if ($("first").checked) send({ clientContent: { turns: [{ role: "user", parts: [{ text: "(Greet me and start the conversation.)" }] }], turnComplete: true } });
    return;
  }
  if (msg.goAway) debug(`server: call ends in ${msg.goAway.timeLeft ?? "?"}`);
  const c = msg.serverContent;
  if (!c) return;
  if (c.inputTranscription?.text) {
    call.heard += c.inputTranscription.text;
    $("heard").textContent = `🎤 ${call.heard.trim()}`;
    call.turnEndAt = performance.now();
  }
  const parts = c.modelTurn?.parts ?? [];
  if (c.outputTranscription?.text || parts.length) flushYou();
  for (const p of parts) if (p.inlineData?.data) play(p.inlineData.data, p.inlineData.mimeType);
  if (c.outputTranscription?.text) {
    call.reply += c.outputTranscription.text;
    if (!call.replyLi) call.replyLi = addLine("them", "", "Gemini");
    call.replyLi.lastChild.textContent = call.reply;
    call.replyLi.scrollIntoView({ block: "nearest" });
  }
  if (c.interrupted) { debug("you talked over Gemini: its voice stopped"); stopVoice(); }
  if (c.turnComplete) { flushYou(); flushThem(); }
}

async function start() {
  const key = $("key").value.trim();
  const model = $("model").value;
  if (!key) return status("Paste your Gemini API key first.", true);
  if (!model) { await loadModels(); if (!$("model").value) return; }
  call = { ws: null, stream: null, tap: null, source: null, ready: false, muted: false, speaking: false,
    heard: "", reply: "", replyLi: null, sources: new Set(), playHead: 0, level: 0, turnEndAt: 0,
    micBuf: new Int16Array(CHUNK), micLen: 0, micPos: 0, ending: false };
  $("call").textContent = "Stop";
  $("call").classList.add("on");
  $("mute").disabled = false;
  refreshState();
  status("Connecting…");
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    call.stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: $("echo").checked, noiseSuppression: $("noise").checked, autoGainControl: $("gain").checked, channelCount: 1,
    } });
    if (!call) return;
    if (workletCtx !== audioCtx) {
      await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
      workletCtx = audioCtx;
    }
    call.source = audioCtx.createMediaStreamSource(call.stream);
    call.tap = new AudioWorkletNode(audioCtx, "tap");
    call.tap.port.onmessage = (e) => micSamples(e.data, audioCtx.sampleRate);
    call.source.connect(call.tap);
    drawMeter();

    const ws = new WebSocket(`${LIVE_URL}?key=${encodeURIComponent(key)}`);
    call.ws = ws;
    debug(`connecting to ${model}, mic at ${audioCtx.sampleRate} Hz`);
    ws.onopen = () => send({
      setup: {
        model: $("model").value,
        generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $("voice").value } } } },
        systemInstruction: { parts: [{ text: $("prompt").value }] },
        inputAudioTranscription: {},
        outputAudioTranscription: {},
      },
    });
    ws.onmessage = async (event) => {
      if (!call || call.ws !== ws) return;
      try {
        onMessage(JSON.parse(typeof event.data === "string" ? event.data : await event.data.text()));
      } catch (error) {
        debug(`bad message: ${error.message}`);
      }
    };
    ws.onclose = (event) => {
      if (!call || call.ws !== ws || call.ending) return;
      const before = !call.ready;
      debug(`closed: ${event.code} ${event.reason}`);
      stop();
      status(`${before ? "The call couldn't start" : "The call ended"}${event.reason ? `: ${event.reason}` : ""}. Tap Start talking to ${before ? "try again" : "reconnect"}.`, true);
    };
  } catch (error) {
    stop();
    status(error.name === "NotAllowedError" ? "The browser blocked the microphone: allow it for this site and try again." : `Couldn't start: ${error.message}`, true);
  }
}

function stop() {
  if (!call) return;
  const c = call;
  c.ending = true;
  flushYou();
  stopVoice();
  call = null;
  try { c.ws?.close(); } catch { /* closed */ }
  try { c.source?.disconnect(); c.tap?.disconnect(); } catch { /* gone */ }
  for (const t of c.stream?.getTracks() ?? []) t.stop();
  $("call").textContent = "Start talking";
  $("call").classList.remove("on");
  $("mute").disabled = true;
  $("mute").textContent = "Mute";
  refreshState();
  status("Call ended.");
}

$("call").addEventListener("click", () => (call ? stop() : start()));
$("mute").addEventListener("click", () => {
  if (!call) return;
  call.muted = !call.muted;
  $("mute").textContent = call.muted ? "Unmute" : "Mute";
  refreshState();
});
</script>
</body>
</html>
