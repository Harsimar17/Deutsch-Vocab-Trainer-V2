<!doctype html>
<!--
  Talkloop's screen inside ChatGPT (an MCP App, served by McpService as ui://talkloop/screen.html).
  ChatGPT is the partner: what the learner says here goes into the chat as their message, ChatGPT
  answers with the talkloop_turn tool, and its turn comes back here (as the tool result, or from
  __TALKLOOP_ORIGIN__/talkloop-screen/{id} while waiting) to be shown and read aloud. Listening is
  the browser's speech recognition and the voice the browser's own, as on Talkloop's page.
  Self-contained: ChatGPT's sandbox loads nothing else but the fonts.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talkloop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" />
<style>
  /* Talkloop's comic-book theme (static/talkloop/styles.css). */
  :root {
    --bg: #fff8e1; --surface: #ffffff; --text: #111111; --muted: #5c574b;
    --accent: #e62429; --accent-text: #ffffff; --character: #d9f2ff; --learner: #fff1a8;
    --good: #1b8f3a; --warn: #c2410c; --edge: #111111; --pop: 3px 3px 0 #111111; --dots: rgba(0, 0, 0, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14182b; --surface: #1f2540; --text: #fff6d6; --muted: #b8b196;
      --accent: #ffd600; --accent-text: #111111; --character: #23345a; --learner: #4a3f12;
      --good: #2bbd52; --warn: #ff9a5c; --edge: #ffd600; --pop: 3px 3px 0 #000000; --dots: rgba(255, 255, 255, .06);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14182b; --surface: #1f2540; --text: #fff6d6; --muted: #b8b196;
    --accent: #ffd600; --accent-text: #111111; --character: #23345a; --learner: #4a3f12;
    --good: #2bbd52; --warn: #ff9a5c; --edge: #ffd600; --pop: 3px 3px 0 #000000; --dots: rgba(255, 255, 255, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 700 16px/1.45 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
    background-image: radial-gradient(circle, var(--dots) 1.3px, transparent 1.7px); background-size: 10px 10px;
  }
  button, input { font: inherit; color: inherit; }
  button {
    background: var(--surface); border: 2.5px solid var(--edge); border-radius: 12px; box-shadow: var(--pop);
    padding: 6px 12px; min-height: 38px; cursor: pointer; font-weight: 700;
  }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button:disabled { opacity: .5; cursor: default; }
  .call { display: flex; flex-direction: column; height: 620px; max-width: 760px; margin: 0 auto; }
  .call.full { height: 100vh; }

  .head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border-bottom: 2.5px solid var(--edge); }
  .avatar { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-text); border: 2.5px solid var(--edge); font-family: 'Bangers', Impact, sans-serif; font-size: 1.5rem; }
  .call[data-state="speaking"] .avatar { animation: talk 1.2s ease-in-out infinite; }
  @keyframes talk { 50% { transform: scale(1.08); } }
  .caller { flex: 1; min-width: 0; }
  .caller-name { font-family: 'Bangers', Impact, sans-serif; font-weight: 400; letter-spacing: .05em; font-size: 1.35rem; line-height: 1.1; }
  .caller-sub { font-size: .85rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .pill { font-size: .8rem; padding: 2px 10px; border: 2px solid var(--muted); border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .call[data-state="listening"] .pill { color: var(--warn); border-color: currentColor; }
  .call[data-state="speaking"] .pill, .call[data-state="thinking"] .pill { color: var(--accent); border-color: currentColor; }
  .icon { min-width: 38px; padding: 4px 8px; }

  .words { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
  .words:empty { display: none; }
  .words button { border-radius: 999px; white-space: nowrap; flex: none; font-size: .9rem; padding: 4px 12px; }
  .words button.said { background: var(--good); color: #fff; }
  .words button.next { outline: 3px dashed var(--accent); outline-offset: 2px; }
  .words button.peeked { opacity: .75; }
  .task { margin: 0 12px 6px; padding: 8px 12px; background: var(--surface); border: 2.5px dashed var(--accent); border-radius: 12px; }
  .task[hidden] { display: none; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 18px; }
  .msg { position: relative; padding: 10px 14px; border: 2.5px solid var(--edge); border-radius: 18px; box-shadow: var(--pop); max-width: 85%; }
  .msg.partner { background: var(--character); align-self: flex-start; }
  .msg.learner { background: var(--learner); align-self: flex-end; }
  .msg.pending { opacity: .7; }
  .who { display: block; font-size: .75rem; color: var(--muted); }
  .translation { font-size: .85rem; color: var(--muted); margin-top: 4px; font-style: italic; }
  .tools { display: flex; gap: 8px; margin-top: 6px; }
  .tools button { min-height: 30px; padding: 1px 10px; font-size: .8rem; }
  .coach { align-self: stretch; padding: 10px 14px; border: 2.5px solid var(--warn); border-radius: 14px; background: var(--surface); }
  .coach.good { border-color: var(--good); }
  .coach .fix { font-size: 1.05rem; }
  .coach .tip { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .coach .tools button { min-height: 34px; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 6px; }
  .suggest button { border-radius: 999px; font-size: .85rem; min-height: 32px; padding: 2px 12px; }
  .note { font-size: .8rem; color: var(--muted); text-align: center; padding: 0 14px; }
  .note:empty { display: none; }

  .dock { padding: 8px 12px 12px; background: var(--surface); border-top: 2.5px solid var(--edge); }
  .umlauts { display: flex; gap: 6px; margin-bottom: 6px; }
  .umlauts button { min-width: 40px; min-height: 32px; padding: 1px 8px; }
  .umlauts button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .composer { display: flex; gap: 8px; align-items: center; }
  .composer input { flex: 1; min-width: 0; padding: 9px 12px; border: 2.5px solid var(--edge); border-radius: 12px; background: var(--bg); }
  .mic { width: 54px; height: 54px; border-radius: 50%; padding: 0; font-size: 1.4rem; flex: none; }
  .mic[aria-pressed="true"] { background: var(--warn); color: #fff; animation: talk 1.2s ease-in-out infinite; }
  .switches { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: .8rem; color: var(--muted); }
  .switches label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 24px; }
</style>
</head>
<body>
<main id="call" class="call" data-state="idle">
  <header class="head">
    <div id="avatar" class="avatar" aria-hidden="true">T</div>
    <div class="caller">
      <div id="name" class="caller-name">Talkloop</div>
      <div id="sub" class="caller-sub">Starting…</div>
    </div>
    <span id="pill" class="pill">Ready</span>
    <button id="full" class="icon" type="button" title="Full screen" aria-label="Full screen">⛶</button>
  </header>
  <div id="words" class="words" aria-label="Today's words"></div>
  <div id="task" class="task" hidden></div>
  <section id="scroll" class="scroll" aria-live="polite">
    <p class="empty">Waiting for your partner…</p>
  </section>
  <div id="suggest" class="suggest"></div>
  <p id="note" class="note"></p>
  <footer class="dock">
    <div id="umlauts" class="umlauts">
      <button type="button" data-ch="ä">ä</button><button type="button" data-ch="ö">ö</button>
      <button type="button" data-ch="ü">ü</button><button type="button" data-ch="ß">ß</button>
      <button type="button" id="shift" aria-pressed="false" title="Capital letter">⇧</button>
    </div>
    <form id="form" class="composer">
      <input id="input" autocomplete="off" placeholder="Speak, or type in German…" aria-label="Your answer" />
      <button id="send" type="submit">Send</button>
      <button id="mic" class="mic" type="button" aria-pressed="false" title="Speak" aria-label="Speak">🎙️</button>
    </form>
    <div class="switches">
      <label><input id="autosend" type="checkbox" checked /> Send after a pause</label>
      <label><input id="handsfree" type="checkbox" checked /> Listen again after each reply</label>
      <label><input id="speakreplies" type="checkbox" checked /> Read replies aloud</label>
    </div>
  </footer>
</main>
<script>
(() => {
  const ORIGIN = "__TALKLOOP_ORIGIN__";
  const SILENCE_MS = 1500; // as on Talkloop's page: a pause this long ends the turn
  const $ = (id) => document.getElementById(id);

  // ---------- the MCP Apps bridge (JSON-RPC with ChatGPT through postMessage) ----------
  let nextId = 1;
  const waiting = new Map();
  function post(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    const id = nextId++;
    post({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => {
      waiting.set(id, { resolve, reject });
      setTimeout(() => { if (waiting.delete(id)) reject(new Error(`${method}: no answer`)); }, 30000);
    });
  }
  function notify(method, params) { post({ jsonrpc: "2.0", method, params }); }
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && !m.method && waiting.has(m.id)) {
      const w = waiting.get(m.id);
      waiting.delete(m.id);
      m.error ? w.reject(new Error(m.error.message)) : w.resolve(m.result);
      return;
    }
    if (m.method === "ui/notifications/tool-result") showResult(m.params);
    else if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
    else if (m.id !== undefined) post({ jsonrpc: "2.0", id: m.id, result: {} }); // ping, teardown
  });

  // ChatGPT's own extras, where present (older hosts use only these).
  const openai = () => window.openai ?? null;
  window.addEventListener("openai:set_globals", () => { if (openai()?.toolOutput) showResult({ structuredContent: openai().toolOutput }); });

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    if (ctx.displayMode) $("call").classList.toggle("full", ctx.displayMode === "fullscreen");
  }

  async function connect() {
    try {
      const r = await request("ui/initialize", {
        appInfo: { name: "talkloop", version: "1.0.0" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        protocolVersion: "2026-01-26",
      });
      applyContext(r?.hostContext);
      notify("ui/notifications/initialized", {});
    } catch (e) {
      console.warn("Talkloop: no MCP Apps host", e);
    }
    if (openai()?.toolOutput) showResult({ structuredContent: openai().toolOutput });
    new ResizeObserver(() => notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight })).observe(document.body);
  }

  // What the learner says goes into the chat as their message; ChatGPT answers with talkloop_turn.
  async function sendToChat(text) {
    if (openai()?.sendFollowUpMessage) {
      try { await openai().sendFollowUpMessage({ prompt: text, scrollToBottom: false }); return; } catch { /* the standard way below */ }
    }
    await request("ui/message", { role: "user", content: [{ type: "text", text }] });
  }

  // ---------- the practice ----------
  let screen = null;   // the server's view: {id, version, partner, mode, level, subtitle, words, messages}
  let pending = null;  // what the learner just said, until ChatGPT's turn shows it
  let spokenVersion = 0;
  let sayAgain = null; // the correction to repeat, while "Say it again" waits for it
  let poll = null;

  function showResult(result) {
    const sc = result?.structuredContent;
    if (sc && sc.id && Array.isArray(sc.messages)) update(sc);
  }

  function update(next) {
    if (screen && next.id === screen.id && next.version <= screen.version) return;
    const first = !screen;
    screen = next;
    const last = screen.messages[screen.messages.length - 1];
    if (pending && last?.who === "partner") pending = null;
    render();
    if (last?.who === "partner" && screen.version > spokenVersion) {
      spokenVersion = screen.version;
      const learnerMsg = screen.messages[screen.messages.length - 2];
      sayAgain = learnerMsg?.who === "learner" && learnerMsg.correction ? learnerMsg.correction : null;
      setState("idle");
      if (!first || screen.messages.length <= 1) speak(last.text, () => maybeListen());
    }
  }

  // While ChatGPT writes its turn, ask the server too, in case the tool result doesn't reach this screen.
  function waitForTurn() {
    clearInterval(poll);
    const since = screen?.version ?? 0;
    const started = Date.now();
    poll = setInterval(async () => {
      if (!screen || screen.version > since || Date.now() - started > 120000) return clearInterval(poll);
      try {
        const res = await fetch(`${ORIGIN}/talkloop-screen/${encodeURIComponent(screen.id)}`);
        if (res.ok) update(await res.json());
      } catch { /* the tool result may still come */ }
    }, 1500);
  }

  function setState(state) {
    $("call").dataset.state = state;
    $("pill").textContent = { idle: "Your turn", listening: "Listening…", thinking: `${screen?.partner ?? "Partner"} is thinking…`, speaking: "Speaking", sayagain: "Say it again" }[state] ?? state;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    $("name").textContent = screen.partner;
    $("avatar").textContent = (screen.partner || "T").charAt(0);
    $("sub").textContent = `${screen.level} · ${screen.subtitle}`;

    const words = $("words");
    words.replaceChildren(...screen.words.map((w) => {
      const b = el("button", [w.state === "said" ? "said" : "", w.state === "peeked" ? "peeked" : "", w.next ? "next" : ""].join(" ").trim(),
        w.de ? `${w.state === "said" ? "✓ " : ""}${w.de}` : w.en);
      b.type = "button";
      b.title = w.de ? w.en : "Tap to see the German (then it counts as not recalled)";
      if (!w.de) b.addEventListener("click", () => peek(w));
      return b;
    }));

    const last = screen.messages[screen.messages.length - 1];
    $("task").hidden = !last?.task;
    $("task").textContent = last?.task ? `🎯 ${last.task}` : "";

    const scroll = $("scroll");
    const items = [];
    screen.messages.forEach((m, i) => {
      if (m.who === "learner") {
        items.push(bubble(m.text, "learner", "You"));
        if (m.correction || m.tip) items.push(coach(m, i === screen.messages.length - 2));
      } else {
        items.push(partnerBubble(m));
      }
    });
    if (pending) items.push(bubble(pending, "learner pending", "You"));
    scroll.replaceChildren(...(items.length ? items : [el("p", "empty", "Waiting for your partner…")]));
    scroll.scrollTop = scroll.scrollHeight;

    const sug = $("suggest");
    sug.replaceChildren(...(!pending && last?.who === "partner" ? last.suggestions ?? [] : []).map((s) => {
      const b = el("button", "", s);
      b.type = "button";
      b.addEventListener("click", () => { $("input").value = s; $("input").focus(); });
      return b;
    }));
  }

  function bubble(text, cls, who) {
    const d = el("div", `msg ${cls}`);
    d.append(el("span", "who", who), el("div", "", text));
    return d;
  }

  function partnerBubble(m) {
    const d = bubble(m.text, "partner", screen.partner);
    const tr = el("div", "translation", m.translation);
    tr.hidden = true;
    const tools = el("div", "tools");
    const replay = el("button", "", "🔊 Again");
    replay.type = "button";
    replay.addEventListener("click", () => speak(m.text));
    tools.append(replay);
    if (m.translation) {
      const t = el("button", "", "Translation");
      t.type = "button";
      t.addEventListener("click", () => { tr.hidden = !tr.hidden; });
      tools.append(t);
    }
    d.append(tr, tools);
    return d;
  }

  function coach(m, current) {
    const c = el("div", m.correction ? "coach" : "coach good");
    if (m.correction) c.append(el("div", "fix", `✏️ ${m.correction}`));
    if (m.tip) c.append(el("div", "tip", m.tip));
    if (m.correction && current) {
      const tools = el("div", "tools");
      const again = el("button", "", "🎙️ Say it again");
      again.type = "button";
      again.addEventListener("click", () => { sayAgain = m.correction; listen(); });
      const hear = el("button", "", "🔊 Hear it");
      hear.type = "button";
      hear.addEventListener("click", () => speak(m.correction));
      tools.append(again, hear);
      c.append(tools);
    }
    return c;
  }

  async function peek(w) {
    try {
      const r = await request("tools/call", { name: "talkloop_peek", arguments: { screen_id: screen.id, key: w.key } });
      if (r?.structuredContent) update(r.structuredContent);
    } catch (e) {
      note(`Couldn't show the word: ${e.message}`);
    }
  }

  function note(text) { $("note").textContent = text; }

  // ---------- sending ----------
  const normalize = (s) => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, " ").replace(/\s+/g, " ").trim();
  // How much of the correction a message says (0–1), and whether it is that sentence.
  function overlap(said, target) {
    const x = normalize(said).split(" "), y = normalize(target).split(" ");
    return y.filter((w) => x.includes(w)).length / Math.max(y.length, 1);
  }

  async function send(text) {
    text = text.trim();
    if (!text || !screen) return;
    $("input").value = "";
    note("");
    // "Say it again" is checked here, as on Talkloop's page: a repeat stays on the screen,
    // anything that isn't one (an answer to the question) goes on to ChatGPT.
    if (sayAgain) {
      const o = overlap(text, sayAgain);
      if (o >= 0.8 && normalize(text).split(" ").length <= normalize(sayAgain).split(" ").length + 2) {
        sayAgain = null;
        note("✓ Richtig! Now answer the question.");
        speak("Richtig!", () => maybeListen());
        return;
      }
      if (o >= 0.4) {
        note(`Not quite. Say: “${sayAgain}” (or answer the question to go on).`);
        return maybeListen();
      }
      sayAgain = null;
    }
    pending = text;
    render();
    setState("thinking");
    try {
      await sendToChat(text);
      waitForTurn();
    } catch (e) {
      pending = null;
      render();
      setState("idle");
      note(`Couldn't send: ${e.message}`);
    }
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); stopListening(); send($("input").value); });

  // ---------- umlauts: keys, "a → ä, as on Talkloop's page ----------
  let shift = false;
  function insert(ch) {
    const input = $("input");
    const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? s;
    const capital = shift || /(^|[.!?]\s+)$/.test(input.value.slice(0, s));
    const c = capital && ch !== "ß" ? ch.toUpperCase() : ch;
    input.value = input.value.slice(0, s) + c + input.value.slice(e);
    input.setSelectionRange(s + 1, s + 1);
    input.focus();
    shift = false;
    $("shift").setAttribute("aria-pressed", "false");
  }
  $("umlauts").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "shift") { shift = !shift; b.setAttribute("aria-pressed", String(shift)); return; }
    insert(b.dataset.ch);
  });
  const QUOTED = { a: "ä", o: "ö", u: "ü", s: "ß", A: "Ä", O: "Ö", U: "Ü" };
  $("input").addEventListener("input", (e) => {
    const input = e.target, at = input.selectionStart;
    const m = input.value.slice(0, at).match(/"([aousAOU])$/);
    if (m && e.inputType === "insertText") {
      input.value = input.value.slice(0, at - 2) + QUOTED[m[1]] + input.value.slice(at);
      input.setSelectionRange(at - 1, at - 1);
    }
  });

  // ---------- listening: the browser's speech recognition ----------
  const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
  let rec = null, silence = null, heard = "";
  function listen() {
    if (!Recognition) return note("This browser can't listen here: type, or use ChatGPT's own microphone.");
    stopSpeaking();
    stopListening();
    heard = "";
    rec = new Recognition();
    rec.lang = "de-DE";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (event) => {
      let finalText = "", interim = "";
      for (let i = 0; i < event.results.length; i++) {
        const r = event.results[i];
        if (r.isFinal) finalText += r[0].transcript + " ";
        else interim += r[0].transcript;
      }
      heard = (finalText + interim).trim();
      $("input").value = heard;
      clearTimeout(silence);
      // The turn ends this long after the last words heard, final or not.
      silence = setTimeout(() => endTurn(), SILENCE_MS);
    };
    rec.onerror = (event) => {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        $("handsfree").checked = false;
        note("ChatGPT didn't allow the microphone here. Type, or use ChatGPT's own microphone in the message box.");
      } else if (event.error !== "no-speech" && event.error !== "aborted") {
        note(`Listening stopped: ${event.error}`);
      }
    };
    rec.onend = () => {
      if (rec) { rec = null; $("mic").setAttribute("aria-pressed", "false"); if ($("call").dataset.state === "listening") setState("idle"); }
    };
    try {
      rec.start();
      $("mic").setAttribute("aria-pressed", "true");
      setState(sayAgain ? "sayagain" : "listening");
    } catch (e) {
      note(`Can't listen: ${e.message}`);
    }
  }
  function stopListening() {
    clearTimeout(silence);
    if (rec) { const r = rec; rec = null; try { r.stop(); } catch { /* already stopped */ } }
    $("mic").setAttribute("aria-pressed", "false");
  }
  function endTurn() {
    const text = heard;
    stopListening();
    if (!text) return setState("idle");
    if ($("autosend").checked) send(text);
    else setState("idle");
  }
  function maybeListen() {
    if ($("handsfree").checked && Recognition && $("call").dataset.state !== "thinking") listen();
  }
  $("mic").addEventListener("click", () => (rec ? endTurn() : listen()));

  // ---------- the voice: the browser's own German voice ----------
  const ROBOTIC = /^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy)\b/i;
  function germanVoice() {
    const voices = speechSynthesis.getVoices().filter((v) => v.lang?.toLowerCase().startsWith("de") && !ROBOTIC.test(v.name));
    return voices.find((v) => /natural|neural|google|premium|enhanced/i.test(v.name)) ?? voices[0] ?? null;
  }
  function speak(text, onDone) {
    if (!("speechSynthesis" in window) || !$("speakreplies").checked) return onDone?.();
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = 0.95;
    const v = germanVoice();
    if (v) u.voice = v;
    let done = false;
    const finish = () => { if (done) return; done = true; if ($("call").dataset.state === "speaking") setState("idle"); onDone?.(); };
    u.onend = finish;
    u.onerror = finish;
    setState("speaking");
    speechSynthesis.speak(u);
    // Some browsers stay silent until the page was tapped once: don't wait for ever.
    setTimeout(() => { if (!speechSynthesis.speaking) finish(); }, 1500);
  }
  function stopSpeaking() { if ("speechSynthesis" in window) speechSynthesis.cancel(); }
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

  // ---------- full screen ----------
  $("full").addEventListener("click", async () => {
    const full = $("call").classList.contains("full");
    try {
      const r = await request("ui/request-display-mode", { mode: full ? "inline" : "fullscreen" });
      $("call").classList.toggle("full", r?.mode === "fullscreen");
    } catch {
      openai()?.requestDisplayMode?.({ mode: full ? "inline" : "fullscreen" });
    }
  });

  connect();
})();
</script>
</body>
</html>
