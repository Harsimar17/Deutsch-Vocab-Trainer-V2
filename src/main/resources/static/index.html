<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useEffect, useRef, useMemo } = React;

// =====================================================================
// This page only renders. Every decision — which card comes next, the
// answer options, whether an answer is right, scores, the spaced-repetition
// schedule, streaks, story word meanings, the Phasentest, settings — is made
// by the Java backend (/backend). Components show the "view" the backend
// returns and send the learner's actions back. The only state kept here is
// what's on screen right now (open tab, flipped card, text being typed).
// =====================================================================

// ---------- BACKEND API ----------
// Served by the Spring Boot app, so everything is same-origin. Only a copy
// opened from GitHub Pages needs PROD_API_BASE: the backend's URL.
const ON_GITHUB_PAGES = location.hostname.endsWith("github.io");
const PROD_API_BASE = "";
const API_BASE = ON_GITHUB_PAGES ? PROD_API_BASE : "";
const API_CONFIGURED = !ON_GITHUB_PAGES || !!PROD_API_BASE;
// "Today" and the streak follow the learner's local midnight; the backend needs the zone.
const TIME_ZONE = (() => {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return "UTC"; }
})();

// Login session: the backend's JWT. It is the one thing kept in the browser
// (localStorage), so a reload stays logged in. Every API response carries a
// renewed token (X-Auth-Token) — the session ends after 24 h without a request.
// The token's own "exp" is checked before every call: an expired session goes
// straight to the login page without asking the server.
const session = (() => {
  const KEY = "wortschatz.session";
  let current = null; // { token, user: { uid, email } }
  const save = () => {
    try { if (current) localStorage.setItem(KEY, JSON.stringify(current)); else localStorage.removeItem(KEY); } catch (e) { /* storage blocked: memory only */ }
  };
  // exp from the JWT payload (base64url JSON), in ms; 0 if unreadable
  const expiresAt = (token) => {
    try {
      const p = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
      return typeof p.exp === "number" ? p.exp * 1000 : 0;
    } catch (e) { return 0; }
  };
  // drops an expired session; true while the session is usable
  const check = () => {
    if (current && current.token && expiresAt(current.token) > Date.now()) return true;
    if (current) { current = null; save(); }
    return false;
  };
  try { current = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { current = null; }
  check(); // opening the app with an expired token → login page right away
  return {
    user() { return check() ? current.user : null; },
    token() { return check() ? current.token : null; },
    async login(email, password) {
      const res = await fetch(API_BASE + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      let body = null;
      try { body = await res.json(); } catch (e) { /* non-JSON body */ }
      if (!res.ok) throw new Error((body && body.message) || "login failed: HTTP " + res.status);
      current = { token: body.token, user: body.user };
      save();
      return current.user;
    },
    renew(token) { if (current && token) { current.token = token; save(); } },
    logout() { current = null; save(); },
  };
})();

// ---------- LOADERS ----------
// A request started while a button is being clicked shows a spinner on that
// button (and blocks double clicks); any other request shows the thin bar at
// the top. Either appears only if the request takes longer than LOADER_DELAY,
// so fast responses don't flicker.
const LOADER_DELAY = 120;
let clickedButton = null;
document.addEventListener("click", (e) => {
  const b = e.target && e.target.closest ? e.target.closest("button") : null;
  clickedButton = b;
  setTimeout(() => { if (clickedButton === b) clickedButton = null; }, 0); // only for this click
}, true);

let barCount = 0;
function setBar(delta) {
  barCount = Math.max(0, barCount + delta);
  const bar = document.getElementById("net-bar");
  if (bar) bar.classList.toggle("on", barCount > 0);
}
function setButtonBusy(btn, delta) {
  btn.__busy = Math.max(0, (btn.__busy || 0) + delta);
  if (delta > 0 && btn.__busy === 1) {
    const cs = getComputedStyle(btn);
    btn.style.setProperty("--busy-color", cs.color);
    if (cs.position === "static") { btn.style.position = "relative"; btn.__busyPos = true; }
    btn.classList.add("btn-busy");
    btn.setAttribute("aria-busy", "true");
  } else if (btn.__busy === 0) {
    btn.classList.remove("btn-busy");
    btn.removeAttribute("aria-busy");
    btn.style.removeProperty("--busy-color");
    if (btn.__busyPos) { btn.style.position = ""; btn.__busyPos = false; }
  }
}
// Call when a request starts; returns the function to call when it ends.
function trackLoading(quiet) {
  if (quiet) return () => {};
  const btn = clickedButton;
  let shownOn = null;
  const timer = setTimeout(() => {
    if (btn && btn.isConnected) { shownOn = btn; setButtonBusy(btn, +1); }
    else { shownOn = "bar"; setBar(+1); }
  }, LOADER_DELAY);
  return () => {
    clearTimeout(timer);
    if (shownOn === "bar") setBar(-1);
    else if (shownOn) setButtonBusy(shownOn, -1);
  };
}

const api = (() => {
  let onError = null;
  let onLoggedOut = null;
  async function call(method, path, body, extraHeaders, quiet, keepalive) {
    const done = trackLoading(quiet); // runs synchronously, while the click is still being handled
    try {
      return await send(method, path, body, extraHeaders, keepalive);
    } finally {
      done();
    }
  }
  async function send(method, path, body, extraHeaders, keepalive) {
    if (!API_CONFIGURED) throw new Error("no backend configured (PROD_API_BASE is empty)");
    const headers = Object.assign({ "X-Time-Zone": TIME_ZONE }, extraHeaders);
    const token = session.token(); // null once expired — checked before anything is sent
    if (!token) {
      if (onLoggedOut) onLoggedOut();
      const err = new Error("session expired — please log in again");
      err.status = 401;
      throw err;
    }
    headers.Authorization = "Bearer " + token;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const res = await fetch(API_BASE + path, { method, headers, keepalive: !!keepalive, body: body === undefined ? undefined : JSON.stringify(body) });
    session.renew(res.headers.get("X-Auth-Token"));
    if (res.status === 401) {
      session.logout();
      if (onLoggedOut) onLoggedOut();
    }
    if (!res.ok) {
      let msg = "";
      try { msg = (await res.json()).message || ""; } catch (e) { /* non-JSON body */ }
      const err = new Error(msg || method + " " + path.split("?")[0] + " → HTTP " + res.status);
      err.status = res.status;
      throw err;
    }
    return res.status === 204 ? null : res.json();
  }
  return {
    setErrorHandler(fn) { onError = fn; },
    setLoggedOutHandler(fn) { onLoggedOut = fn; },
    get: (path, opts) => call("GET", path, undefined, undefined, opts && opts.quiet),
    // opts.keepalive: the request outlives the page (for saving on pagehide)
    post: (path, body, headers, opts) => call("POST", path, body === undefined ? {} : body, headers, opts && opts.quiet, opts && opts.keepalive),
    del: (path, opts) => call("DELETE", path, undefined, undefined, opts && opts.quiet),
    report(e) { if (onError) onError((e && e.message) || String(e)); },
  };
})();

// ---------- CONTENT (read straight from the JSON files — no API) ----------
// The vocabulary, stories and patterns come from static JSON: german_vocab.json
// from GitHub Pages (the bundled copy if that can't be reached) and
// patterns.json next to this page. Everything that only shows content — the
// story list and reader, Cards, Quiz, Articles, Separable verbs, Fill-in,
// Patterns — is built here from them. The backend is called only to check and
// save an answer, and for the learner's own saved data.
const VOCAB_URL = "https://harsimar17.github.io/Deutsch-Vocab-Helper/german_vocab.json";
const VOCAB_BUNDLED = API_BASE + "/data/german_vocab.json";
const PATTERNS_URL = API_BASE + "/data/patterns.json";

const getJson = (url, fresh) => fetch(url, fresh ? { cache: "no-cache" } : undefined).then((r) => {
  if (!r.ok) throw new Error(url + " → HTTP " + r.status);
  return r.json();
});

let contentLoad = null;
// The files are read once per page load; loadContent(true) reads them again (after "+ Add word").
function loadContent(fresh) {
  if (!contentLoad || fresh) {
    contentLoad = Promise.all([
      getJson(VOCAB_URL, fresh).catch(() => getJson(VOCAB_BUNDLED)),
      getJson(PATTERNS_URL),
    ]).then(([vocab, patterns]) => buildContent(vocab, patterns));
    contentLoad.catch(() => { contentLoad = null; });
  }
  return contentLoad;
}

function useContent(reload) {
  const [content, setContent] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => {
    let live = true;
    loadContent().then((c) => { if (live) setContent(c); }).catch((e) => { if (live) setError(e.message); });
    return () => { live = false; };
  }, [reload]);
  return [content, error];
}

const str = (o) => (o == null ? "" : String(o));
const strOrNull = (o) => (o == null || String(o) === "" ? null : String(o));
const asList = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === "object") : []);
const storyId = (o) => (o == null ? null : typeof o === "number" ? String(Math.trunc(o)) : String(o));
const reEscape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const pick1 = (list) => list[Math.floor(Math.random() * list.length)];

// --- cards (as CardCatalog builds them: key = "lvl|cat|de", first one wins) ---
const LEVELS = ["A1", "A2", "B1"];
const NOUN_CATS = ["der", "die", "das"];
const PLAIN_CATS = [["adjectives", "adj"], ["verbs", "verb"], ["separable_verbs", "sep"], ["function_words", "func"], ["phrases", "phrase"]];
const isNoun = (c) => NOUN_CATS.includes(c.cat);

function buildCards(vocab) {
  const byKey = new Map();
  const add = (lvl, cat, e) => {
    const de = str(e.de);
    const key = lvl + "|" + cat + "|" + de;
    if (!byKey.has(key)) byKey.set(key, { key, de, en: str(e.en), cat, lvl, example: strOrNull(e.example), prefix: strOrNull(e.prefix) });
  };
  const levels = (vocab && vocab.levels) || {};
  for (const lvl of LEVELS) {
    const level = levels[lvl];
    if (!level || typeof level !== "object") continue;
    const nouns = level.nouns || {};
    for (const art of NOUN_CATS) for (const e of asList(nouns[art])) add(lvl, art, e);
    for (const [field, cat] of PLAIN_CATS) for (const e of asList(level[field])) add(lvl, cat, e);
  }
  return byKey;
}

// --- German text helpers (as German.java) ---
const SEP_PREFIXES = ["auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um", "zurück", "weg", "hin", "her", "fest", "los", "teil", "statt", "durch", "heraus", "zusammen", "vorbei", "fern", "bei", "mit"];
const SEP_COMMON = ["auf", "an", "aus", "ein", "mit", "nach", "vor", "zu", "ab", "um"];
const PLURAL_NOTE = /\s*\((?:Pl\.|WG)\)/g;
const stripArticle = (de) => str(de).replace(/^(der|die|das)\s+/, "");
function nounForms(card) {
  return str(card.de).replace(PLURAL_NOTE, "").trim().split(" / ")
    .map((s) => s.replace(/^(der|die|das)\s+/i, "").trim()).filter(Boolean);
}
// A noun's example sentence split around the noun (Fill-in).
function clozeMatch(card) {
  const sentence = str(card.example);
  if (!sentence) return null;
  for (const f of nounForms(card)) {
    const m = new RegExp(reEscape(f), "iu").exec(sentence);
    if (m) return { before: sentence.slice(0, m.index), answer: m[0], after: sentence.slice(m.index + m[0].length) };
  }
  return null;
}
// Infinitive and separable prefix of a separable verb.
function sepParts(card) {
  const de = str(card.de).trim().replace(/^sich\s+/i, "").replace(/\s+(mit|auf|an|über|für|zu|nach|von|in|bei|um)$/i, "").trim();
  const inf = de.split(" ")[0] || de;
  let prefix = card.prefix;
  if (!prefix) prefix = SEP_PREFIXES.find((p) => inf.toLowerCase().startsWith(p)) || "";
  return { inf, prefix: prefix.toLowerCase() };
}
// The example sentence with the (last) free-standing prefix blanked out.
function sepCloze(card, prefix) {
  const ex = str(card.example).trim();
  if (!ex || !prefix) return null;
  const re = new RegExp("(^|[\\s(])(" + reEscape(prefix) + ")(?=[\\s.,!?;:)]|$)", "giu");
  let at = -1, m;
  while ((m = re.exec(ex)) !== null) at = m.index + m[1].length;
  if (at < 0) return null;
  return { before: ex.slice(0, at), answer: ex.slice(at, at + prefix.length), after: ex.slice(at + prefix.length) };
}

// --- word meanings in running text (as WordLookup.java) ---
const IRREGULAR = new Map();
const FIXED = new Map();
const STRIP_SUFFIXES = ["test", "tet", "ten", "est", "ern", "en", "em", "er", "es", "et", "st", "te", "e", "n", "s", "t"];
const GLOSS_TYPE_CAT = { verbs: "verb", adjectives: "adj", separable_verbs: "sep", function_words: "func", phrases: "phrase" };
[["sein", "bin bist ist sind seid war warst waren gewesen wäre wären"], ["haben", "hat hast habe hatte hatten gehabt hätte hätten"],
  ["werden", "wird wirst wurde wurden geworden würde würden"], ["können", "kann kannst konnte konnten könnte könnten"],
  ["müssen", "muss musst musste mussten müsste"], ["wollen", "will willst wollte wollten"], ["dürfen", "darf darfst durfte durften dürfte"],
  ["sollen", "soll sollst sollte sollten"], ["mögen", "mag magst mochte"], ["wissen", "weiß weißt wusste gewusst"],
  ["geben", "gibt gab gaben gegeben"], ["sehen", "sieht sah sahen gesehen"], ["lesen", "liest las gelesen"],
  ["fahren", "fährt fuhr fuhren gefahren"], ["nehmen", "nimmt nahm nahmen genommen"], ["sprechen", "spricht sprach sprachen gesprochen"],
  ["helfen", "hilft half geholfen"], ["gehen", "ging gingen gegangen"], ["kommen", "kam kamen gekommen"], ["essen", "isst aß gegessen"],
  ["treffen", "trifft traf trafen getroffen"], ["schlafen", "schläft schlief"], ["laufen", "läuft lief"], ["tragen", "trägt trug"],
  ["halten", "hält hielt"], ["finden", "fand fanden gefunden"], ["bleiben", "blieb blieben geblieben"], ["schreiben", "schrieb geschrieben"],
  ["stehen", "stand standen gestanden"], ["sitzen", "saß gesessen"], ["liegen", "lag gelegen"], ["denken", "dachte gedacht"],
  ["bringen", "brachte gebracht"], ["kennen", "kannte gekannt"], ["tun", "tat tut getan"], ["rufen", "rief gerufen"],
  ["verstehen", "verstand verstanden"], ["gelten", "gilt galt gegolten"], ["wachsen", "wächst wuchs gewachsen"], ["bekommen", "bekam bekamen bekommt"],
].forEach(([inf, forms]) => forms.split(" ").forEach((f) => IRREGULAR.set(f, inf)));
// closed-class words the stemmer would get wrong ("meine" is not "meinen")
[["mein meine meinen meinem meiner meines", "mein", "my"], ["dein deine deinen deinem deiner deines", "dein", "your (informal)"],
  ["seine seinen seinem seiner seines", "sein", "his / its"], ["ihre ihren ihrem ihrer ihres", "ihr", "her / their / your (formal)"],
  ["unser unsere unseren unserem unserer unseres", "unser", "our"], ["euer eure euren eurem eurer eures", "euer", "your (plural)"],
  ["dem den des", "der / die / das", "the"], ["im", "im = in dem", "in the"], ["am", "am = an dem", "at / on the"],
  ["ans", "ans = an das", "to the"], ["ins", "ins = in das", "into the"], ["zum", "zum = zu dem", "to the"], ["zur", "zur = zu der", "to the"],
  ["vom", "vom = von dem", "from / of the"], ["beim", "beim = bei dem", "at / at the"], ["sich", "sich", "oneself / himself / herself / themselves"],
  ["mich mir", "ich → mich / mir", "me"], ["dich dir", "du → dich / dir", "you"], ["ihn ihm", "er → ihn / ihm", "him"],
  ["uns", "wir → uns", "us / ourselves"], ["euch", "ihr → euch", "you (plural)"], ["ihnen", "sie → ihnen", "them"],
  ["manche manchen mancher manches", "manche", "some"], ["andere anderen anderer anderes anderem", "andere", "other(s)"], ["mehr", "mehr", "more"],
].forEach(([forms, head, en]) => forms.split(" ").forEach((f) => FIXED.set(f, { head, en, cat: "func", lvl: null, example: null })));

function glossCat(g) {
  if (g.type === "noun") {
    let article = strOrNull(g.article);
    if (article == null) { const m = /^(der|die|das)\b/i.exec(str(g.de)); article = m ? m[1] : "der"; }
    return article.toLowerCase();
  }
  return GLOSS_TYPE_CAT[str(g.type)] || null;
}

// Forms → meaning, case-sensitive ("Essen" ≠ "essen") with a lowercase fallback. First entry wins.
class Dict {
  constructor() { this.exact = new Map(); this.lower = new Map(); }
  put(form, g) {
    if (!form) return;
    if (!this.exact.has(form)) this.exact.set(form, g);
    const lf = form.toLowerCase();
    if (!this.lower.has(lf)) this.lower.set(lf, g);
  }
  // Index one entry under its bare form(s): article/"sich"/"(Pl.)" removed, " / " alternatives split.
  add(de, en, cat, lvl, example, verbish) {
    const cleaned = str(de).replace(PLURAL_NOTE, "").split("(sich)").join("sich").trim();
    const heads = cleaned.split(/\s+\/\s+/).map((h) => h.trim()).filter(Boolean);
    const ens = str(en).split(/\s+\/\s+/);
    const paired = heads.length > 1 && ens.length === heads.length; // "ich / du" ↔ "I / you"
    heads.forEach((h, i) => {
      const art = /^(der|die|das)\s/i.exec(h);
      const gCat = art && /^(der|die|das)$/.test(str(cat).toLowerCase()) ? art[1].toLowerCase() : cat;
      const g = { head: paired ? h : cleaned, en: paired ? ens[i].trim() : en, cat: gCat, lvl, example };
      const form = h.replace(/^(der|die|das)\s+/i, "").replace(/^sich\s+/i, "").replace(/\s*(\.\.\.|…)$/, "").trim();
      this.put(form, g);
      if (verbish && form.includes(" ")) this.put(form.split(" ")[0], g); // "aufhören mit" → also "aufhören"
      if (form.includes("...") || form.includes("…")) for (const piece of form.split(/\s*(?:\.\.\.|…)\s*/)) this.put(piece.trim(), g);
    });
  }
  addGlossary(glossary) {
    for (const g of asList(glossary)) {
      const type = str(g.type);
      this.add(str(g.de), str(g.en), glossCat(g), "B1", strOrNull(g.example), type === "verbs" || type === "separable_verbs");
    }
  }
}

// Plausible base forms of an inflected word, most likely first.
function candidates(word) {
  const lw = word.toLowerCase();
  const out = [];
  const push = (s) => { if (s && s.length >= 2) out.push(s); };
  out.push(lw);
  if (IRREGULAR.has(lw)) push(IRREGULAR.get(lw));
  // prefixed irregulars: annimmt → an + nehmen, verhält → ver + halten
  IRREGULAR.forEach((inf, k) => { if (k.length >= 4 && lw.length - k.length >= 2 && lw.endsWith(k)) push(lw.slice(0, lw.length - k.length) + inf); });
  const bases = [lw];
  for (const p of SEP_PREFIXES) {
    if ((lw.startsWith(p + "ge") || lw.startsWith(p + "zu")) && lw.length > p.length + 4) { bases.push(p + lw.slice(p.length + 2)); break; }
  }
  if (lw.startsWith("ge") && lw.length > 5) bases.push(lw.slice(2)); // gekündigt → kündigt
  for (const b of bases) {
    if (b !== lw) push(b);
    push(b + "en"); push(b + "n");
    for (const suf of STRIP_SUFFIXES) {
      if (b.endsWith(suf) && b.length - suf.length >= 3) {
        const stem = b.slice(0, b.length - suf.length);
        push(stem); push(stem + "en"); push(stem + "n"); push(stem + "e");
      }
    }
  }
  return out;
}

class WordLookup {
  constructor(dicts) { this.dicts = dicts; this.found = new Map(); }
  lookup(word) {
    if (this.found.has(word)) return this.found.get(word);
    let hit = FIXED.get(word.toLowerCase()) || null;
    if (!hit) for (const d of this.dicts) { hit = d.exact.get(word) || null; if (hit) break; }
    if (!hit) {
      outer: for (const c of candidates(word)) for (const d of this.dicts) { const h = d.lower.get(c); if (h) { hit = h; break outer; } }
    }
    if (!hit && word.includes("-")) hit = this.lookup(word.slice(word.lastIndexOf("-") + 1)); // "Kinder-Betreuung" → "Betreuung"
    this.found.set(word, hit);
    return hit;
  }
  // A **marked** target span: whole span, each " / " part, a split separable verb, each word, then the closest glossary entry.
  lookupTarget(span, glossary) {
    const clean = span.replace(PLURAL_NOTE, "").replace(/^(der|die|das|den|dem|des)\s+/i, "").trim();
    let hit = this.lookup(clean);
    if (hit) return hit;
    const parts = clean.split(/\s+\/\s+/);
    if (parts.length > 1) for (const p of parts) { hit = this.lookup(p.replace(/^(der|die|das)\s+/i, "")); if (hit) return hit; }
    const pair = clean.replace(/^sich\s+/i, "").split(/\s+/);
    if (pair.length === 2 && SEP_PREFIXES.includes(pair[1].toLowerCase())) {
      hit = this.lookup(pair[1].toLowerCase() + pair[0].toLowerCase());
      if (hit) return hit;
    }
    if (clean.includes(" ")) {
      const words = clean.split(/\s+/).filter((w) => w.length > 2).sort((a, b) => b.length - a.length);
      for (const w of words) { hit = this.lookup(w); if (hit) return hit; }
    }
    const lw = clean.toLowerCase();
    let best = null, bestLen = 4;
    for (const g of asList(glossary)) {
      const f = str(g.de).replace(/^(der|die|das)\s+/i, "").replace(/^sich\s+/i, "").toLowerCase();
      let n = 0;
      while (n < f.length && n < lw.length && f[n] === lw[n]) n++;
      if (n > bestLen) { bestLen = n; best = g; }
    }
    return best ? { head: str(best.de), en: str(best.en), cat: glossCat(best), lvl: "B1", example: strOrNull(best.example) } : null;
  }
}

// --- stories (as StoryService.java) ---
const TARGET = /\*\*(.+?)\*\*/g;
const WORD = /[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g;
const paragraphsOf = (text) => str(text).split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

function plainSegments(part, lookup, segs) {
  if (!part) return;
  let last = 0, m;
  const re = new RegExp(WORD.source, "g");
  while ((m = re.exec(part)) !== null) {
    if (m.index > last) segs.push({ t: part.slice(last, m.index) });
    const g = m[0].length > 1 ? lookup.lookup(m[0]) : null;
    segs.push(g ? { w: m[0], entry: g } : { t: m[0] });
    last = m.index + m[0].length;
  }
  if (last < part.length) segs.push({ t: part.slice(last) });
}

// Paragraph → segments: {t} plain text, or {w, entry, target} for a word with a meaning.
function segmentsOf(para, lookup, glossary) {
  const segs = [];
  let last = 0, m;
  const re = new RegExp(TARGET.source, "g");
  while ((m = re.exec(para)) !== null) {
    plainSegments(para.slice(last, m.index), lookup, segs);
    segs.push({ w: m[1], entry: lookup.lookupTarget(m[1], glossary), target: true });
    last = m.index + m[0].length;
  }
  plainSegments(para.slice(last), lookup, segs);
  return segs;
}

function buildContent(vocab, patternsRaw) {
  const byKey = buildCards(vocab);
  const cards = [...byKey.values()];
  const st = (vocab && vocab.stories) || {};
  const items = asList(st.items);
  const byId = new Map(items.map((s) => [storyId(s.id), s]));
  const seen = new Set();
  const groups = [];
  for (const p of asList(st.phases)) {
    const list = [];
    for (const cid of Array.isArray(p.chapter_ids) ? p.chapter_ids : []) {
      const s = byId.get(storyId(cid));
      if (s) { list.push(s); seen.add(storyId(cid)); }
    }
    if (list.length) groups.push({ phase: p, index: p.index == null ? null : String(Math.trunc(Number(p.index))), stories: list });
  }
  const rest = items.filter((s) => !seen.has(storyId(s.id))).sort((a, b) => (Number(a.chapter) || 0) - (Number(b.chapter) || 0));
  if (rest.length) groups.push({ phase: { name: "Weitere Geschichten" }, index: null, stories: rest });
  const flat = groups.flatMap((g) => g.stories);

  // every story glossary first, then all vocabulary cards (A1 → B1)
  const global = new Dict();
  items.forEach((s) => global.addGlossary(s.glossary));
  for (const c of cards) global.add(c.de, c.en, c.cat, c.lvl, c.example, c.cat === "verb" || c.cat === "sep");

  const readers = new Map();
  const brief = (s) => ({ id: storyId(s.id), chapter: s.chapter == null ? "" : s.chapter });
  function reader(id) {
    if (readers.has(id)) return readers.get(id);
    const story = byId.get(id);
    if (!story) return null;
    const glossary = asList(story.glossary);
    const own = new Dict();
    own.addGlossary(glossary);
    const lookup = new WordLookup([own, global]);
    const de = paragraphsOf(story.story_de), en = paragraphsOf(story.story_en);
    const paragraphs = de.map((para, i) => {
      const segments = segmentsOf(para, lookup, glossary);
      return { segments, en: i < en.length ? en[i] : null, speech: segments.map((sg) => (sg.t != null ? sg.t : sg.w)).join("") };
    });
    const i = flat.findIndex((s) => storyId(s.id) === id);
    let endsPhase = null;
    for (const g of groups) {
      const ids = g.phase.chapter_ids;
      if (g.index && Array.isArray(ids) && ids.length && storyId(ids[ids.length - 1]) === id) endsPhase = g.index;
    }
    const v = {
      id, chapter: story.chapter, phaseName: story.phase_name, titleDe: story.title_de, titleEn: story.title_en, paragraphs,
      glossary: glossary.map((g) => ({ de: str(g.de), en: str(g.en), cat: glossCat(g) || "" })),
      prev: i > 0 ? brief(flat[i - 1]) : null, next: i >= 0 && i < flat.length - 1 ? brief(flat[i + 1]) : null, endsPhase,
    };
    readers.set(id, v);
    return v;
  }

  // The story list; read marks and phase test statuses come from the learner's progress (null until it has loaded).
  function storyList(progress) {
    const read = new Set(progress ? progress.read : []);
    const tests = (progress && progress.tests) || {};
    let readCount = 0;
    const out = groups.map((g) => {
      const stories = g.stories.map((s) => {
        const id = storyId(s.id);
        if (read.has(id)) readCount++;
        return { id, chapter: s.chapter, titleDe: s.title_de, titleEn: s.title_en,
          words: s.target_count != null ? s.target_count : asList(s.glossary).length, read: read.has(id) };
      });
      const t = (g.index && tests[g.index]) || {};
      return { phase: { index: g.index, name: g.phase.name, description: g.phase.description, note: g.phase.note },
        stories, allRead: stories.every((s) => s.read), test: t.test || null, verbTest: t.verbTest || null };
    });
    return { level: st.level || "B1", count: byId.size, readCount, total: flat.length, groups: out };
  }

  // patterns.json, each example read as one sentence (for 🔊)
  const patterns = asList(patternsRaw).map((p) => Object.assign({}, p, {
    examples: asList(p.examples).map((e) => Object.assign({}, e, {
      sentence: asList(e.chunks).map((c) => c.text).join(" ").replace(/\s+([,.!?])/g, "$1"),
    })),
  }));

  return {
    cards, card: (key) => byKey.get(key) || null,
    pool: (levels, cats) => cards.filter((c) => levels.includes(c.lvl) && cats.includes(c.cat)),
    reader, storyList, patterns,
  };
}

// Saves one answer of a round the page runs (the backend checks it against the card and saves it).
function saveAnswer(mode, key, pick, onChange) {
  return api.post("/api/answers", { mode, key, pick }, undefined, { quiet: true })
    .then((r) => { if (onChange) onChange(r); return r; })
    .catch((e) => { api.report(e); return null; });
}

// A round the page runs itself: a plain object built from the content, changed
// in place by the component, which then re-renders.
function useRound(build, deps, reload) {
  const [content, error] = useContent(reload);
  const [, setTick] = useState(0);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  const round = useMemo(() => (content ? build(content) : null), [content, ...deps]);
  const update = useCallback((fn) => { if (round) { fn(round); setTick((n) => n + 1); } }, [round]);
  return { round, update, error };
}

// A practice round run by the backend: start it, render its view, send actions.
function useDrill(mode, params, version, onChange) {
  const [state, setState] = useState({ id: null, view: null, error: null });
  const busy = useRef(false);
  const paramsKey = JSON.stringify(params || {});
  const start = useCallback(() => {
    setState({ id: null, view: null, error: null });
    return api.post("/api/drills/" + mode, params || {})
      .then((r) => { setState({ id: r.id, view: r.view, error: null }); })
      .catch((e) => setState({ id: null, view: null, error: e.message }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mode, paramsKey, version]);
  useEffect(() => { start(); }, [start]);
  const act = useCallback((action, payload) => {
    if (!state.id || busy.current) return Promise.resolve();
    busy.current = true;
    return api.post("/api/drills/" + state.id + "/" + action, payload || {})
      .then((r) => { setState((s) => Object.assign({}, s, { view: r.view })); if (onChange) onChange(r); })
      .catch((e) => { if (e.status === 410) start(); else api.report(e); })
      .finally(() => { busy.current = false; });
  }, [state.id, start, onChange]);
  return { view: state.view, error: state.error, act };
}

  der: { label: "der", color: "#3A5A8C" },

  das: { label: "das", color: "#3F7A55" },
  adj: { label: "adj.", color: "#8A6A2B" },

// Category colours are concatenated with hex alpha (`${color}14`), so they
// can't be CSS variables — dark mode swaps in lighter hexes instead.
const CATEGORY_COLORS = {
  light: { der: "#3A5A8C", die: "#A5354A", das: "#3F7A55", adj: "#8A6A2B", verb: "#6B4A8A", sep: "#2E7D74", func: "#4A7A8C", phrase: "#B0722E" },
  dark: { der: "#6F8FC4", die: "#C96477", das: "#5E9E75", adj: "#BE9A55", verb: "#9C7CC0", sep: "#4FA398", func: "#6FA0B4", phrase: "#CC8E4E" },
};
function applyCategoryPalette(theme) {
  const pal = CATEGORY_COLORS[theme] || CATEGORY_COLORS.light;
  Object.keys(pal).forEach((k) => { if (CATEGORY_META[k]) CATEGORY_META[k].color = pal[k]; });
}
const catColor = (cat) => (CATEGORY_META[cat] || {}).color || "var(--ink)";

// Text-to-speech with the browser's German voice.
function speakGerman(text) {
  if (typeof window === "undefined" || !window.speechSynthesis) return;
  const clean = String(text || "")
    .replace(/\([^)]*\)/g, " ")
    .replace(/\s*\/\s*/g, ", ")
    .replace(/\s{2,}/g, " ")
    .trim();
  if (!clean) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE";
    u.rate = 0.9;
    const de = (window.speechSynthesis.getVoices() || []).find((v) => /^de(-|_)/i.test(v.lang));
    if (de) u.voice = de;
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech unsupported */ }
}
if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Example sentence for a card: the backend serves the saved one, or generates
// it with Gemini (using the key held in this page's memory) and saves it.
// A Gemini example sentence for the card — only asked for when a Gemini key is set.
function AiSentence({ card, apiKey }) {
  const [state, setState] = useState({ status: apiKey ? "loading" : "idle" });
  const [attempt, setAttempt] = useState(0);
  useEffect(() => {
    if (!apiKey) { setState({ status: "idle" }); return undefined; }
    let cancelled = false;
    setState({ status: "loading" });
    api.post("/api/sentences/generate", { de: card.de, en: card.en, cat: card.cat }, apiKey ? { "X-Gemini-Key": apiKey } : {}, { quiet: true })
      .then((d) => { if (!cancelled) setState(d.needsKey ? { status: "idle" } : { status: "done", data: d }); })
      .catch((e) => { if (!cancelled) setState({ status: "error", message: e.message }); });
    return () => { cancelled = true; };
  }, [card.de, apiKey, attempt]);

  if (state.status === "idle") {
    return (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.08em", color: "var(--ink-faint)", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>
        add a Gemini API key in settings ▸ for example sentences
      </div>
    );
  }
  if (state.status === "loading") {
    return <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.1em", color: "var(--ink-faint)" }}>✨ writing a sentence …</div>;
  }
  if (state.status === "error") {
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--bad)", maxWidth: "min(420px, 90vw)", textAlign: "center", lineHeight: 1.5 }}>
          {state.message}
        </div>
        <button onClick={() => setAttempt((a) => a + 1)} style={{ ...smallOutline("var(--ink-soft)"), borderColor: "var(--line)" }}>retry</button>
      </div>
    );
  }
  return (
    <div style={{
      display: "flex", alignItems: "center", justifyContent: "center", gap: "10px", maxWidth: "min(440px, 92vw)",
      padding: "10px 14px", background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px", boxShadow: "var(--shadow-soft)",
    }}>
      <SpeakButton text={state.data.de} size={30} />
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "16px", color: "var(--ink)", lineHeight: 1.35 }}>{state.data.de}</div>
        {state.data.en && <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "13px", color: "var(--ink-soft)", marginTop: "3px" }}>{state.data.en}</div>}
        <div style={{ fontFamily: "var(--font-mono)", fontSize: "8px", letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--ink-faint)", marginTop: "5px" }}>✨ generated by Gemini</div>
      </div>
    </div>
  );
}

// ---------- PRACTICE MODES (each renders a backend drill) ----------

function DrillGate({ drill, children }) {
  if (drill.error) return <DrillError message={drill.error} />;
  if (!drill.view) return <Loading />;
  return children(drill.view, drill.act);
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Cards run in the page: the deck is the content's cards for the current
// settings. The ✗ / ✓ marks are kept here and saved in one call when the deck
// is done, the tab is left or the page is hidden.
const FLASH_RESULTS_PER_CALL = 200;
function saveFlashResults(results, keepalive) {
  const chunks = [];
  for (let i = 0; i < results.length; i += FLASH_RESULTS_PER_CALL) chunks.push(results.slice(i, i + FLASH_RESULTS_PER_CALL));
  return Promise.all(chunks.map((chunk) => api.post("/api/answers/batch", { results: chunk }, undefined, { quiet: true, keepalive })));
}

function Flashcards({ settings, version, onChange }) {
  const { levels, cats, direction, noRepeat } = settings;
  const [content, error] = useContent(version);
  const [order, setOrder] = useState(null);
  const [idx, setIdx] = useState(0);
  const [done, setDone] = useState(false);
  const [flipped, setFlipped] = useState(false);
  const pending = useRef([]);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange;

  const pool = useMemo(() => (content ? content.pool(levels, cats) : null), [content, version, levels.join(), cats.join()]);
  useEffect(() => {
    if (!pool) return;
    setOrder(shuffled(pool)); setIdx(0); setDone(false); setFlipped(false);
  }, [pool]);

  const flush = useCallback((keepalive) => {
    const results = pending.current;
    if (!results.length) return;
    pending.current = [];
    saveFlashResults(results, keepalive)
      .then((rs) => { if (onChangeRef.current) onChangeRef.current(rs[rs.length - 1]); })
      .catch((e) => { if (e.status !== 401) api.report(e); });
  }, []);
  // save on leaving the tab (cleanup), and when the page is hidden or closed
  useEffect(() => {
    const onHide = () => { if (document.visibilityState === "hidden") flush(true); };
    const onPageHide = () => flush(true);
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", onPageHide);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", onPageHide);
      flush();
    };
  }, [flush]);

  const total = order ? order.length : 0;
  const move = (to) => { setFlipped(false); setIdx(to); };
  const next = () => {
    if (idx + 1 < total) return move(idx + 1);
    if (noRepeat) { setDone(true); flush(); } else move(0);
  };
  const prev = () => move((idx - 1 + total) % total);
  const reshuffle = () => { setOrder(shuffled(pool)); setDone(false); move(0); };
  const mark = (knew) => { pending.current.push({ key: order[idx].key, knew }); next(); };

  // Enter: first reveals the card, then moves on (like "next ›").
  const nextRef = useRef(next);
  nextRef.current = next;
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (!order || done || !order.length) return;
      e.preventDefault();
      if (!flipped) setFlipped(true); else nextRef.current();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [order, done, flipped]);

  if (error) return <DrillError message={error} />;
  if (!order) return <Loading />;
  if (!order.length) return <p style={srsNote}>No cards match this filter — pick at least one category in settings ▸.</p>;
  if (done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {total} / {total} cards done 🎉</div>
        <button onClick={reshuffle} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }
  const c = order[idx];
  const front = direction === "en-de" ? c.en : c.de;
  const back = direction === "en-de" ? c.de : c.en;
  const meta = CATEGORY_META[c.cat] || { color: "var(--accent)" };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <div style={counterStyle}>{noRepeat ? `${idx + 1} / ${total} attempted` : `CARD ${idx + 1} / ${total}`}</div>
      <div onClick={() => setFlipped((f) => !f)} style={{ width: "min(440px, 92vw)", height: "280px", cursor: "pointer", perspective: "1400px" }}>
        <div style={{ position: "relative", width: "100%", height: "100%", transition: "transform 0.55s cubic-bezier(.2,.7,.2,1)", transformStyle: "preserve-3d", transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)" }}>
          <div style={{ ...cardFace, position: "absolute", inset: 0, width: "auto", backfaceVisibility: "hidden", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: "18px", padding: "28px" }}>
            <CatChip cat={c.cat} />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "de-en" && <SpeakButton text={c.de} />}
              <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: front.length > 28 ? "20px" : front.length > 16 ? "26px" : "34px", lineHeight: 1.25, letterSpacing: "-0.01em", color: "var(--ink)" }}>{front}</div>
            </div>
            <div style={{ ...monoLabel, letterSpacing: "0.16em" }}>tap or ⏎ to reveal</div>
          </div>
          <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", transform: "rotateY(180deg)", background: `linear-gradient(165deg, ${meta.color} 0%, ${meta.color}e0 100%)`, borderRadius: "16px", boxShadow: "var(--shadow-card)", display: "flex", alignItems: "center", justifyContent: "center", padding: "28px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px" }}>
              {direction === "en-de" && <SpeakButton text={c.de} />}
              <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: back.length > 28 ? "19px" : "25px", lineHeight: 1.3, color: "#FCF8EE", textAlign: "center", textShadow: "0 1px 8px rgba(0,0,0,.18)" }}>{back}</div>
            </div>
          </div>
        </div>
      </div>
      <div style={{ display: "flex", gap: "10px" }}>
        <button onClick={prev} style={navBtnStyle}>‹ prev</button>
        <button onClick={reshuffle} style={navBtnStyle}>⟲ shuffle</button>
        <button onClick={next} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
      </div>
      {flipped && (
        <div style={{ display: "flex", gap: "10px" }}>
          <button onClick={() => mark(false)} style={{ ...ghostBtn, color: "var(--bad)", border: "1px solid var(--bad)" }}>✗ review this</button>
          <button onClick={() => mark(true)} style={{ ...ghostBtn, color: "var(--good)", border: "1px solid var(--good)" }}>✓ knew it</button>
        </div>
      )}
      {flipped && c.example && (
        <div style={{ display: "flex", alignItems: "center", gap: "10px", maxWidth: "min(440px, 92vw)", padding: "10px 14px", background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px", boxShadow: "var(--shadow-soft)" }}>
          <SpeakButton text={c.example} size={30} />
          <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink)", lineHeight: 1.45 }}>{c.example}</div>
        </div>
      )}
    </div>
  );
}

// The Phasentest's Sentences tab, like Duolingo: the English on top, German
// tiles to tap into order — every word and verb of the phase once, then the
// missed ones again; after checking, how the word is used. Picking tiles is
// local; "check" sends the order.
const tileStyle = (used) => ({
  fontFamily: "var(--font-serif)", fontSize: "17px", padding: "8px 13px", borderRadius: "10px", cursor: used ? "default" : "pointer",
  border: "1px solid var(--line)", borderBottomWidth: "3px", background: used ? "var(--line)" : "var(--paper-raised)",
  color: used ? "transparent" : "var(--ink)", pointerEvents: used ? "none" : "auto",
});

// Where the target word's meaning sits in the English sentence: [start, end], or null.
// Tries each meaning ("complaints, symptoms" → "complaints", "symptoms"), then its stem
// ("complaint…"), always from the start of a word.
function hintRange(en, meaning) {
  const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const meanings = String(meaning || "").split(/[,;/]/)
    .map((m) => m.replace(/\([^)]*\)/g, "").replace(/^\s*(to|a|an|the|sich)\s+/i, "").trim()).filter((m) => m.length > 1);
  for (const m of meanings) {
    const r = new RegExp("\\b" + esc(m) + "[a-z'-]*", "i").exec(en);
    if (r) return [r.index, r.index + r[0].length];
  }
  for (const m of meanings) {
    const first = m.split(/\s+/)[0];
    if (first.length < 4) continue;
    const r = new RegExp("\\b" + esc(first.slice(0, Math.max(4, first.length - 2))) + "[a-z'-]*", "i").exec(en);
    if (r) return [r.index, r.index + r[0].length];
  }
  return null;
}

// A word with a hint that shows on hover (and on tap, for phones).
function HintWord({ hint, children }) {
  const [open, setOpen] = useState(false);
  return (
    <span onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)} onClick={() => setOpen((o) => !o)}
      style={{ position: "relative", borderBottom: "2px dotted var(--accent)", cursor: "help" }}>
      {children}
      {open && (
        <span role="tooltip" style={{
          position: "absolute", bottom: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)", width: "max-content", maxWidth: "260px",
          background: "var(--ink)", color: "var(--paper)", fontFamily: "var(--font-serif)", fontSize: "14px", fontWeight: 400, lineHeight: 1.3,
          padding: "6px 10px", borderRadius: "8px", boxShadow: "var(--shadow-soft)", zIndex: 5, pointerEvents: "none",
        }}>{hint}</span>
      )}
    </span>
  );
}

function PhaseSentences({ idx, onChange }) {
  const drill = useDrill("sentences", { phase: idx }, 0, onChange);
  const v = drill.view;
  const [picked, setPicked] = useState([]);
  const itemId = v && v.item ? v.position + "|" + v.item.tiles.join(" ") : null;
  useEffect(() => { setPicked([]); }, [itemId]);
  useEffect(() => { if (v && v.verdict && v.answer) speakGerman(v.answer.de); }, [v && v.verdict]);
  // Enter checks the sentence, and once checked moves on to the next one.
  const keyRef = useRef(null);
  keyRef.current = () => {
    if (!v || !v.item || v.done) return false;
    if (v.verdict) { drill.act("next"); return true; }
    if (picked.length) { drill.act("check", { words: picked.map((i) => v.item.tiles[i]) }); return true; }
    return false;
  };
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (keyRef.current()) e.preventDefault(); // and keep a focused tile or button from being pressed too
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <DrillGate drill={drill}>{(v, act) => {
      const stat = (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "8px", width: "100%" }}>
          <div style={{ ...counterStyle, textAlign: "center" }}>
            {v.retry ? `RETRY · ${v.total} MISSED WORDS` : `ROUND · ${v.total} WORDS`}
            <span style={{ marginLeft: "10px" }}><span style={{ color: "var(--good)" }}>✓ {v.right}</span> · <span style={{ color: "var(--bad)" }}>✗ {v.missed}</span></span>
          </div>
          <div style={{ ...monoLabel, fontSize: "9px" }}>Phase: {v.phaseDone} / {v.words} words written right</div>
          <div style={{ width: "min(520px, 94vw)", height: "4px", borderRadius: "2px", background: "var(--line)", overflow: "hidden" }}>
            <div style={{ height: "100%", width: `${v.words ? (v.phaseDone / v.words) * 100 : 0}%`, background: "var(--accent)", transition: "width .3s" }} />
          </div>
        </div>
      );
      const reset = () => { if (window.confirm("Satz-Fortschritt dieser Phase zurücksetzen und von vorn beginnen?")) act("reset"); };
      if (v.empty) {
        return (
          <div style={srsCol}>
            {stat}

      }

        return (
          <div style={{ ...srsCol, padding: "30px 0" }}>

            <button onClick={reset} style={navBtnStyle}>⟲ start the phase over</button>
          </div>
        );
      }
      if (v.done) {
        return (
          <div style={{ ...srsCol, padding: "30px 0" }}>
            {stat}
            <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>{v.right} / {v.total} sentences right {v.missed === 0 ? "🎉" : ""}</div>
            <div style={{ ...srsNote, fontSize: "14px" }}>
              {v.missed === 0 ? (v.retry ? "All the missed words are right now." : "Every word of this round, right first time.")
                : `${v.missed} ${v.missed === 1 ? "word" : "words"} to practise again — each comes back with another sentence where there is one.`}
            </div>
            <div style={{ ...srsNote, fontSize: "13px" }}>
              {v.phaseOpen > 0 ? `${v.phaseOpen} words of this phase still to go — come back any time, your place is saved.` : "That was the last of this phase."}
            </div>
            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
              {v.missed > 0 && <button onClick={() => act("retryMissed")} style={navBtnStyle}>↻ retry {v.missed} missed</button>}
              {v.phaseOpen > 0
                ? <button onClick={() => act("nextRound")} style={v.missed > 0 ? ghostBtn : navBtnStyle}>▶ next round · {Math.min(v.roundWords, v.phaseOpen)} words</button>
                : <button onClick={reset} style={ghostBtn}>⟲ start the phase over</button>}
            </div>
          </div>
        );
      }
      const it = v.item;
      const checked = !!v.verdict;
      const used = new Set(picked);
      const pick = (i) => { if (!checked) setPicked((p) => (p.includes(i) ? p : [...p, i])); };
      const unpick = (i) => { if (!checked) setPicked((p) => p.filter((x) => x !== i)); };
      const ok = v.verdict === "correct";
      const at = it.hint ? it.en.indexOf(it.hint) : -1; // the sentence's own English for the word, else found from the meaning
      const hint = at >= 0 ? [at, at + it.hint.length] : hintRange(it.en, it.meaning);
      const hintText = <><strong>{it.word}</strong> = {it.meaning}</>;
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", width: "100%" }}>

            </div>
            {!checked && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", justifyContent: "center" }}>
                {it.tiles.map((w, i) => <button key={i} onClick={() => pick(i)} style={tileStyle(used.has(i))}>{w}</button>)}
              </div>
            )}
            {checked && (
              <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                <div style={{ ...monoLabel, color: ok ? "var(--good)" : "var(--bad)" }}>{ok ? "✓ correct" : v.verdict === "skipped" ? "skipped — the sentence" : "✗ correct answer"}</div>
                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <SpeakButton text={v.answer.de} size={30} />
                  <div style={{ fontFamily: "var(--font-serif)", fontSize: "18px", color: "var(--ink)" }}>{v.answer.de}</div>
                </div>
                {v.answer.use && (
                  <div style={{ marginTop: "4px", paddingTop: "8px", borderTop: "1px solid var(--line)" }}>
                    <div style={{ ...monoLabel, fontSize: "9px" }}>How to use {it.word}</div>
                    <div style={{ fontFamily: "var(--font-mono)", fontSize: "13px", color: "var(--accent)", marginTop: "4px" }}>{v.answer.use}</div>
                  </div>
                )}
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: "10px" }}>
            {checked
              ? <button onClick={() => act("next")} style={navBtnStyle}>{v.position < v.total ? "continue ›" : "finish"} ⏎</button>
              : <>
                  <button onClick={() => act("skip")} style={ghostBtn}>skip</button>

                    style={{ ...navBtnStyle, opacity: picked.length ? 1 : 0.4 }}>check ⏎</button>
                </>}
          </div>
        </div>
      );
    }}</DrillGate>
  );
}

// --- multiple-choice rounds the page runs (questions built here, answers checked and saved by the backend) ---

// Correct answer from source (or the pool); 3 distractors of the same category if there are enough.
function choiceQuestion(pool, source) {
  const correct = pick1(source && source.length ? source : pool);
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.key !== correct.key);
  const distract = sameCat.length >= 3 ? sameCat : pool.filter((d) => d.key !== correct.key);
  return { correct, options: shuffled(shuffled(distract).slice(0, 3).concat([correct])) };
}
// Next item: without repeats, one not asked yet (or done); otherwise any.
function nextOf(r, all, make) {
  if (r.noRepeat) {
    const remaining = all.filter((d) => !r.asked.has(d.key));
    if (!remaining.length) { r.done = true; r.picked = null; return; }
    make(remaining);
  } else {
    make(null);
  }
  r.picked = null;
}

function Quiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, direction, noRepeat } = settings;
  const [historyOpen, setHistoryOpen] = useState(false);
  const [history, setHistory] = useState(null); // {sessions, allTime}: loaded when the past rounds are opened
  const [allTime, setAllTime] = useState(null); // comes with each answer
  const ask = (r, source) => { r.q = choiceQuestion(r.pool, source); if (r.noRepeat) r.asked.add(r.q.correct.key); };
  const reset = (r) => { r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const x = { pool: content.pool(levels, cats), noRepeat, asked: new Set(), q: null, picked: null, right: 0, total: 0, saved: false, done: false };
    if (x.pool.length >= 4) reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.pool.length < 4) return <p style={srsNote}>Pick at least a couple categories in settings ▸ — need a few options to quiz from.</p>;

  const answer = (key) => {
    if (r.picked != null || r.done) return;
    const correctKey = r.q.correct.key;
    update((x) => { x.picked = key; x.right += key === correctKey ? 1 : 0; x.total += 1; x.saved = false; });
    saveAnswer("quiz", correctKey, key, onChange).then((res) => { if (res && res.allTime) setAllTime(res.allTime); });
  };
  const next = () => update((x) => nextOf(x, x.pool, (src) => ask(x, src)));
  const finish = () => {
    if (!r.total) return;
    api.post("/api/quiz-sessions", { right: r.right, total: r.total, cats }).then((h) => {
      setHistory(h); setAllTime(h.allTime);
      update((x) => { x.saved = true; x.right = 0; x.total = 0; });
    }).catch(api.report);
  };
  const openHistory = () => {
    setHistoryOpen((o) => !o);
    if (!history) api.get("/api/quiz-sessions", { quiet: true }).then((h) => { setHistory(h); setAllTime(h.allTime); }).catch(api.report);
  };
  const clearHistory = () => api.del("/api/quiz-sessions").then((h) => { setHistory(h); setAllTime(h.allTime); }).catch(api.report);

  const score = { right: r.right, total: r.total };
  const saveBtn = r.total > 0 && (
    <button onClick={finish} style={{ ...navBtnStyle, background: r.saved ? "var(--good)" : "transparent", border: `1px solid ${r.saved ? "var(--good)" : "var(--ink-muted)"}`, color: r.saved ? "#F6F1E5" : "var(--ink-muted)" }}>
      {r.saved ? "✓ saved" : "finish & save this round"}
    </button>
  );
  if (r.done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <ScoreLine score={score} />
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {r.pool.length} / {r.pool.length} words done 🎉</div>
        <div style={{ display: "flex", gap: "10px" }}>{saveBtn}<button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button></div>
      </div>
    );
  }
  const card = r.q.correct;
  const picked = r.picked != null;
  const options = r.q.options.map((o) => ({ key: o.key, text: direction === "en-de" ? o.de : o.en }));
  const sessions = history ? history.sessions : [];
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={score} extra={allTime && allTime.total > 0 && <span style={{ marginLeft: "14px", color: "var(--ink-faint)" }}>· ALL-TIME {allTime.right} / {allTime.total}</span>} />
      {r.noRepeat && <div style={{ ...counterStyle, fontSize: "11px", marginTop: "-10px" }}>{r.asked.size} / {r.pool.length} attempted</div>}
      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={card.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{direction === "en-de" ? card.en : card.de}</div>
          {direction === "en-de" && picked && <SpeakButton text={card.de} />}
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
      </div>
      <OptionList options={options} picked={r.picked} correctKey={picked ? card.key : null} onPick={answer} />
      {picked && <AiSentence card={card} apiKey={geminiKey} />}
      {saveBtn}
      <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px" }}>
          <button onClick={openHistory} style={{ ...counterStyle, fontSize: "11px", background: "transparent", border: "none", padding: 0, cursor: "pointer" }}>
            {historyOpen ? "▾" : "▸"} PAST ROUNDS{history ? ` (${sessions.length})` : ""}
          </button>
          {historyOpen && sessions.length > 0 && (
            <button onClick={() => { if (window.confirm("Clear all saved rounds? This can't be undone.")) clearHistory(); }} style={smallOutline("var(--bad)")}>clear history</button>
          )}
        </div>
        {historyOpen && history && (
          <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
            {!sessions.length && <div style={{ ...srsNote, fontSize: "13px" }}>No saved rounds yet.</div>}
            {sessions.map((s) => {
              const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
              const d = s.timestamp ? new Date(s.timestamp) : null;
              const dateStr = d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "";
              return (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--ink-soft)", background: "var(--paper-raised)", border: "1px solid var(--line-card)", borderRadius: "3px", padding: "7px 12px" }}>
                  <span>{dateStr}</span><span>{s.right}/{s.total} ({pct}%)</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

const ARTICLES = ["der", "die", "das"];
function ArticleQuiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, noRepeat } = settings;
  const ask = (r, source) => { r.word = pick1(source || r.nouns); if (r.noRepeat) r.asked.add(r.word.key); };
  const reset = (r) => { if (!r.nouns.length) return; r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const x = { nouns: content.pool(levels, cats).filter(isNoun), noRepeat, asked: new Set(), word: null, picked: null, right: 0, total: 0, done: false };
    reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (!r.nouns.length) return <p style={srsNote}>Select at least one of der / die / das in settings ▸ to practice articles.</p>;
  const score = { right: r.right, total: r.total };
  if (r.done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <ScoreLine score={score} />
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {r.nouns.length} / {r.nouns.length} nouns done 🎉</div>
        <button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }
  const word = r.word;
  const picked = r.picked != null;
  const answer = (art) => {
    if (picked) return;
    update((x) => { x.picked = art; x.right += art === word.cat ? 1 : 0; x.total += 1; });
    saveAnswer("articles", word.key, art, onChange);
  };
  const next = () => update((x) => nextOf(x, x.nouns, (src) => ask(x, src)));
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={score} />
      {r.noRepeat && <div style={{ ...counterStyle, fontSize: "11px", marginTop: "-10px" }}>{r.asked.size} / {r.nouns.length} attempted</div>}
      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          <SpeakButton text={picked ? word.de : stripArticle(word.de)} />
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "34px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{stripArticle(word.de)}</div>
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "8px" }}>{word.en}</div>
      </div>
      <div style={{ display: "flex", gap: "12px" }}>
        {ARTICLES.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = meta.color + "0d", color = meta.color, shadow = "none", border = meta.color + "66";
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#FCF8EE"; shadow = `0 10px 24px -10px ${meta.color}`; border = meta.color; }
            else if (art === r.picked) { bg = "var(--bad)"; color = "#FCF8EE"; border = "var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; }
          }
          return (
            <button key={art} onClick={() => answer(art)} style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", padding: "14px 30px", borderRadius: "12px", border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow, cursor: picked ? "default" : "pointer" }}>
              {art}
            </button>
          );
        })}
      </div>
      {picked && <AiSentence card={word} apiKey={geminiKey} />}
    </div>
  );
}

function SeparableVerbs({ settings, version, onChange, geminiKey }) {
  const { levels, cats } = settings;
  const ask = (r, avoidKey) => {
    const src = r.playable.length > 1 && avoidKey ? r.playable.filter((d) => d.key !== avoidKey) : r.playable;
    r.card = pick1(src);
    r.answer = sepParts(r.card).prefix;
    r.cloze = sepCloze(r.card, r.answer);
    r.options = shuffled(shuffled(SEP_COMMON.filter((p) => p !== r.answer)).slice(0, 3).concat([r.answer]));
    r.picked = null;
  };
  const { round: r, update, error } = useRound((content) => {
    const playable = content.pool(levels, cats).filter((d) => {
      if (d.cat !== "sep") return false;
      const prefix = sepParts(d).prefix;
      return !!prefix && sepCloze(d, prefix) != null;
    });
    const x = { playable, card: null, answer: null, cloze: null, options: [], picked: null, right: 0, total: 0 };
    if (playable.length >= 4) ask(x, null);
    return x;
  }, [version, levels.join(), cats.join()], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.playable.length < 4) return <p style={srsNote}>Not enough separable verbs in the current selection — turn on the <strong>trenn.</strong> category (and a level or two) in settings ▸.</p>;
  const picked = r.picked != null;
  const accent = CATEGORY_META.sep.color;
  const { inf } = sepParts(r.card);
  const sentence = (r.cloze.before + r.cloze.answer + r.cloze.after).trim();
  const answer = (opt) => {
    if (picked) return;
    update((x) => { x.picked = opt; x.right += opt === x.answer ? 1 : 0; x.total += 1; });
    saveAnswer("sep", r.card.key, opt, onChange);
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={{ right: r.right, total: r.total }} extra={<span style={{ marginLeft: "12px", color: "var(--ink-faint)" }}>· {r.playable.length} verbs</span>} />
      <div style={{ ...cardFace, position: "relative", padding: "26px 22px" }}>
        {picked && <button onClick={() => update((x) => ask(x, x.card.key))} style={{ ...navBtnStyle, position: "absolute", right: "14px", top: "18px", zIndex: 5, padding: "8px 14px", fontSize: "11px", borderRadius: "999px" }}>next ›</button>}
        <div style={{ marginBottom: "14px" }}><CatChip cat="sep" /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginBottom: "12px" }}>{picked ? `${inf} — ${r.card.en}` : r.card.en}</div>
        <GapSentence before={r.cloze.before} gap={r.cloze.answer} after={r.cloze.after} revealed={picked} accent={accent} minWidth="68px" />
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={sentence} size={30} />
            <div style={{ ...monoLabel, color: r.picked === r.answer ? "var(--good)" : "var(--bad)" }}>{r.picked === r.answer ? "richtig" : `→ ${r.answer}`}</div>
          </div>
        )}
      </div>
      <div style={monoLabel}>which prefix goes in the gap?</div>
      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "min(440px, 92vw)" }}>
        {r.options.map((opt) => {
          let bg = accent + "0d", color = accent, border = accent + "66", shadow = "none";
          if (picked) {
            if (opt === r.answer) { bg = accent; color = "#FCF8EE"; border = accent; shadow = `0 10px 24px -10px ${accent}`; }
            else if (opt === r.picked) { bg = "var(--bad)"; color = "#FCF8EE"; border = "var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; border = "var(--line-card)"; }
          }
          return (
            <button key={opt} onClick={() => answer(opt)} style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "19px", padding: "12px 24px", borderRadius: "12px", border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow, cursor: picked ? "default" : "pointer" }}>
              {opt}
            </button>
          );
        })}
      </div>
      {picked && <AiSentence card={r.card} apiKey={geminiKey} />}
    </div>
  );
}

function ClozeQuiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, noRepeat } = settings;
  const ask = (r, source) => {
    const q = choiceQuestion(r.clozePool, source);
    r.correct = q.correct; r.options = q.options; r.hit = clozeMatch(q.correct);
    if (r.noRepeat) r.asked.add(r.correct.key);
  };
  const reset = (r) => { if (r.clozePool.length < 4) return; r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const clozePool = content.pool(levels, cats).filter((d) => isNoun(d) && d.example && clozeMatch(d) != null);
    const x = { clozePool, noRepeat, asked: new Set(), correct: null, hit: null, options: [], picked: null, right: 0, total: 0, done: false };
    reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.clozePool.length < 4) return <p style={srsNote}>Fill-in-the-blank runs on example sentences — select <strong>der / die / das</strong> in settings ▸ (and enough nouns) to play.</p>;
  const score = { right: r.right, total: r.total };
  if (r.done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <ScoreLine score={score} />
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {r.clozePool.length} / {r.clozePool.length} sentences done 🎉</div>
        <button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }
  const picked = r.picked != null;
  const card = r.correct;
  const options = r.options.map((o) => ({ key: o.key, label: nounForms(o)[0] || o.de }));
  const sentence = (r.hit.before + r.hit.answer + r.hit.after).trim();
  const answer = (key) => {
    if (picked) return;
    update((x) => { x.picked = key; x.right += key === card.key ? 1 : 0; x.total += 1; });
    saveAnswer("cloze", card.key, key, onChange);
  };
  const next = () => update((x) => nextOf(x, x.clozePool, (src) => ask(x, src)));
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={score} />
      {r.noRepeat && <div style={{ ...counterStyle, fontSize: "11px", marginTop: "-10px" }}>{r.asked.size} / {r.clozePool.length} attempted</div>}
      <div style={{ ...cardFace, position: "relative", padding: "26px 22px" }}>
        {picked && <button onClick={next} style={{ ...navBtnStyle, position: "absolute", right: "14px", top: "18px", zIndex: 5, padding: "8px 14px", fontSize: "11px", borderRadius: "999px" }}>next ›</button>}
        <div style={{ marginBottom: "16px" }}><CatChip cat={card.cat} /></div>
        <GapSentence before={r.hit.before} gap={r.hit.answer} after={r.hit.after} revealed={picked} accent={catColor(card.cat)} />
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={sentence} size={30} />
            <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)" }}>{card.de} · {card.en}</div>
          </div>
        )}
      </div>
      <OptionList options={options} picked={r.picked} correctKey={picked ? card.key : null} onPick={answer} textKey="label" align="center" width="min(440px, 92vw)" />
      {picked && <AiSentence card={card} apiKey={geminiKey} />}
    </div>
  );
}

function MistakesReview({ version, onChange, geminiKey }) {
  const drill = useDrill("review", null, version, onChange);
  return (
    <DrillGate drill={drill}>{(v, act) => {
      if (v.total === 0 && (v.done || !v.card)) {
        return (
          <p style={srsNote}>
            Nothing to review yet. Words you miss in <strong>Quiz</strong>, <strong>Articles</strong>, <strong>Fill-in</strong> or <strong>Trennbare Verben</strong> — or flag with <strong>✗&nbsp;review&nbsp;this</strong> on a card — collect here and stay until <em>you</em> take them off. Revise them as often as you like.
          </p>
        );
      }
      if (v.done) {
        return (
          <div style={{ ...srsCol, padding: "32px 0" }}>
            <div style={counterStyle}>THIS ROUND {v.gotRight} / {v.answered} right</div>
            <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>{`${v.total} word${v.total === 1 ? "" : "s"} on the list`}</div>
            <div style={{ ...monoLabel, letterSpacing: "0.08em", textTransform: "none", textAlign: "center", maxWidth: "min(420px, 90vw)", lineHeight: 1.6 }}>words stay here until you take them off — revise as long as you like</div>
            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
              {v.missedThisRound > 0 && <button onClick={() => act("redoMissed")} style={navBtnStyle}>↻ redo the {v.missedThisRound} I missed</button>}
              <button onClick={() => act("reviewAll")} style={navBtnStyle}>⟲ review all {v.total}</button>
            </div>
          </div>
        );
      }
      const picked = v.picked != null;
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
          <div style={counterStyle}>REVIEW {v.position} / {v.queueSize}<span style={{ marginLeft: "14px", color: "var(--ink-faint)" }}>· {v.total} on list</span></div>
          <div style={{ textAlign: "center" }}>
            <div style={{ marginBottom: "10px" }}><CatChip cat={v.card.cat} /></div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
              {v.direction === "de-en" && <SpeakButton text={v.card.de} />}
              <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{v.prompt}</div>
              {v.direction === "en-de" && picked && <SpeakButton text={v.card.de} />}
              {picked && <button onClick={() => act("next")} style={navBtnStyle}>next ›</button>}
            </div>
            <div style={{ ...monoLabel, marginTop: "10px" }}>{v.wrong ? `missed ${v.wrong}×` : "flagged"}{v.right ? `  ·  got it ${v.right}×` : ""}</div>
          </div>
          <OptionList options={v.options} picked={v.picked} correctKey={v.correctKey} onPick={(key) => act("answer", { key })} />
          {picked && <AiSentence card={v.card} apiKey={geminiKey} />}
          {picked && <button onClick={() => act("remove")} style={{ ...ghostBtn, color: "var(--good)", border: "1px solid var(--good)" }}>✓ I know this — take it off the list</button>}
          <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", marginTop: "6px" }}>
            <button onClick={() => act("reshuffle")} style={{ ...smallOutline("var(--ink-soft)"), borderColor: "var(--line)" }}>⟲ reshuffle round</button>
            <button onClick={() => { if (window.confirm(`Clear all ${v.total} words from the review list? This can't be undone.`)) act("clearAll"); }} style={smallOutline("var(--bad)")}>clear whole list</button>
          </div>
        </div>
      );
    }}</DrillGate>
  );
}

  konj: { bd: "#6B4A8A", fg: "#6B4A8A", bg: "#6B4A8A12", cap: "Konjunktion" },

function ChunkRow({ chunks, big }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", justifyContent: "center", alignItems: "flex-end" }}>
      {chunks.map((ch, i) => {
        const m = CHUNK_ROLE[ch.role] || CHUNK_ROLE.mid;

        return (
          <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "3px" }}>
            <div style={{ fontFamily: "var(--font-serif)", fontSize: big ? "16px" : "14px", fontWeight: strong ? 700 : 500, padding: "6px 10px", borderRadius: "8px", lineHeight: 1.15, border: "1px solid " + m.bd, background: m.bg, color: m.fg }}>{ch.text}</div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "7.5px", letterSpacing: "0.05em", textTransform: "uppercase", color: "var(--ink-faint)", minHeight: "9px", textAlign: "center" }}>{ch.cap != null ? ch.cap : m.cap}</div>
          </div>
        );

const PATTERNS_SEEN = new Set(); // "day|key" already sent from this page

function PatternStudy({ onChange }) {
  const [content, error] = useContent();
  const patterns = content ? content.patterns : null;
  const [pi, setPi] = useState(0);
  // Looking at a pattern counts toward today's goal — once per pattern and day, so it is sent once.
  useEffect(() => {
    if (!patterns || !patterns[pi]) return;
    const mark = new Date().toDateString() + "|" + patterns[pi].key;
    if (PATTERNS_SEEN.has(mark)) return;
    PATTERNS_SEEN.add(mark);
    api.post("/api/patterns/" + encodeURIComponent(patterns[pi].key) + "/seen", undefined, undefined, { quiet: true }).then(onChange).catch(api.report);
  }, [patterns, pi]);
  if (error) return <DrillError message={error} />;
  if (!patterns) return <Loading />;
  const pat = patterns[pi];
  return (
    <div style={{ ...srsCol, width: "100%", maxWidth: "620px", margin: "0 auto", gap: "18px" }}>
      <div className="tabstrip" style={{ display: "flex", gap: "6px", overflowX: "auto", maxWidth: "100%", padding: "2px", scrollSnapType: "x proximity" }}>
        {patterns.map((p, i) => (
          <button key={p.key} onClick={() => setPi(i)} style={{
            flex: "0 0 auto", whiteSpace: "nowrap", scrollSnapAlign: "center", fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.03em", textTransform: "uppercase",
            padding: "8px 13px", borderRadius: "999px", cursor: "pointer", border: "1px solid " + (i === pi ? "var(--btn-border)" : "var(--line)"),
            background: i === pi ? "var(--btn-grad)" : "transparent", color: i === pi ? "#FCF8EE" : "var(--ink-soft)",
          }}>{p.name}</button>
        ))}
      </div>
      <div style={{ textAlign: "center", maxWidth: "min(480px, 92vw)" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "20px", fontWeight: 600, color: "var(--ink)", marginBottom: "6px" }}>{pat.name}</div>
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "14px", color: "var(--ink-soft)", lineHeight: 1.6 }}>{pat.rule}</div>
      </div>
      <div style={{ width: "100%", padding: "14px 12px", borderRadius: "12px", background: "var(--paper-raised)", border: "1px dashed var(--line)" }}>
        <div style={{ ...monoLabel, fontSize: "8px", letterSpacing: "0.18em", textAlign: "center", marginBottom: "10px" }}>the shape</div>
        <ChunkRow chunks={pat.skeleton} />
      </div>
      <div style={{ ...monoLabel, fontSize: "8px", letterSpacing: "0.16em" }}>{pat.examples.length} real sentences — same shape every time</div>
      {pat.examples.map((ex, i) => (
