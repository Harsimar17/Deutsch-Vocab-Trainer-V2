function WriteMode({ version, onChange, geminiKey }) {
  const drill = useDrill("write", null, version, onChange);
  const v = drill.view;
  const [val, setVal] = useState("");
  const inputRef = useRef(null);
  const answered = !!(v && v.verdict);
  useEffect(() => { setVal(""); }, [v && v.position, v && v.state]);
  useEffect(() => { if (inputRef.current && !answered) inputRef.current.focus(); }, [v && v.position, answered]);
  const check = () => drill.act("check", { input: val });
  // Enter checks the answer, then moves to the next word — even if focus left the text box.
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      const el = e.target;
      if (el && el !== inputRef.current && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (!v || v.state !== "card") return;
      e.preventDefault();
      if (answered) drill.act("next"); else check();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  return (
    <DrillGate drill={drill}>{(v, act) => {
      if (v.state === "noCategories") return <p style={srsNote}>No categories selected — turn some on in settings ▸.</p>;
      if (v.state === "nothingDue") return <p style={srsNote}>Nothing due to type right now. Set <strong>focus → everything</strong> in settings ▸ to practise producing any word.</p>;
      if (v.state === "roundDone") {
        return (
          <div style={{ ...srsCol, padding: "36px 0" }}>
            <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", textAlign: "center" }}>{v.typed} typed this round — ZING! fast fingers ⚡</div>
            <button onClick={() => act("keepGoing")} style={navBtnStyle}>⟲ keep going</button>
          </div>
        );
      }
      const ok = v.verdict === "correct";
      const close = v.verdict === "close";
      const tone = ok ? "var(--good)" : close ? "var(--accent)" : "var(--bad)";
      return (
        <div style={srsCol}>
          <div style={counterStyle}>{v.position} / {v.total} · TYPE IT IN GERMAN</div>
          <div style={{ textAlign: "center" }}>
            <div style={{ marginBottom: "10px" }}><CatChip cat={v.cat} /></div>
            <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: (v.en || "").length > 26 ? "20px" : "28px", color: "var(--ink)" }}>{v.en}</div>
            {v.isNoun && !answered && <div style={{ ...monoLabel, fontSize: "9px", letterSpacing: "0.14em", marginTop: "6px" }}>include the article</div>}
          </div>
          <input
            ref={inputRef} value={val} onChange={(e) => setVal(e.target.value)} readOnly={answered}
            placeholder="dein Deutsch…" autoCapitalize="off" autoCorrect="off" spellCheck={false}
            style={{ width: "min(440px, 92vw)", padding: "14px 16px", textAlign: "center", fontFamily: "var(--font-serif)", fontSize: "20px", border: "1px solid " + (answered ? tone : "var(--line)"), borderRadius: "12px", background: "var(--paper-raised)", color: "var(--ink)", outline: "none" }}
          />
          {!answered && (
            <React.Fragment>
              <UmlautButtons inputRef={inputRef} setVal={setVal} />
              <div style={{ ...monoLabel, fontSize: "9px", letterSpacing: "0.1em", marginTop: "-6px" }}>no umlaut key? tap above — or just type ae / oe / ue / ss</div>
              <button onClick={check} style={navBtnStyle}>check › <span style={{ opacity: 0.6 }}>⏎</span></button>
            </React.Fragment>
          )}
          {answered && (
            <div style={{ ...srsCol, gap: "10px" }}>
              <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.08em", color: tone }}>{ok ? "✓ Richtig" : close ? "≈ Fast — almost" : "✗ Noch nicht"}</div>
              {!ok && <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>{v.forms}</div>}
              {ok && v.spelled && <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink-soft)", textAlign: "center" }}>accepted — the umlaut spelling is <strong style={{ color: "var(--ink)" }}>{v.spelled}</strong></div>}
              {v.hint && <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)", textAlign: "center" }}>{v.hint}</div>}
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <SpeakButton text={v.card.de} />
                <button onClick={() => act("next")} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
              </div>
              <AiSentence card={v.card} apiKey={geminiKey} />
            </div>
          )}
        </div>
      );
    }}</DrillGate>
  );
}

// --- multiple-choice rounds the page runs (questions built here, answers checked and saved by the backend) ---

// Correct answer from source (or the pool); 3 distractors of the same category if there are enough.
function choiceQuestion(pool, source) {
  const correct = pick1(source && source.length ? source : pool);
  const sameCat = pool.filter((d) => d.cat === correct.cat && d.key !== correct.key);
  const distract = sameCat.length >= 3 ? sameCat : pool.filter((d) => d.key !== correct.key);
  return { correct, options: shuffled(shuffled(distract).slice(0, 3).concat([correct])) };
}
// Next item: without repeats, one not asked yet (or done); otherwise any.
function nextOf(r, all, make) {
  if (r.noRepeat) {
    const remaining = all.filter((d) => !r.asked.has(d.key));
    if (!remaining.length) { r.done = true; r.picked = null; return; }
    make(remaining);
  } else {
    make(null);
  }
  r.picked = null;
}

function Quiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, direction, noRepeat } = settings;
  const [historyOpen, setHistoryOpen] = useState(false);
  const [history, setHistory] = useState(null); // {sessions, allTime}: loaded when the past rounds are opened
  const [allTime, setAllTime] = useState(null); // comes with each answer
  const ask = (r, source) => { r.q = choiceQuestion(r.pool, source); if (r.noRepeat) r.asked.add(r.q.correct.key); };
  const reset = (r) => { r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const x = { pool: content.pool(levels, cats), noRepeat, asked: new Set(), q: null, picked: null, right: 0, total: 0, saved: false, done: false };
    if (x.pool.length >= 4) reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.pool.length < 4) return <p style={srsNote}>Pick at least a couple categories in settings ▸ — need a few options to quiz from.</p>;

  const answer = (key) => {
    if (r.picked != null || r.done) return;
    const correctKey = r.q.correct.key;
    update((x) => { x.picked = key; x.right += key === correctKey ? 1 : 0; x.total += 1; x.saved = false; });
    saveAnswer("quiz", correctKey, key, onChange).then((res) => { if (res && res.allTime) setAllTime(res.allTime); });
  };
  const next = () => update((x) => nextOf(x, x.pool, (src) => ask(x, src)));
  const finish = () => {
    if (!r.total) return;
    api.post("/api/quiz-sessions", { right: r.right, total: r.total, cats }).then((h) => {
      setHistory(h); setAllTime(h.allTime);
      update((x) => { x.saved = true; x.right = 0; x.total = 0; });
    }).catch(api.report);
  };
  const openHistory = () => {
    setHistoryOpen((o) => !o);
    if (!history) api.get("/api/quiz-sessions", { quiet: true }).then((h) => { setHistory(h); setAllTime(h.allTime); }).catch(api.report);
  };
  const clearHistory = () => api.del("/api/quiz-sessions").then((h) => { setHistory(h); setAllTime(h.allTime); }).catch(api.report);

  const score = { right: r.right, total: r.total };
  const saveBtn = r.total > 0 && (
    <button onClick={finish} style={{ ...navBtnStyle, background: r.saved ? "var(--good)" : "transparent", border: `1px solid ${r.saved ? "var(--good)" : "var(--ink-muted)"}`, color: r.saved ? "#F6F1E5" : "var(--ink-muted)" }}>
      {r.saved ? "✓ saved" : "finish & save this round"}
    </button>
  );
  if (r.done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <ScoreLine score={score} />
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {r.pool.length} / {r.pool.length} words done</div>
        <div style={{ display: "flex", gap: "10px" }}>{saveBtn}<button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button></div>
      </div>
    );
  }
  const card = r.q.correct;
  const picked = r.picked != null;
  const options = r.q.options.map((o) => ({ key: o.key, text: direction === "en-de" ? o.de : o.en }));
  const sessions = history ? history.sessions : [];
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={score} extra={allTime && allTime.total > 0 && <span style={{ marginLeft: "14px", color: "var(--ink-faint)" }}>· ALL-TIME {allTime.right} / {allTime.total}</span>} />
      {r.noRepeat && <div style={{ ...counterStyle, fontSize: "11px", marginTop: "-10px" }}>{r.asked.size} / {r.pool.length} attempted</div>}
      <div style={{ textAlign: "center" }}>
        <div style={{ marginBottom: "10px" }}><CatChip cat={card.cat} /></div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          {direction === "de-en" && <SpeakButton text={card.de} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "30px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{direction === "en-de" ? card.en : card.de}</div>
          {direction === "en-de" && picked && <SpeakButton text={card.de} />}
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
      </div>
      <OptionList options={options} picked={r.picked} correctKey={picked ? card.key : null} onPick={answer} />
      {picked && <AiSentence card={card} apiKey={geminiKey} />}
      {saveBtn}
      <div style={{ width: "min(420px, 90vw)", marginTop: "10px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px" }}>
          <button onClick={openHistory} style={{ ...counterStyle, fontSize: "11px", background: "transparent", border: "none", padding: 0, cursor: "pointer" }}>
            {historyOpen ? "▾" : "▸"} PAST ROUNDS{history ? ` (${sessions.length})` : ""}
          </button>
          {historyOpen && sessions.length > 0 && (
            <button onClick={() => { if (window.confirm("Clear all saved rounds? This can't be undone.")) clearHistory(); }} style={smallOutline("var(--bad)")}>clear history</button>
          )}
        </div>
        {historyOpen && history && (
          <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginTop: "10px" }}>
            {!sessions.length && <div style={{ ...srsNote, fontSize: "13px" }}>No saved rounds yet.</div>}
            {sessions.map((s) => {
              const pct = s.total ? Math.round((s.right / s.total) * 100) : 0;
              const d = s.timestamp ? new Date(s.timestamp) : null;
              const dateStr = d ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "";
              return (
                <div key={s.id} style={{ display: "flex", justifyContent: "space-between", fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--ink-soft)", background: "var(--paper-raised)", border: "1px solid var(--line-card)", borderRadius: "3px", padding: "7px 12px" }}>
                  <span>{dateStr}</span><span>{s.right}/{s.total} ({pct}%)</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

const ARTICLES = ["der", "die", "das"];
function ArticleQuiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, noRepeat } = settings;
  const ask = (r, source) => { r.word = pick1(source || r.nouns); if (r.noRepeat) r.asked.add(r.word.key); };
  const reset = (r) => { if (!r.nouns.length) return; r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const x = { nouns: content.pool(levels, cats).filter(isNoun), noRepeat, asked: new Set(), word: null, picked: null, right: 0, total: 0, done: false };
    reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (!r.nouns.length) return <p style={srsNote}>Select at least one of der / die / das in settings ▸ to practice articles.</p>;
  const score = { right: r.right, total: r.total };
  if (r.done) {
    return (
      <div style={{ ...srsCol, padding: "40px 0" }}>
        <ScoreLine score={score} />
        <div style={{ fontFamily: "var(--font-serif)", fontSize: "22px", color: "var(--ink)", textAlign: "center" }}>All {r.nouns.length} / {r.nouns.length} nouns done — der, die, das: DEFEATED! 🥊</div>
        <button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button>
      </div>
    );
  }
  const word = r.word;
  const picked = r.picked != null;
  const answer = (art) => {
    if (picked) return;
    update((x) => { x.picked = art; x.right += art === word.cat ? 1 : 0; x.total += 1; });
    saveAnswer("articles", word.key, art, onChange);
  };
  const next = () => update((x) => nextOf(x, x.nouns, (src) => ask(x, src)));
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={score} />
      {r.noRepeat && <div style={{ ...counterStyle, fontSize: "11px", marginTop: "-10px" }}>{r.asked.size} / {r.nouns.length} attempted</div>}
      <div style={{ textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "14px", flexWrap: "wrap" }}>
          <SpeakButton text={picked ? word.de : stripArticle(word.de)} />
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "34px", letterSpacing: "-0.01em", color: "var(--ink)" }}>{stripArticle(word.de)}</div>
          {picked && <button onClick={next} style={navBtnStyle}>next ›</button>}
        </div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "8px" }}>{word.en}</div>
      </div>
      <div style={{ display: "flex", gap: "12px" }}>
        {ARTICLES.map((art) => {
          const meta = CATEGORY_META[art];
          let bg = meta.color + "0d", color = meta.color, shadow = "none", border = meta.color + "66";
          if (picked) {
            if (art === word.cat) { bg = meta.color; color = "#FCF8EE"; shadow = `0 10px 24px -10px ${meta.color}`; border = meta.color; }
            else if (art === r.picked) { bg = "var(--bad)"; color = "#FCF8EE"; border = "var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; }
          }
          return (
            <button key={art} onClick={() => answer(art)} style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "21px", padding: "14px 30px", borderRadius: "12px", border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow, cursor: picked ? "default" : "pointer" }}>
              {art}
            </button>
          );
        })}
      </div>
      {picked && <AiSentence card={word} apiKey={geminiKey} />}
    </div>
  );
}

function SeparableVerbs({ settings, version, onChange, geminiKey }) {
  const { levels, cats } = settings;
  const ask = (r, avoidKey) => {
    const src = r.playable.length > 1 && avoidKey ? r.playable.filter((d) => d.key !== avoidKey) : r.playable;
    r.card = pick1(src);
    r.answer = sepParts(r.card).prefix;
    r.cloze = sepCloze(r.card, r.answer);
    r.options = shuffled(shuffled(SEP_COMMON.filter((p) => p !== r.answer)).slice(0, 3).concat([r.answer]));
    r.picked = null;
  };
  const { round: r, update, error } = useRound((content) => {
    const playable = content.pool(levels, cats).filter((d) => {
      if (d.cat !== "sep") return false;
      const prefix = sepParts(d).prefix;
      return !!prefix && sepCloze(d, prefix) != null;
    });
    const x = { playable, card: null, answer: null, cloze: null, options: [], picked: null, right: 0, total: 0 };
    if (playable.length >= 4) ask(x, null);
    return x;
  }, [version, levels.join(), cats.join()], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.playable.length < 4) return <p style={srsNote}>Not enough separable verbs in the current selection — turn on the <strong>trenn.</strong> category (and a level or two) in settings ▸.</p>;
  const picked = r.picked != null;
  const accent = CATEGORY_META.sep.color;
  const { inf } = sepParts(r.card);
  const sentence = (r.cloze.before + r.cloze.answer + r.cloze.after).trim();
  const answer = (opt) => {
    if (picked) return;
    update((x) => { x.picked = opt; x.right += opt === x.answer ? 1 : 0; x.total += 1; });
    saveAnswer("sep", r.card.key, opt, onChange);
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>
      <ScoreLine score={{ right: r.right, total: r.total }} extra={<span style={{ marginLeft: "12px", color: "var(--ink-faint)" }}>· {r.playable.length} verbs</span>} />
      <div style={{ ...cardFace, position: "relative", padding: "26px 22px" }}>
        {picked && <button onClick={() => update((x) => ask(x, x.card.key))} style={{ ...navBtnStyle, position: "absolute", right: "14px", top: "18px", zIndex: 5, padding: "8px 14px", fontSize: "11px", borderRadius: "999px" }}>next ›</button>}
        <div style={{ marginBottom: "14px" }}><CatChip cat="sep" /></div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginBottom: "12px" }}>{picked ? `${inf} — ${r.card.en}` : r.card.en}</div>
        <GapSentence before={r.cloze.before} gap={r.cloze.answer} after={r.cloze.after} revealed={picked} accent={accent} minWidth="68px" />
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>
            <SpeakButton text={sentence} size={30} />
            <div style={{ ...monoLabel, color: r.picked === r.answer ? "var(--good)" : "var(--bad)" }}>{r.picked === r.answer ? "richtig" : `→ ${r.answer}`}</div>
          </div>
        )}
      </div>
      <div style={monoLabel}>which prefix goes in the gap?</div>
      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "min(440px, 92vw)" }}>
        {r.options.map((opt) => {
          let bg = accent + "0d", color = accent, border = accent + "66", shadow = "none";
          if (picked) {
            if (opt === r.answer) { bg = accent; color = "#FCF8EE"; border = accent; shadow = `0 10px 24px -10px ${accent}`; }
            else if (opt === r.picked) { bg = "var(--bad)"; color = "#FCF8EE"; border = "var(--bad)"; }
            else { bg = "transparent"; color = "var(--ink-faint)"; border = "var(--line-card)"; }
          }
          return (
            <button key={opt} onClick={() => answer(opt)} style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "19px", padding: "12px 24px", borderRadius: "12px", border: `1.5px solid ${border}`, background: bg, color, boxShadow: shadow, cursor: picked ? "default" : "pointer" }}>
              {opt}
            </button>
          );
        })}
      </div>
      {picked && <AiSentence card={r.card} apiKey={geminiKey} />}
    </div>
  );
}

function ClozeQuiz({ settings, version, onChange, geminiKey }) {
  const { levels, cats, noRepeat } = settings;
  const ask = (r, source) => {
    const q = choiceQuestion(r.clozePool, source);
    r.correct = q.correct; r.options = q.options; r.hit = clozeMatch(q.correct);
    if (r.noRepeat) r.asked.add(r.correct.key);
  };
  const reset = (r) => { if (r.clozePool.length < 4) return; r.asked.clear(); r.done = false; r.picked = null; ask(r, null); };
  const { round: r, update, error } = useRound((content) => {
    const clozePool = content.pool(levels, cats).filter((d) => isNoun(d) && d.example && clozeMatch(d) != null);
    const x = { clozePool, noRepeat, asked: new Set(), correct: null, hit: null, options: [], picked: null, right: 0, total: 0, done: false };
    reset(x);
    return x;
  }, [version, levels.join(), cats.join(), noRepeat], version);
  if (error) return <DrillError message={error} />;
  if (!r) return <Loading />;
  if (r.clozePool.length < 4) return <p style={srsNote}>Fill-in-the-blank runs on example sentences — select <strong>der / die / das</strong> in settings ▸ (and enough nouns) to play.</p>;
  const score = { right: r.right, total: r.total };

        <button onClick={() => update(reset)} style={navBtnStyle}>⟲ start over</button>
      </div>

  const card = r.correct;
  const options = r.options.map((o) => ({ key: o.key, label: nounForms(o)[0] || o.de }));
  const sentence = (r.hit.before + r.hit.answer + r.hit.after).trim();
  const answer = (key) => {
    if (picked) return;
    update((x) => { x.picked = key; x.right += key === card.key ? 1 : 0; x.total += 1; });
    saveAnswer("cloze", card.key, key, onChange);

    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "18px" }}>

      <div style={{ ...cardFace, position: "relative", padding: "26px 22px" }}>
        {picked && <button onClick={next} style={{ ...navBtnStyle, position: "absolute", right: "14px", top: "18px", zIndex: 5, padding: "8px 14px", fontSize: "11px", borderRadius: "999px" }}>next ›</button>}
        <div style={{ marginBottom: "16px" }}><CatChip cat={card.cat} /></div>
        <GapSentence before={r.hit.before} gap={r.hit.answer} after={r.hit.after} revealed={picked} accent={catColor(card.cat)} />
        {picked && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", marginTop: "14px" }}>

// What each kind of connector does to the word order.
const CONNECTOR_TYPE = {
  pos0: { label: "Position 0 — word order stays", color: "var(--ink-soft)" },
  pos1: { label: "Position 1 — verb comes next", color: "var(--verb)" },
  end: { label: "Side sentence — verb to the end", color: "var(--good)" },
  zu: { label: "zu + infinitive at the end", color: "var(--good)" },
  pair: { label: "Two-part connector", color: "var(--konj)" },
};
const CONNECTOR_PICK = "connectorPick"; // last connector chosen, in this browser only

// The connector's own words ("nicht nur … sondern auch" → nicht, nur, sondern, auch), for colouring.
const connectorWords = (c) => str(c.name).toLowerCase().split(/[\s…]+/).filter(Boolean);

// An example sentence: the connector's words in purple, the [conjugated verb] in gold.
function ConnectorSentence({ text, words }) {
  const parts = str(text).split(/(\[[^\]]+\])/);
  return (
    <span>
      {parts.map((p, i) => {
        if (/^\[.*\]$/.test(p)) return <strong key={i} style={{ color: "var(--verb)", borderBottom: "2px solid var(--verb)" }}>{p.slice(1, -1)}</strong>;
        return p.split(/(\s+|[,.!?„“])/).map((t, j) => words.includes(t.toLowerCase())
          ? <strong key={i + "-" + j} style={{ color: "var(--konj)" }}>{t}</strong>
          : <React.Fragment key={i + "-" + j}>{t}</React.Fragment>);
      })}
    </span>
  );
}
const plainSentence = (text) => str(text).replace(/[\[\]]/g, "");

// Answers compare without case, punctuation or umlauts (ae/oe/ue/ss count), so typed and spoken answers both work.
const answerWords = (s) => str(s).toLowerCase()
  .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .replace(/-/g, "").replace(/[^a-z\s]/g, " ").split(/\s+/).filter(Boolean);

// Longest common run of words → which words of a and b match.
function wordMatch(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) {
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  }
  const inA = new Set(), inB = new Set();
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (a[i] === b[j]) { inA.add(i); inB.add(j); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { score: dp[0][0], inA, inB };
}

// The learner's answer against the accepted ones: ok, or the closest one and what differs.
function checkConnectorAnswer(input, answers) {
  const mine = answerWords(input);
  if (!mine.length) return null;
  const same = (a) => a.join(" ") === mine.join(" ");
  const options = answers.map((ans) => ({ ans, words: answerWords(ans) }));
  if (options.some((o) => same(o.words))) return { ok: true };
  let best = null;
  for (const o of options) {
    const m = wordMatch(mine, o.words);
    if (!best || m.score > best.m.score) best = { o, m };
  }
  const sorted = (w) => [...w].sort().join(" ");
  return { ok: false, closest: best.o.ans, closestWords: str(best.o.ans).split(/\s+/), mineWords: str(input).trim().split(/\s+/),
    orderOnly: sorted(mine) === sorted(best.o.words), m: best.m };
}

// Speech to text in German with the browser's recogniser (Chrome, Edge, Safari).
const Recognition = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
function useDictation(onText) {
  const [listening, setListening] = useState(false);
  const rec = useRef(null);
  useEffect(() => () => { if (rec.current) rec.current.abort(); }, []);
  const stop = () => { if (rec.current) rec.current.stop(); };
  const start = () => {
    if (!Recognition || listening) return;
    const r = new Recognition();
    r.lang = "de-DE";
    r.interimResults = true;
    r.continuous = false;
    r.onresult = (e) => {
      let text = "";
      for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      onText(text);
    };
    r.onend = () => { setListening(false); rec.current = null; };
    r.onerror = () => { setListening(false); };
    rec.current = r;
    setListening(true);
    try { r.start(); } catch (e) { setListening(false); }
  };
  return { supported: !!Recognition, listening, start, stop };
}

  const [revealed, setRevealed] = useState(false);
  const [showEn, setShowEn] = useState(false);
  const [score, setScore] = useState(0); // right the first time

  const ex = con && stage === "practice" ? con.exercises[order[pos]] : null;

// Tooltip with a word's meaning, as analysed by the backend. Portalled to
// <body> (the tab wrapper's transform would break position: fixed) and
// re-measured on scroll so it follows the word.
function WordTip({ tip }) {
  const { el, entry, word } = tip;
  const [, reflow] = useState(0);
  useEffect(() => {
    const onMove = () => reflow((n) => n + 1);
    window.addEventListener("scroll", onMove, true);
    window.addEventListener("resize", onMove);
    return () => { window.removeEventListener("scroll", onMove, true); window.removeEventListener("resize", onMove); };
  }, []);
  const rect = el.getBoundingClientRect();
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const w = Math.min(270, vw - 32);
  const cx = Math.min(Math.max(rect.left + rect.width / 2, w / 2 + 16), vw - w / 2 - 16);
  const above = rect.top > 170;
  const bare = String(entry.head || "").replace(/^(der|die|das)\s+/i, "").toLowerCase();
  return ReactDOM.createPortal(
    <div data-tip="1" role="tooltip" style={{
      position: "fixed", zIndex: 50, left: cx, width: w, boxSizing: "border-box", top: above ? rect.top - 8 : rect.bottom + 8,
      transform: above ? "translate(-50%, -100%)" : "translate(-50%, 0)", background: "var(--paper-raised)", border: "1px solid var(--line)",
      borderRadius: "12px", boxShadow: "var(--shadow-card)", padding: "12px 14px", textAlign: "left", animation: "tipIn .14s ease both",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px", flexWrap: "wrap" }}>
        <CatChip cat={entry.cat} />
        {entry.lvl && <span style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.12em", color: "var(--ink-faint)" }}>{entry.lvl}</span>}
        {tip.pinned && <span style={{ marginLeft: "auto" }}><SpeakButton text={entry.head} size={28} /></span>}
      </div>
      <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "17px", color: "var(--ink)", lineHeight: 1.3 }}>{entry.head}</div>
      <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "3px", lineHeight: 1.4 }}>{entry.en}</div>
      {word.toLowerCase() !== bare && <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "6px" }}>im Text: {word}</div>}
      {entry.example && <div style={{ fontFamily: "var(--font-serif)", fontSize: "13px", color: "var(--ink-soft)", marginTop: "8px", paddingTop: "8px", borderTop: "1px solid var(--line)", lineHeight: 1.45 }}>{entry.example}</div>}
    </div>,
    document.body
  );
}

// Phase test status from the backend, in words.
// What a phase test's two sets are called: the stories' target words, and the B1 verbs used in them.
const SET_NAME = { words: "Wörter", verbs: "Verben" };  // in the German texts

function testStatusText(s, unit = "words") {
  if (!s) return { text: "", tone: "var(--ink-faint)" };
  switch (s.kind) {
    case "refreshDue": return { text: "⏰ refresher due", tone: "var(--accent)" };
    case "practiceAgain": return { text: "↻ practise " + s.open + " " + unit + " again", tone: "var(--bad)" };
    case "passed": return { text: "✓ passed · next refresher " + new Date(s.due).toLocaleDateString(undefined, { day: "numeric", month: "short" }), tone: "var(--good)" };
    case "inProgress": return { text: s.mastered + " / " + s.total + " mastered", tone: "var(--ink-faint)" };
    default: return { text: s.total + " " + unit + " · not started yet", tone: "var(--ink-faint)" };
  }
}

// A line typed out letter by letter, with a blinking caret while it types.
function TypedLine({ text, speed = 26 }) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [n, setN] = useState(reduce ? text.length : 0);
  useEffect(() => {
    if (reduce) { setN(text.length); return undefined; }
    setN(0);
    let i = 0;
    const t = setInterval(() => { i += 1; setN(i); if (i >= text.length) clearInterval(t); }, speed);
    return () => clearInterval(t);
  }, [text]);
  return <div className="typed">{text.slice(0, n)}{n < text.length && <span className="caret" />}</div>;
}

);

// The story as a notebook page on a desk, like a mission briefing: the page
// slides in, the header types itself, the chapter is stamped, the paragraphs
// appear one by one. Words stay tappable for their meaning.
function StoryReader({ id, read, showEn, onRead, onSettings }) {
  const [content, error] = useContent();
  const story = content ? content.reader(id) : null;
  const [tip, setTip] = useState(null);
  const [glossOpen, setGlossOpen] = useState(false);
  const topRef = useRef(null);
  useEffect(() => {
    setTip(null); setGlossOpen(false);
    if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ block: "start" });
  }, [id]);
  // Close the tooltip on tap outside or Escape.
  useEffect(() => {
    if (!tip) return;
    const onDown = (e) => { if (e.target && e.target.closest && e.target.closest("[data-sw],[data-tip]")) return; setTip(null); };
    const onKey = (e) => { if (e.key === "Escape") setTip(null); };
    document.addEventListener("pointerdown", onDown);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("pointerdown", onDown); window.removeEventListener("keydown", onKey); };
  }, [tip]);

  const frame = { ...srsCol, width: "100%", maxWidth: "640px", margin: "0 auto", gap: "18px", alignItems: "stretch", scrollMarginTop: "12px" };
  if (error) return <DrillError message={error} />;
  if (content && !story) return <DrillError message={"no such story: " + id} />;
  if (!story) {
    return (
      <div ref={topRef} style={frame}>
        <div className="notebook" style={{ minHeight: "220px" }}>
          <div className="holes" />
          <TypedLine text="Lade Kapitel …" />
        </div>
      </div>
    );
  }
  const show = (e, key, seg, pinned) => setTip({ key, el: e.currentTarget, entry: seg.entry, word: seg.w, pinned });
  const setShowEn = (v) => onSettings("setStoryShowEn", v);
  const toggleRead = () => api.post("/api/stories/" + encodeURIComponent(story.id) + "/read").then((r) => onRead(story.id, r.read)).catch(api.report);
  const hover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
  const chapter = String(story.chapter).padStart(2, "0");

  return (
    <div ref={topRef} style={frame}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", flexWrap: "wrap" }}>
        <button onClick={() => onSettings("openStory", null)} style={miniBtn}>‹ all stories</button>
        <Switch on={!!showEn} onChange={setShowEn} label="English notes" />
      </div>
      <div className="notebook" key={story.id}>
        <div className="holes" />
        <PaperClip />
        <TypedLine text={"Leseauftrag" + (story.phaseName ? " · " + story.phaseName : "")} />
        <div className="stamp">KAPITEL {chapter}</div>
        <div className="title">{story.titleDe}</div>
        <div className="hand" style={{ fontSize: "20px", color: "#6b6150", marginTop: "2px" }}>{story.titleEn}</div>
        <div style={{ fontFamily: "'Special Elite', 'Courier New', monospace", fontSize: "11px", color: "var(--ink-faint)", margin: "10px 0 14px", lineHeight: 1.6 }}>
          <span className="st" style={{ fontFamily: "var(--font-serif)", fontSize: "13px" }}>underlined</span> = B1 target word · tap{hover ? " or hover" : ""} a word for its meaning
        </div>
        {story.paragraphs.map((p, pi) => (
          <div key={story.id + "-" + pi} className="reveal" style={{ display: "flex", gap: "10px", alignItems: "flex-start", marginBottom: "var(--rule)", animationDelay: (1.1 + pi * 0.18) + "s" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p className="para">
                {p.segments.map((seg, si) => {
                  if (seg.t != null) return <React.Fragment key={si}>{seg.t}</React.Fragment>;
                  const key = pi + "-" + si;
                  if (!seg.entry) return <span key={si} className="st">{seg.w}</span>;
                  const on = tip && tip.key === key;
                  return (
                    <span key={si} data-sw="1" className={(seg.target ? "st sw" : "sw") + (on ? " on" : "")}
                      onPointerEnter={(e) => { if (e.pointerType === "mouse" && !(tip && tip.pinned)) show(e, key, seg, false); }}
                      onPointerLeave={(e) => { if (e.pointerType === "mouse") setTip((t) => (t && !t.pinned ? null : t)); }}
                      onClick={(e) => { if (tip && tip.key === key && tip.pinned) setTip(null); else show(e, key, seg, true); }}>
                      {seg.w}

              {showEn && p.en && <p className="pencil">{p.en}</p>}

            <SpeakButton text={p.speech} size={30} />

                  </div>

      </div>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px", paddingTop: "4px" }}>
        <button onClick={toggleRead} style={{ ...navBtnStyle, background: read ? "var(--good)" : "transparent", border: "1px solid " + (read ? "var(--good)" : "var(--ink-muted)"), color: read ? "#F6F1E5" : "var(--ink-muted)", boxShadow: "none" }}>
          {read ? "✓ read" : "mark as read"}
        </button>
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {story.endsPhase && <button onClick={() => onSettings("openPhaseTest", story.endsPhase)} style={{ ...navBtnStyle, background: "var(--good)", borderColor: "var(--good)" }}>🎯 Phase test</button>}
          {story.prev && <button onClick={() => onSettings("openStory", story.prev.id)} style={navBtnStyle}>‹ Chapter {story.prev.chapter}</button>}
          {story.next && <button onClick={() => onSettings("openStory", story.next.id)} style={navBtnStyle}>Chapter {story.next.chapter} ›</button>}
        </div>
      </div>
      {tip && <WordTip tip={tip} />}
    </div>
  );
}

function MasteryBar({ status }) {
  const pct = status && status.total ? Math.round((status.mastered / status.total) * 100) : 0;
  return (
    <div style={{ width: "100%", height: "4px", background: "var(--line)", borderRadius: "999px", overflow: "hidden" }}>
      <div style={{ width: pct + "%", height: "100%", background: "var(--good)", transition: "width .3s ease" }} />
    </div>
  );
}

function PhaseTestPage({ idx, onSettings, onChange }) {
  const [set, setSet] = useState("words"); // "words" | "verbs" | "sentences" — the three tabs
  const [overview, setOverview] = useState(null);

  const [howOpen, setHowOpen] = useState(false);
  const load = useCallback(() => {
    if (set === "sentences") return; // a round of its own, no overview
    api.get("/api/phase-tests/" + idx + "?set=" + set).then(setOverview).catch((e) => setError(e.message));
  }, [idx, set]);
  useEffect(() => { load(); }, [load]);

  if (round) {
    return <PhaseRound key={round.n} idx={idx} set={set} refresh={round.refresh} retake={round.retake} onChange={onChange}
      onExit={() => { setRound(null); load(); }} onNext={() => setRound({ refresh: false, retake: round.retake, n: round.n + 1 })} />;

  if (error) return <DrillError message={error} />;

        <button onClick={() => onSettings("openPhaseTest", null)} style={miniBtn}>‹ all stories</button>
        <span style={{ ...monoLabel, fontSize: "9px", textAlign: "right" }}>🎯 Phasentest · {o.phase.name}</span>
      </div>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "26px", color: "var(--ink)" }}>Phasentest</div>
        <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "14px", color: "var(--ink-soft)", marginTop: "4px" }}>
          {o.phase.name} · {set === "verbs" ? s.total + " B1-Verben aus den " + o.phase.chapters + " Kapiteln" : s.total + " Wörter aus " + o.phase.chapters + " Kapiteln"}

function PhaseRound({ idx, set, refresh, retake, onExit, onNext, onChange }) {
  const drill = useDrill("phase", retake ? { phase: idx, set, retake } : { phase: idx, set, refresh }, 0, onChange);
  const v = drill.view;
  const nextRef = useRef(null);
  const answered = !!(v && v.answer);
  const qid = v ? v.state + "#" + v.position + "#" + v.total : "";
  // Focus "weiter" once answered — so Enter always does the obvious thing.
  useEffect(() => {
    if (v && v.state === "question" && answered && nextRef.current) nextRef.current.focus();
  }, [qid, answered]);
  useEffect(() => {
    if (!v || v.state !== "question") return;
    const onKey = (e) => {
      if (e.isComposing) return;
      const el = e.target;
      if (el && el !== nextRef.current && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (e.key === "Enter") {
        if (answered) { e.preventDefault(); drill.act("next"); }
      } else if (!answered && /^[1-4]$/.test(e.key) && v.options[+e.key - 1]) {
        drill.act("choose", { key: v.options[+e.key - 1].key });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const head = (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px" }}>
      <button onClick={v && v.state === "finished" ? onExit : () => { if (window.confirm(retake ? "Wiederholung abbrechen? Es wird kein Ergebnis gespeichert." : "Runde abbrechen? Bisherige Antworten bleiben gespeichert.")) onExit(); }} style={miniBtn}>
        {v && v.state === "finished" ? "‹ Overview" : "× Cancel round"}
      </button>
      <span style={{ ...monoLabel, fontSize: "9px", textAlign: "right" }}>🎯 Phasentest · {SET_NAME[set]}{retake ? " · Wiederholung" : ""}</span>
    </div>
  );
  const wrap = (children) => <div style={{ ...srsCol, width: "100%", maxWidth: "560px", margin: "0 auto", alignItems: "stretch", gap: "18px" }}>{head}{children}</div>;

  if (drill.error) return wrap(<DrillError message={drill.error} />);
  if (!v) return wrap(<Loading />);

  if (v.state === "finished") {
    const pct = v.first ? Math.round((v.right / v.first) * 100) : 0;
    const st = testStatusText(v.status);
    return wrap(
      <React.Fragment>
        <div style={{ textAlign: "center", padding: "20px 0 6px" }}>
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "24px", color: "var(--ink)" }}>{retake ? "Wiederholung fertig" : v.passedNow ? "Phase bestanden" : v.refresh ? "Auffrischung fertig" : "Runde fertig"}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.08em", color: "var(--ink-soft)", marginTop: "10px" }}>{v.right} / {v.first} {retake ? "richtig" : "beim ersten Versuch richtig"} ({pct}%)</div>
        </div>
        <MasteryBar status={v.status} />
        <div style={{ textAlign: "center", fontFamily: "var(--font-mono)", fontSize: "11px", color: st.tone }}>{st.text}</div>
        {retake && <p style={{ ...srsNote, fontSize: "14px" }}>Dein Fortschritt bleibt, wie er war — das Ergebnis steht in der Übersicht.</p>}
        {v.passedNow && <p style={{ ...srsNote, fontSize: "14px" }}>{set === "verbs" ? "Jedes Verb" : "Jedes Wort"} sitzt in beide Richtungen. Die erste Auffrischung ist morgen fällig — danach nach 7, 30, 90 und 180 Tagen.</p>}
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {retake ? <button onClick={onNext} style={navBtnStyle}>↻ Retake again</button>
            : v.status.open > 0 && <button onClick={onNext} style={navBtnStyle}>▶ Next round</button>}
          <button onClick={onExit} style={ghostBtn}>Overview</button>
        </div>
      </React.Fragment>
    );
  }

  const deEn = v.dir === "de-en";
  const a = v.answer;
  const tone = a ? (a.correct ? "var(--good)" : "var(--bad)") : "var(--line)";
  const verdictText = !a ? "" : a.correct ? "✓ Richtig" : retake ? "✗ Falsch" : "✗ Noch nicht — comes back shortly";
  return wrap(
    <React.Fragment>
      <MasteryBar status={v.status} />
      <div style={{ display: "flex", justifyContent: "space-between", ...monoLabel }}>
        <span>{deEn ? "DE → EN · erkennen" : "EN → DE · deutsches Wort wählen"}{v.relearn ? " · nochmal" : ""}</span>
        <span>{v.position} / {v.total}{v.refresh ? " · Auffrischung" : ""}</span>
      </div>
      <div style={{ textAlign: "center", padding: "10px 0 4px" }}>
        <div style={{ marginBottom: "12px" }}>
          {deEn ? <CatChip cat={v.cat} /> : <span style={{ ...monoLabel, fontSize: "9px", fontWeight: 600, color: "var(--ink-soft)", border: "1px solid var(--line)", borderRadius: "999px", padding: "3px 10px" }}>{v.typeLabel}</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", flexWrap: "wrap" }}>
          {deEn && <SpeakButton text={v.prompt} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: v.prompt.length > 26 ? "22px" : "30px", color: "var(--ink)", lineHeight: 1.25 }}>{v.prompt}</div>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
        {v.options.map((o, i) => {
          const c = optionColors(a && o.key === v.card.de, a && o.key === a.pick, !!a);
          return (
            <button key={o.key} onClick={() => drill.act("choose", { key: o.key })} style={{ display: "flex", gap: "12px", alignItems: "baseline", textAlign: "left", fontFamily: "var(--font-serif)", fontSize: o.text.length > 30 ? "14px" : "17px", padding: "13px 16px", borderRadius: "12px", border: "1px solid " + c.border, background: c.bg, color: c.color, boxShadow: c.shadow, cursor: a ? "default" : "pointer" }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: "10px", opacity: 0.6 }}>{i + 1}</span>{o.text}
            </button>
          );
        })}
      </div>
      {a && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "10px" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.08em", color: tone }}>{verdictText}</div>
          {!deEn && (
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <SpeakButton text={v.card.de} />
              <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: catColor(v.card.cat), textAlign: "center" }}>{v.card.de}</div>
            </div>
          )}
          {deEn && !a.correct && <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink-soft)" }}>{v.card.de} = <strong style={{ color: "var(--ink)" }}>{v.card.en}</strong></div>}
          {v.card.example && (
            <div style={{ display: "flex", alignItems: "center", gap: "10px", maxWidth: "min(440px, 100%)", padding: "10px 14px", background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px", boxShadow: "var(--shadow-soft)" }}>
              <SpeakButton text={v.card.example} size={30} />
              <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink)", lineHeight: 1.45 }}>{v.card.example}</div>
            </div>
          )}
          <div style={{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap", justifyContent: "center" }}>
            <button ref={nextRef} onClick={() => drill.act("next")} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
          </div>
          <div style={{ ...monoLabel, fontSize: "8px" }}>aus Kapitel {v.chapter}</div>
        </div>
      )}
    </React.Fragment>
  );
}

// The stories come from german_vocab.json; the learner's read marks and phase
// test statuses are loaded on opening Stories and again after a Phasentest.
// Loaded once per login; fetched again only after a phase test (which changes it).
const STORY_PROGRESS = { value: null, stale: true };
function StoriesPage({ settings, onSettings, onChange }) {
  const [progress, setProgressState] = useState(STORY_PROGRESS.value);
  const setProgress = (fn) => setProgressState((p) => (STORY_PROGRESS.value = typeof fn === "function" ? fn(p) : fn));
  useEffect(() => {
    if (settings.storyTest) { STORY_PROGRESS.stale = true; return; }
    if (!STORY_PROGRESS.stale) return;
    STORY_PROGRESS.stale = false;
    api.get("/api/stories/progress", { quiet: true }).then(setProgress).catch((e) => { STORY_PROGRESS.stale = true; api.report(e); });
  }, [settings.storyTest]);
  const onRead = (id, read) => setProgress((p) => p && Object.assign({}, p, { read: read ? p.read.filter((x) => x !== id).concat([id]) : p.read.filter((x) => x !== id) }));
  if (settings.storyTest) return <PhaseTestPage key={settings.storyTest} idx={settings.storyTest} onSettings={onSettings} onChange={onChange} />;
  if (settings.storyOpen) {
    return <StoryReader id={settings.storyOpen} read={!!(progress && progress.read.includes(settings.storyOpen))} showEn={!!settings.storyShowEn}
      onRead={onRead} onSettings={onSettings} />;
  }
  return <StoriesList progress={progress} onSettings={onSettings} />;
}

function PillButton({ on, onClick, children, onColor = "var(--good)" }) {

// ---------- ADD A WORD (the backend validates, commits to GitHub and serves the new file) ----------
const fieldLabel = { display: "block", marginBottom: "6px", ...monoLabel, color: "var(--ink-soft)" };
const fieldInput = {
  width: "100%", boxSizing: "border-box", padding: "12px 14px", fontFamily: "var(--font-serif)", fontSize: "17px",
  border: "1px solid var(--line)", borderRadius: "10px", background: "var(--paper-raised)", color: "var(--ink)", outline: "none",
};

function AddWord({ summary, ghToken, onToken, onAdded }) {
  const [lvl, setLvl] = useState(summary.settings.levels[0] || "A2");
  const [cat, setCat] = useState("der");
  const [de, setDe] = useState("");
  const [en, setEn] = useState("");
  const [example, setExample] = useState("");
  const [prefix, setPrefix] = useState("");
  const [state, setState] = useState({ status: "idle" });
  const saving = state.status === "saving";
  const isNoun = cat === "der" || cat === "die" || cat === "das";
  const submit = () => {
    if (saving) return;
    setState({ status: "saving" });
    api.post("/api/vocab/words", { lvl, cat, de, en, example, prefix: cat === "sep" ? prefix : "" }, { "X-GitHub-Token": ghToken || "" })
      .then((r) => {
        setDe(""); setEn(""); setExample(""); setPrefix("");
        setState({ status: "done", word: r.entry.de, lvl: r.lvl, url: r.commitUrl });
        onAdded();
      })
      .catch((err) => setState({ status: "error", message: err.message }));
  };
  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "password" && !e.nativeEvent.isComposing) submit(); }}
      style={{ ...srsCol, width: "min(440px, 92vw)", margin: "0 auto", gap: "16px", alignItems: "stretch" }}>
      <div style={{ ...monoLabel, textAlign: "center", lineHeight: 1.7 }}>the backend adds the word to german_vocab.json · one commit on GitHub</div>
      <LevelToggle levels={summary.levels} selected={[lvl]} onToggle={setLvl} />
      <FilterBar cats={summary.cats} active={[cat]} onToggle={setCat} />
      <label>
        <span style={fieldLabel}>{isNoun ? "German noun (article added for you)" : "German"}</span>
        <input value={de} onChange={(e) => setDe(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={isNoun ? "Abfall" : cat === "sep" ? "vorbereiten" : cat === "phrase" ? "Ich bin der Meinung, dass ..." : ""} autoCapitalize="off" autoCorrect="off" spellCheck={false} />
      </label>
      <label>
        <span style={fieldLabel}>English</span>
        <input value={en} onChange={(e) => setEn(e.target.value)} style={fieldInput} disabled={saving} autoCapitalize="off" spellCheck={false} />
      </label>
      {cat === "sep" && (
        <label>
          <span style={fieldLabel}>Prefix (optional — guessed if blank)</span>
          <input value={prefix} onChange={(e) => setPrefix(e.target.value)} style={fieldInput} disabled={saving} placeholder="vor" autoCapitalize="off" autoCorrect="off" spellCheck={false} />
        </label>
      )}
      <label>
        <span style={fieldLabel}>Example sentence (optional{cat === "sep" || isNoun ? " — powers the fill-in quizzes" : ""})</span>
        <input value={example} onChange={(e) => setExample(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={cat === "sep" ? "Ich bereite das Essen vor." : isNoun ? "Der Abfall kommt in den Müll." : ""} spellCheck={false} />
      </label>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "10px" }}>
        <button type="button" onClick={submit} disabled={saving} style={{ ...navBtnStyle, opacity: saving ? 0.6 : 1, cursor: saving ? "default" : "pointer" }}>{saving ? "committing …" : "add & commit ›"}</button>
        {!ghToken && (
          <GeminiKeyField value={ghToken} onChange={onToken} label="🔑 GitHub token (one-time)" placeholder="fine-grained token (github_pat_…)"
            help="Needed to commit to german_vocab.json in Harsimar17/Deutsch-Vocab-Helper. Create a fine-grained token at github.com/settings/personal-access-tokens limited to that repo with Contents: Read and write. Kept in memory for this visit and sent with each add — the backend never stores it." />
        )}
        {state.status === "error" && <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--bad)", textAlign: "center", lineHeight: 1.5 }}>{state.message}</div>}
        {state.status === "done" && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--good)", textAlign: "center", lineHeight: 1.6 }}>
            ✓ “{state.word}” committed
            {state.url && <React.Fragment> · <a href={state.url} target="_blank" rel="noreferrer" style={{ color: "var(--good)" }}>view commit</a></React.Fragment>}
            <div style={{ color: "var(--ink-faint)" }}>
              already in the app — the backend serves the committed file right away
              {!summary.settings.levels.includes(state.lvl) ? ` · ${state.lvl} isn't selected in settings, so it won't show in Study yet` : ""}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

  }, [mode]);

// Talkloop, the speaking-practice app, is part of this app (at /talkloop/). It
// reads this learner's learnt words and keeps its mistake log with the login session kept in this browser.

// The logged-in user as a round initial; click for their email and "Sign out".
function UserMenu({ user, onLogout }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, [open]);
  const email = user.email || "";
  const initial = (email.trim()[0] || "?").toUpperCase();
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button className="avatar-btn" onClick={() => setOpen((o) => !o)} aria-label={"Account: " + email} aria-expanded={open} title={email}>{initial}</button>
      {open && (
        <div role="menu" className="menu">
          <div className="menu-head"><small>Signed in as</small><div>{email}</div></div>
          <button role="menuitem" className="danger" onClick={() => { setOpen(false); onLogout(); }}><Icon name="logout" />Sign out</button>
        </div>
      )}
    </div>
  );
}

function CaseTable({ rows }) {
  return (
    <div className="rwrap">
      <table className="rtable">
        <thead>
          <tr>
            <th rowSpan={2} className="h-case">Cases</th>

  );

function RuleTable({ head, rows }) {

// Watches Talkloop's call screen in the frame (same origin) and marks <html> with "talk-call"
// while a call runs. Only reads the call screen's hidden attribute: Talkloop itself is untouched.
function watchTalkCall(frame) {
  const root = document.documentElement;
  try {
    const call = frame.contentDocument && frame.contentDocument.getElementById("conversation");
    if (!call) { root.classList.remove("talk-call"); return; }
    const sync = () => root.classList.toggle("talk-call", !call.hidden);
    sync();
    new MutationObserver(sync).observe(call, { attributes: true, attributeFilter: ["hidden"] });
  } catch (e) { root.classList.remove("talk-call"); /* frame from another origin */ }
}

    }
    api.get("/api/summary?ai=false")
      .then((s) => { if (!cancelled) { setSummary(s); setStatus("ready"); } })
      .catch((e) => { if (!cancelled) setStatus(e && e.status === 401 ? "login" : { error: (e && e.message) || String(e) }); });
    return () => { cancelled = true; };
  }, [attempt, user]);
  useEffect(() => { if (status === "ready") refreshSummary(); }, [geminiKey]);

  const onSettings = useCallback((action, value) => {
    // Moving around (Practice/Stories, a story, a phase test) stays in the page — no call.
    const nav = NAV_SETTINGS[action];
    if (nav) {
      setNav((n) => Object.assign({}, n, nav(value)));
      return Promise.resolve();
    }
    return api.post("/api/settings/" + action + "?ai=" + (geminiKey ? "true" : "false"), { value })
      .then((next) => { // the whole new summary — no second call
        setSummary(next);
        if (ROUND_SETTINGS.includes(action)) setVersion((v) => v + 1);
      })
      .catch(api.report);
  }, [geminiKey]);

  const theme = summary && summary.settings.theme ? summary.settings.theme : SYSTEM_THEME;
  applyCategoryPalette(theme);
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#05060D" : "#F3F4FA");
  }, [theme]);

  const shellStyle = { minHeight: "100%", padding: "36px 20px 48px", fontFamily: "var(--font-serif)", display: "flex", alignItems: "center", justifyContent: "center" };
  if (status && status.error) {
    return (
      <div style={shellStyle}>
        <div style={{ maxWidth: "440px", textAlign: "center", display: "flex", flexDirection: "column", gap: "16px" }}>
          <div style={{ fontSize: "22px", color: "var(--ink)" }}>Can’t reach the server</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--bad)" }}>{status.error}</div>
          <div style={{ fontSize: "13px", color: "var(--ink-muted)" }}>Backend: <code>{API_CONFIGURED ? (API_BASE || location.origin) : "(not configured)"}</code></div>
          <button onClick={() => setAttempt((n) => n + 1)} style={navBtnStyle}>Try again</button>
        </div>
      </div>
    );
  }
  if (status === "login") {
    return <div style={shellStyle}><LoginScreen onLoggedIn={setUser} /></div>;
  }
  if (status === "loading" || !summary) {
    return <div style={shellStyle}><div style={{ ...counterStyle, fontSize: "13px" }}>Loading…</div></div>;
  }

  const s = Object.assign({}, summary.settings, nav);
  const notice = saveError ? (
    <div role="alert" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", padding: "8px 12px", borderRadius: "10px", border: "1px solid var(--bad)", fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.04em", color: "var(--bad)" }}>
      <span>⚠ {saveError}</span>
      <button onClick={() => setSaveError(null)} aria-label="dismiss" style={{ background: "transparent", border: "none", color: "var(--bad)", cursor: "pointer", fontSize: "14px" }}>×</button>
    </div>
  ) : null;
  const topBar = (
    <TopBar storyMode={s.storyMode} onStoryMode={(v) => onSettings("setStoryMode", v)} formulas={formulas} onFormulas={setFormulas} talk={talk} onTalk={setTalk}
      theme={theme} onTheme={(t) => onSettings("setTheme", t)} user={user} onLogout={logout} />
  );

  // Practice, Stories and Rules stay mounted once opened and are only hidden,
  // so switching between them starts nothing again on the backend.
  const page = talk ? "talk" : formulas ? "rules" : s.storyMode ? "stories" : "practice";
  if (!visited.current[page]) visited.current[page] = true;
  const show = (p) => ({ display: page === p ? "block" : "none" });
  const drillProps = { version, onChange: applyChange, geminiKey, settings: s };
  return (
    <div style={{ minHeight: "100%", fontFamily: "var(--font-serif)" }}>
      {topBar}
      <main className="app-main">
      <div style={{ maxWidth: page === "talk" ? "none" : page === "rules" ? "760px" : page === "stories" ? "680px" : "600px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "22px" }}>
        {notice}
        {/* Loaded in the background right after login, so the tab is ready when it is opened. */}
        <div style={show("talk")} className="talk-page">
          {!talkReady && <div style={{ ...counterStyle, textAlign: "center", padding: "64px 0" }}>Loading speaking practice…</div>}
          <iframe src="/talkloop/" title="Talkloop" className="talk-frame" allow="microphone; autoplay; clipboard-write" onLoad={(e) => { setTalkReady(true); watchTalkCall(e.currentTarget); }}
            style={{ display: talkReady ? "block" : "none" }} />
        </div>
        {visited.current.rules && <div style={show("rules")}><div style={{ animation: "cardIn .35s ease both" }}><FormulasPage /></div></div>}
        {visited.current.stories && (
          <div style={show("stories")}>
            <div style={{ animation: "cardIn .35s ease both" }}>
              <StoriesPage settings={s} onSettings={onSettings} onChange={applyChange} />
            </div>
          </div>
        )}
        <div style={{ display: page === "practice" ? "flex" : "none", flexDirection: "column", gap: "18px" }}>
          <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: "16px", flexWrap: "wrap" }}>
            <div>
              <div className="page-eyebrow">{summary.levelTitle}</div>
              <h1 className="page-title">Practice</h1>
              <div className="page-sub">{summary.cardCount} cards · nouns, verbs, separable verbs, adjectives, connectors and phrases</div>
            </div>
            <button className="settings-toggle" onClick={() => setSettingsOpen((o) => !o)} aria-expanded={settingsOpen}>
              <Icon name="sliders" /><span>{summary.settingsLabel}</span>
            </button>
          </div>
          {settingsOpen && <SettingsPanel summary={summary} onSettings={onSettings} geminiKey={geminiKey} setGeminiKey={setGeminiKey} ghToken={ghToken} setGhToken={setGhToken} />}
          <StreakHeader header={summary.header} showCounts={mode === "study" || mode === "write"} />
          <TabBar mode={mode} setMode={setMode} mistakeCount={summary.mistakeCount} />
          <div style={{ marginTop: "6px", animation: "cardIn .35s ease both" }} key={mode}>
            {mode === "study" && <StudyMode {...drillProps} />}
            {mode === "write" && <WriteMode {...drillProps} />}
            {mode === "build" && <PatternStudy onChange={applyChange} />}
            {mode === "connectors" && <ConnectorPractice />}
            {mode === "flash" && <Flashcards {...drillProps} />}
            {mode === "quiz" && <Quiz {...drillProps} />}
            {mode === "articles" && <ArticleQuiz {...drillProps} />}
            {mode === "sep" && <SeparableVerbs {...drillProps} />}
            {mode === "cloze" && <ClozeQuiz {...drillProps} />}
            {mode === "mistakes" && <MistakesReview {...drillProps} />}
            {mode === "add" && <AddWord summary={summary} ghToken={ghToken} onToken={setGhToken} onAdded={() => { loadContent(true).finally(() => setVersion((v) => v + 1)); refreshSummary(); }} />}
          </div>
        </div>
      </div>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
