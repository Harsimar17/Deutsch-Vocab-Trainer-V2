// Tooltip with a word's meaning, as analysed by the backend. Portalled to
// <body> (the tab wrapper's transform would break position: fixed) and
// re-measured on scroll so it follows the word.
function WordTip({ tip }) {
  const { el, entry, word } = tip;
  const [, reflow] = useState(0);
  useEffect(() => {
    const onMove = () => reflow((n) => n + 1);
    window.addEventListener("scroll", onMove, true);
    window.addEventListener("resize", onMove);
    return () => { window.removeEventListener("scroll", onMove, true); window.removeEventListener("resize", onMove); };
  }, []);
  const rect = el.getBoundingClientRect();
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const w = Math.min(270, vw - 32);
  const cx = Math.min(Math.max(rect.left + rect.width / 2, w / 2 + 16), vw - w / 2 - 16);
  const above = rect.top > 170;
  const bare = String(entry.head || "").replace(/^(der|die|das)\s+/i, "").toLowerCase();
  return ReactDOM.createPortal(
    <div data-tip="1" role="tooltip" style={{
      position: "fixed", zIndex: 50, left: cx, width: w, boxSizing: "border-box", top: above ? rect.top - 8 : rect.bottom + 8,
      transform: above ? "translate(-50%, -100%)" : "translate(-50%, 0)", background: "var(--paper-raised)", border: "1px solid var(--line)",
      borderRadius: "12px", boxShadow: "var(--shadow-card)", padding: "12px 14px", textAlign: "left", animation: "tipIn .14s ease both",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px", flexWrap: "wrap" }}>
        <CatChip cat={entry.cat} />
        {entry.lvl && <span style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.12em", color: "var(--ink-faint)" }}>{entry.lvl}</span>}
        {tip.pinned && <span style={{ marginLeft: "auto" }}><SpeakButton text={entry.head} size={28} /></span>}
      </div>
      <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "17px", color: "var(--ink)", lineHeight: 1.3 }}>{entry.head}</div>
      <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: "15px", color: "var(--ink-soft)", marginTop: "3px", lineHeight: 1.4 }}>{entry.en}</div>
      {word.toLowerCase() !== bare && <div style={{ fontFamily: "var(--font-mono)", fontSize: "9px", letterSpacing: "0.08em", color: "var(--ink-faint)", marginTop: "6px" }}>im Text: {word}</div>}
      {entry.example && <div style={{ fontFamily: "var(--font-serif)", fontSize: "13px", color: "var(--ink-soft)", marginTop: "8px", paddingTop: "8px", borderTop: "1px solid var(--line)", lineHeight: 1.45 }}>{entry.example}</div>}
    </div>,
    document.body
  );
}

// Phase test status from the backend, in words.
// What a phase test's two sets are called: the stories' target words, and the B1 verbs used in them.
const SET_NAME = { words: "Wörter", verbs: "Verben" };  // in the German texts
const SET_LABEL = { words: "Words", verbs: "Verbs", sentences: "Sentences" };   // on buttons

function testStatusText(s, unit = "words") {
  if (!s) return { text: "", tone: "var(--ink-faint)" };
  switch (s.kind) {
    case "refreshDue": return { text: "⏰ refresher due", tone: "var(--accent)" };
    case "practiceAgain": return { text: "↻ practise " + s.open + " " + unit + " again", tone: "var(--bad)" };
    case "passed": return { text: "✓ passed · next refresher " + new Date(s.due).toLocaleDateString(undefined, { day: "numeric", month: "short" }), tone: "var(--good)" };
    case "inProgress": return { text: s.mastered + " / " + s.total + " mastered", tone: "var(--ink-faint)" };
    default: return { text: s.total + " " + unit + " · not started yet", tone: "var(--ink-faint)" };
  }
}

// A line typed out letter by letter, with a blinking caret while it types.
function TypedLine({ text, speed = 26 }) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [n, setN] = useState(reduce ? text.length : 0);
  useEffect(() => {
    if (reduce) { setN(text.length); return undefined; }
    setN(0);
    let i = 0;
    const t = setInterval(() => { i += 1; setN(i); if (i >= text.length) clearInterval(t); }, speed);
    return () => clearInterval(t);
  }, [text]);
  return <div className="typed">{text.slice(0, n)}{n < text.length && <span className="caret" />}</div>;
}

const PaperClip = () => (
  <svg className="clip" viewBox="0 0 26 64" aria-hidden="true">
    <path d="M8 22 V48 a5 5 0 0 0 10 0 V12 a8 8 0 0 0 -16 0 V50 a11 11 0 0 0 22 0 V24" fill="none" stroke="#8b8e95" strokeWidth="2.4" strokeLinecap="round" />
  </svg>
);

// The story as a notebook page on a desk, like a mission briefing: the page
// slides in, the header types itself, the chapter is stamped, the paragraphs
// appear one by one. Words stay tappable for their meaning.
function StoryReader({ id, read, showEn, onRead, onSettings }) {
  const [content, error] = useContent();
  const story = content ? content.reader(id) : null;
  const [tip, setTip] = useState(null);
  const [glossOpen, setGlossOpen] = useState(false);
  const topRef = useRef(null);
  useEffect(() => {
    setTip(null); setGlossOpen(false);
    if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ block: "start" });
  }, [id]);
  // Close the tooltip on tap outside or Escape.
  useEffect(() => {
    if (!tip) return;
    const onDown = (e) => { if (e.target && e.target.closest && e.target.closest("[data-sw],[data-tip]")) return; setTip(null); };
    const onKey = (e) => { if (e.key === "Escape") setTip(null); };
    document.addEventListener("pointerdown", onDown);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("pointerdown", onDown); window.removeEventListener("keydown", onKey); };
  }, [tip]);

  const frame = { ...srsCol, width: "100%", maxWidth: "640px", margin: "0 auto", gap: "18px", alignItems: "stretch", scrollMarginTop: "12px" };
  if (error) return <DrillError message={error} />;
  if (content && !story) return <DrillError message={"no such story: " + id} />;
  if (!story) {
    return (
      <div ref={topRef} style={frame}>
        <div className="notebook" style={{ minHeight: "220px" }}>
          <div className="holes" />
          <TypedLine text="Lade Kapitel …" />
        </div>
      </div>
    );
  }
  const show = (e, key, seg, pinned) => setTip({ key, el: e.currentTarget, entry: seg.entry, word: seg.w, pinned });
  const setShowEn = (v) => onSettings("setStoryShowEn", v);
  const toggleRead = () => api.post("/api/stories/" + encodeURIComponent(story.id) + "/read").then((r) => onRead(story.id, r.read)).catch(api.report);
  const hover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
  const chapter = String(story.chapter).padStart(2, "0");

  return (
    <div ref={topRef} style={frame}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", flexWrap: "wrap" }}>
        <button onClick={() => onSettings("openStory", null)} style={miniBtn}>‹ all stories</button>
        <Switch on={!!showEn} onChange={setShowEn} label="English notes" />
      </div>
      <div className="notebook" key={story.id}>
        <div className="holes" />
        <PaperClip />
        <TypedLine text={"Leseauftrag" + (story.phaseName ? " · " + story.phaseName : "")} />
        <div className="stamp">KAPITEL {chapter}</div>
        <div className="title">{story.titleDe}</div>
        <div className="hand" style={{ fontSize: "20px", color: "#6b6150", marginTop: "2px" }}>{story.titleEn}</div>
        <div style={{ fontFamily: "'Special Elite', 'Courier New', monospace", fontSize: "11px", color: "var(--ink-faint)", margin: "10px 0 14px", lineHeight: 1.6 }}>
          <span className="st" style={{ fontFamily: "var(--font-serif)", fontSize: "13px" }}>underlined</span> = B1 target word · tap{hover ? " or hover" : ""} a word for its meaning
        </div>
        {story.paragraphs.map((p, pi) => (
          <div key={story.id + "-" + pi} className="reveal" style={{ display: "flex", gap: "10px", alignItems: "flex-start", marginBottom: "var(--rule)", animationDelay: (1.1 + pi * 0.18) + "s" }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <p className="para">
                {p.segments.map((seg, si) => {
                  if (seg.t != null) return <React.Fragment key={si}>{seg.t}</React.Fragment>;
                  const key = pi + "-" + si;
                  if (!seg.entry) return <span key={si} className="st">{seg.w}</span>;
                  const on = tip && tip.key === key;
                  return (
                    <span key={si} data-sw="1" className={(seg.target ? "st sw" : "sw") + (on ? " on" : "")}
                      onPointerEnter={(e) => { if (e.pointerType === "mouse" && !(tip && tip.pinned)) show(e, key, seg, false); }}
                      onPointerLeave={(e) => { if (e.pointerType === "mouse") setTip((t) => (t && !t.pinned ? null : t)); }}
                      onClick={(e) => { if (tip && tip.key === key && tip.pinned) setTip(null); else show(e, key, seg, true); }}>
                      {seg.w}
                    </span>
                  );
                })}
              </p>
              {showEn && p.en && <p className="pencil">{p.en}</p>}
            </div>
            <SpeakButton text={p.speech} size={30} />
          </div>
        ))}
        {story.glossary.length > 0 && (
          <div className="reveal" style={{ borderTop: "1px dashed rgba(196,62,62,.45)", paddingTop: "12px", animationDelay: (1.2 + story.paragraphs.length * 0.18) + "s" }}>
            <button onClick={() => setGlossOpen((o) => !o)} className="hand" style={{ fontSize: "22px", color: "#23324f", background: "transparent", border: "none", padding: 0, cursor: "pointer" }}>
              {glossOpen ? "▾" : "▸"} Wortliste ({story.glossary.length})
            </button>
            {glossOpen && (
              <div style={{ display: "flex", flexDirection: "column", marginTop: "4px" }}>
                {story.glossary.map((g, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "baseline", gap: "8px", lineHeight: "var(--rule)" }}>
                    <span style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "15px", color: catColor(g.cat), whiteSpace: "nowrap" }}>{g.de}</span>
                    <span style={{ flex: 1, borderBottom: "1px dotted var(--ink-faint)", transform: "translateY(-4px)" }} />
                    <span className="hand" style={{ fontSize: "19px", color: "#4a5f8a", textAlign: "right" }}>{g.en}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px", paddingTop: "4px" }}>
        <button onClick={toggleRead} style={{ ...navBtnStyle, background: read ? "var(--good)" : "transparent", border: "1px solid " + (read ? "var(--good)" : "var(--ink-muted)"), color: read ? "#F6F1E5" : "var(--ink-muted)", boxShadow: "none" }}>
          {read ? "✓ read" : "mark as read"}
        </button>
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {story.endsPhase && <button onClick={() => onSettings("openPhaseTest", story.endsPhase)} style={{ ...navBtnStyle, background: "var(--good)", borderColor: "var(--good)" }}>🎯 Phase test</button>}
          {story.prev && <button onClick={() => onSettings("openStory", story.prev.id)} style={navBtnStyle}>‹ Chapter {story.prev.chapter}</button>}
          {story.next && <button onClick={() => onSettings("openStory", story.next.id)} style={navBtnStyle}>Chapter {story.next.chapter} ›</button>}
        </div>
      </div>
      {tip && <WordTip tip={tip} />}
    </div>
  );
}

}

function PhaseRound({ idx, set, refresh, retake, onExit, onNext, onChange }) {
  const drill = useDrill("phase", retake ? { phase: idx, set, retake } : { phase: idx, set, refresh }, 0, onChange);
  const v = drill.view;
  const nextRef = useRef(null);
  const answered = !!(v && v.answer);
  const qid = v ? v.state + "#" + v.position + "#" + v.total : "";
  // Focus "weiter" once answered — so Enter always does the obvious thing.
  useEffect(() => {
    if (v && v.state === "question" && answered && nextRef.current) nextRef.current.focus();
  }, [qid, answered]);
  useEffect(() => {
    if (!v || v.state !== "question") return;
    const onKey = (e) => {
      if (e.isComposing) return;
      const el = e.target;
      if (el && el !== nextRef.current && /^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      if (e.key === "Enter") {
        if (answered) { e.preventDefault(); drill.act("next"); }
      } else if (!answered && /^[1-4]$/.test(e.key) && v.options[+e.key - 1]) {
        drill.act("choose", { key: v.options[+e.key - 1].key });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const head = (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px" }}>
      <button onClick={v && v.state === "finished" ? onExit : () => { if (window.confirm(retake ? "Wiederholung abbrechen? Es wird kein Ergebnis gespeichert." : "Runde abbrechen? Bisherige Antworten bleiben gespeichert.")) onExit(); }} style={miniBtn}>
        {v && v.state === "finished" ? "‹ Overview" : "× Cancel round"}
      </button>
      <span style={{ ...monoLabel, fontSize: "9px", textAlign: "right" }}>🎯 Phasentest · {SET_NAME[set]}{retake ? " · Wiederholung" : ""}</span>
    </div>
  );
  const wrap = (children) => <div style={{ ...srsCol, width: "100%", maxWidth: "560px", margin: "0 auto", alignItems: "stretch", gap: "18px" }}>{head}{children}</div>;

  if (drill.error) return wrap(<DrillError message={drill.error} />);
  if (!v) return wrap(<Loading />);

  if (v.state === "finished") {
    const pct = v.first ? Math.round((v.right / v.first) * 100) : 0;
    const st = testStatusText(v.status);
    return wrap(
      <React.Fragment>
        <div style={{ textAlign: "center", padding: "20px 0 6px" }}>
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "24px", color: "var(--ink)" }}>{retake ? "Wiederholung fertig" : v.passedNow ? "Phase bestanden 🎉" : v.refresh ? "Auffrischung fertig" : "Runde fertig"}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", letterSpacing: "0.08em", color: "var(--ink-soft)", marginTop: "10px" }}>{v.right} / {v.first} {retake ? "richtig" : "beim ersten Versuch richtig"} ({pct}%)</div>
        </div>
        <MasteryBar status={v.status} />
        <div style={{ textAlign: "center", fontFamily: "var(--font-mono)", fontSize: "11px", color: st.tone }}>{st.text}</div>
        {retake && <p style={{ ...srsNote, fontSize: "14px" }}>Dein Fortschritt bleibt, wie er war — das Ergebnis steht in der Übersicht.</p>}
        {v.passedNow && <p style={{ ...srsNote, fontSize: "14px" }}>{set === "verbs" ? "Jedes Verb" : "Jedes Wort"} sitzt in beide Richtungen. Die erste Auffrischung ist morgen fällig — danach nach 7, 30, 90 und 180 Tagen.</p>}
        <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center" }}>
          {retake ? <button onClick={onNext} style={navBtnStyle}>↻ Retake again</button>
            : v.status.open > 0 && <button onClick={onNext} style={navBtnStyle}>▶ Next round</button>}
          <button onClick={onExit} style={ghostBtn}>Overview</button>
        </div>
      </React.Fragment>
    );
  }

  const deEn = v.dir === "de-en";
  const a = v.answer;
  const tone = a ? (a.correct ? "var(--good)" : "var(--bad)") : "var(--line)";
  const verdictText = !a ? "" : a.correct ? "✓ RICHTIG" : retake ? "✗ FALSCH" : "✗ NOCH NICHT — kommt gleich nochmal";
  return wrap(
    <React.Fragment>
      <MasteryBar status={v.status} />
      <div style={{ display: "flex", justifyContent: "space-between", ...monoLabel }}>
        <span>{deEn ? "DE → EN · erkennen" : "EN → DE · deutsches Wort wählen"}{v.relearn ? " · nochmal" : ""}</span>
        <span>{v.position} / {v.total}{v.refresh ? " · Auffrischung" : ""}</span>
      </div>
      <div style={{ textAlign: "center", padding: "10px 0 4px" }}>
        <div style={{ marginBottom: "12px" }}>
          {deEn ? <CatChip cat={v.cat} /> : <span style={{ ...monoLabel, fontSize: "9px", fontWeight: 600, color: "var(--ink-soft)", border: "1px solid var(--line)", borderRadius: "999px", padding: "3px 10px" }}>{v.typeLabel}</span>}
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "12px", flexWrap: "wrap" }}>
          {deEn && <SpeakButton text={v.prompt} />}
          <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: v.prompt.length > 26 ? "22px" : "30px", color: "var(--ink)", lineHeight: 1.25 }}>{v.prompt}</div>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
        {v.options.map((o, i) => {
          const c = optionColors(a && o.key === v.card.de, a && o.key === a.pick, !!a);
          return (
            <button key={o.key} onClick={() => drill.act("choose", { key: o.key })} style={{ display: "flex", gap: "12px", alignItems: "baseline", textAlign: "left", fontFamily: "var(--font-serif)", fontSize: o.text.length > 30 ? "14px" : "17px", padding: "13px 16px", borderRadius: "12px", border: "1px solid " + c.border, background: c.bg, color: c.color, boxShadow: c.shadow, cursor: a ? "default" : "pointer" }}>
              <span style={{ fontFamily: "var(--font-mono)", fontSize: "10px", opacity: 0.6 }}>{i + 1}</span>{o.text}
            </button>
          );
        })}
      </div>
      {a && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "10px" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", letterSpacing: "0.08em", color: tone }}>{verdictText}</div>
          {!deEn && (
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <SpeakButton text={v.card.de} />
              <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: catColor(v.card.cat), textAlign: "center" }}>{v.card.de}</div>
            </div>
          )}
          {deEn && !a.correct && <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink-soft)" }}>{v.card.de} = <strong style={{ color: "var(--ink)" }}>{v.card.en}</strong></div>}
          {v.card.example && (
            <div style={{ display: "flex", alignItems: "center", gap: "10px", maxWidth: "min(440px, 100%)", padding: "10px 14px", background: "var(--paper-raised)", border: "1px solid var(--line)", borderRadius: "12px", boxShadow: "var(--shadow-soft)" }}>
              <SpeakButton text={v.card.example} size={30} />
              <div style={{ fontFamily: "var(--font-serif)", fontSize: "15px", color: "var(--ink)", lineHeight: 1.45 }}>{v.card.example}</div>
            </div>
          )}
          <div style={{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap", justifyContent: "center" }}>
            <button ref={nextRef} onClick={() => drill.act("next")} style={navBtnStyle}>next › <span style={{ opacity: 0.6 }}>⏎</span></button>
          </div>
          <div style={{ ...monoLabel, fontSize: "8px" }}>aus Kapitel {v.chapter}</div>
        </div>
      )}
    </React.Fragment>
  );
}

// The stories come from german_vocab.json; the learner's read marks and phase
// test statuses are loaded on opening Stories and again after a Phasentest.
// Loaded once per login; fetched again only after a phase test (which changes it).
const STORY_PROGRESS = { value: null, stale: true };
function StoriesPage({ settings, onSettings, onChange }) {
  const [progress, setProgressState] = useState(STORY_PROGRESS.value);
  const setProgress = (fn) => setProgressState((p) => (STORY_PROGRESS.value = typeof fn === "function" ? fn(p) : fn));
  useEffect(() => {
    if (settings.storyTest) { STORY_PROGRESS.stale = true; return; }
    if (!STORY_PROGRESS.stale) return;
    STORY_PROGRESS.stale = false;
    api.get("/api/stories/progress", { quiet: true }).then(setProgress).catch((e) => { STORY_PROGRESS.stale = true; api.report(e); });
  }, [settings.storyTest]);
  const onRead = (id, read) => setProgress((p) => p && Object.assign({}, p, { read: read ? p.read.filter((x) => x !== id).concat([id]) : p.read.filter((x) => x !== id) }));
  if (settings.storyTest) return <PhaseTestPage key={settings.storyTest} idx={settings.storyTest} onSettings={onSettings} onChange={onChange} />;
  if (settings.storyOpen) {
    return <StoryReader id={settings.storyOpen} read={!!(progress && progress.read.includes(settings.storyOpen))} showEn={!!settings.storyShowEn}
      onRead={onRead} onSettings={onSettings} />;
  }
  return <StoriesList progress={progress} onSettings={onSettings} />;
}

// ---------- ADD A WORD (the backend validates, commits to GitHub and serves the new file) ----------
const fieldLabel = { display: "block", marginBottom: "6px", ...monoLabel, color: "var(--ink-soft)" };
const fieldInput = {
  width: "100%", boxSizing: "border-box", padding: "12px 14px", fontFamily: "var(--font-serif)", fontSize: "17px",
  border: "1px solid var(--line)", borderRadius: "10px", background: "var(--paper-raised)", color: "var(--ink)", outline: "none",
};

function AddWord({ summary, ghToken, onToken, onAdded }) {
  const [lvl, setLvl] = useState(summary.settings.levels[0] || "A2");
  const [cat, setCat] = useState("der");
  const [de, setDe] = useState("");
  const [en, setEn] = useState("");
  const [example, setExample] = useState("");
  const [prefix, setPrefix] = useState("");
  const [state, setState] = useState({ status: "idle" });
  const saving = state.status === "saving";
  const isNoun = cat === "der" || cat === "die" || cat === "das";
  const submit = () => {
    if (saving) return;
    setState({ status: "saving" });
    api.post("/api/vocab/words", { lvl, cat, de, en, example, prefix: cat === "sep" ? prefix : "" }, { "X-GitHub-Token": ghToken || "" })
      .then((r) => {
        setDe(""); setEn(""); setExample(""); setPrefix("");
        setState({ status: "done", word: r.entry.de, lvl: r.lvl, url: r.commitUrl });
        onAdded();
      })
      .catch((err) => setState({ status: "error", message: err.message }));
  };
  return (
    <div onKeyDown={(e) => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "password" && !e.nativeEvent.isComposing) submit(); }}
      style={{ ...srsCol, width: "min(440px, 92vw)", margin: "0 auto", gap: "16px", alignItems: "stretch" }}>
      <div style={{ ...monoLabel, textAlign: "center", lineHeight: 1.7 }}>the backend adds the word to german_vocab.json · one commit on GitHub</div>
      <LevelToggle levels={summary.levels} selected={[lvl]} onToggle={setLvl} />
      <FilterBar cats={summary.cats} active={[cat]} onToggle={setCat} />
      <label>
        <span style={fieldLabel}>{isNoun ? "German noun (article added for you)" : "German"}</span>
        <input value={de} onChange={(e) => setDe(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={isNoun ? "Abfall" : cat === "sep" ? "vorbereiten" : cat === "phrase" ? "Ich bin der Meinung, dass ..." : ""} autoCapitalize="off" autoCorrect="off" spellCheck={false} />
      </label>
      <label>
        <span style={fieldLabel}>English</span>
        <input value={en} onChange={(e) => setEn(e.target.value)} style={fieldInput} disabled={saving} autoCapitalize="off" spellCheck={false} />
      </label>
      {cat === "sep" && (
        <label>
          <span style={fieldLabel}>Prefix (optional — guessed if blank)</span>
          <input value={prefix} onChange={(e) => setPrefix(e.target.value)} style={fieldInput} disabled={saving} placeholder="vor" autoCapitalize="off" autoCorrect="off" spellCheck={false} />
        </label>
      )}
      <label>
        <span style={fieldLabel}>Example sentence (optional{cat === "sep" || isNoun ? " — powers the fill-in quizzes" : ""})</span>
        <input value={example} onChange={(e) => setExample(e.target.value)} style={fieldInput} disabled={saving}
          placeholder={cat === "sep" ? "Ich bereite das Essen vor." : isNoun ? "Der Abfall kommt in den Müll." : ""} spellCheck={false} />
      </label>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "10px" }}>
        <button type="button" onClick={submit} disabled={saving} style={{ ...navBtnStyle, opacity: saving ? 0.6 : 1, cursor: saving ? "default" : "pointer" }}>{saving ? "committing …" : "add & commit ›"}</button>
        {!ghToken && (
          <GeminiKeyField value={ghToken} onChange={onToken} label="🔑 GitHub token (one-time)" placeholder="fine-grained token (github_pat_…)"
            help="Needed to commit to german_vocab.json in Harsimar17/Deutsch-Vocab-Helper. Create a fine-grained token at github.com/settings/personal-access-tokens limited to that repo with Contents: Read and write. Kept in memory for this visit and sent with each add — the backend never stores it." />
        )}
        {state.status === "error" && <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--bad)", textAlign: "center", lineHeight: 1.5 }}>{state.message}</div>}
        {state.status === "done" && (
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--good)", textAlign: "center", lineHeight: 1.6 }}>
            ✓ “{state.word}” committed
            {state.url && <React.Fragment> · <a href={state.url} target="_blank" rel="noreferrer" style={{ color: "var(--good)" }}>view commit</a></React.Fragment>}
            <div style={{ color: "var(--ink-faint)" }}>
              already in the app — the backend serves the committed file right away
              {!summary.settings.levels.includes(state.lvl) ? ` · ${state.lvl} isn't selected in settings, so it won't show in Study yet` : ""}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function TabBar({ mode, setMode, mistakeCount }) {
  const [open, setOpen] = useState(true);
  const stripRef = useRef(null);
  const active = TABS.find((t) => t.id === mode) || TABS[0];
  useEffect(() => {
    if (!open || !stripRef.current) return;
    const el = stripRef.current.querySelector('[data-on="1"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }, [mode, open]);
  const tabLabel = (t) => (t.id === "mistakes" && mistakeCount ? `${t.label} ${mistakeCount}` : t.label);
  const pill = (on, isMistakes) => ({
    flex: "0 0 auto", scrollSnapAlign: "center", whiteSpace: "nowrap", fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500,
    letterSpacing: "0.05em", textTransform: "uppercase", padding: "9px 15px", border: "none", borderRadius: "999px",
    background: on ? "var(--btn-grad)" : "transparent", color: on ? "#FCF8EE" : isMistakes && mistakeCount ? "var(--bad)" : "var(--ink-soft)",
    boxShadow: on ? "0 6px 16px -8px rgba(60,50,20,.55)" : "none", cursor: "pointer",
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px", width: "min(460px, 94vw)", alignSelf: "center" }}>
      <button onClick={() => setOpen((o) => !o)} aria-label={open ? "collapse tabs" : "expand tabs"} aria-expanded={open}
        style={{ flexShrink: 0, width: "34px", height: "34px", borderRadius: "999px", fontFamily: "var(--font-mono)", fontSize: "13px", lineHeight: 1, border: "1px solid var(--line)", background: "var(--paper-raised)", color: "var(--ink-soft)", cursor: "pointer" }}>
        {open ? "‹" : "›"}
      </button>
      {!open && <button onClick={() => setOpen(true)} style={{ ...pill(true, false), padding: "9px 18px" }}>{tabLabel(active)}</button>}
      <div ref={stripRef} className="tabstrip" style={{
        display: "flex", gap: "3px", alignItems: "center", flex: 1, minWidth: 0, padding: open ? "3px" : "0", background: open ? "var(--tint)" : "transparent",
        border: `1px solid ${open ? "var(--line)" : "transparent"}`, borderRadius: "999px", overflowX: "auto", scrollSnapType: "x proximity",
        maxWidth: open ? "1200px" : "0px", opacity: open ? 1 : 0, pointerEvents: open ? "auto" : "none",
        transition: "max-width .34s cubic-bezier(.4,0,.2,1), opacity .18s ease, padding .2s ease",
      }}>
        {TABS.map((t) => (
          <button key={t.id} data-on={mode === t.id ? "1" : "0"} onClick={() => setMode(t.id)} style={pill(mode === t.id, t.id === "mistakes")}>{tabLabel(t)}</button>
        ))}
      </div>
    </div>
  );
}

// Talkloop, the speaking-practice app: opened with a link (in the #fragment, so
// it never reaches a server) that lets it read this learner's learnt words and keep its mistake log.
// The tab opens straight away so the popup blocker allows it; the link follows.
const TALKLOOP_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? "http://localhost:8765/" : "https://harsimar17.github.io/talkloop/";
async function openTalkloop() {
  const tab = window.open("", "_blank");
  try {
    const { token } = await api.post("/api/talkloop/link");
    const fragment = new URLSearchParams({ "vocab-link": token, "vocab-api": API_BASE || location.origin });
    if (tab) { tab.opener = null; tab.location.href = TALKLOOP_URL + "#" + fragment; }
    else location.href = TALKLOOP_URL + "#" + fragment;
  } catch (e) {
    if (tab) tab.close();
    api.report(e);
  }
}

// The logged-in user as a round initial; click for their email, Talkloop and "log out".
function UserMenu({ user, onLogout }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", close);
    document.addEventListener("keydown", esc);
    return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", esc); };
  }, [open]);
  const email = user.email || "";
  const initial = (email.trim()[0] || "?").toUpperCase();
  return (
    <div ref={ref} style={{ position: "absolute", left: 0 }}>
      <button onClick={() => setOpen((o) => !o)} aria-label={"logged in as " + email} aria-expanded={open} title={"Logged in as " + email}
        style={{ width: "36px", height: "36px", borderRadius: "999px", border: "1px solid var(--btn-border)", background: "var(--btn-grad)", color: "#FCF8EE",
          fontFamily: "var(--font-serif)", fontSize: "17px", fontWeight: 600, lineHeight: 1, cursor: "pointer", boxShadow: "var(--shadow-soft)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>
        {initial}
      </button>
      {open && (
        <div role="menu" style={{ position: "absolute", top: "44px", left: 0, zIndex: 20, minWidth: "200px", maxWidth: "min(280px, 80vw)", padding: "12px",
          borderRadius: "12px", border: "1px solid var(--line)", background: "var(--paper-raised)", boxShadow: "var(--shadow-soft)",
          display: "flex", flexDirection: "column", gap: "10px" }}>
          <div style={{ ...monoLabel, fontSize: "9px" }}>logged in as</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--ink)", overflowWrap: "anywhere" }}>{email}</div>
          <button role="menuitem" onClick={() => { setOpen(false); openTalkloop(); }}
            style={{ ...miniBtn, alignSelf: "flex-start" }}>🗣 practise in Talkloop</button>
          <button role="menuitem" onClick={() => { setOpen(false); onLogout(); }} style={{ ...miniBtn, color: "var(--bad)", borderColor: "var(--bad)", alignSelf: "flex-start" }}>⎋ log out</button>
        </div>
      )}
    </div>
  );
}

      { title: "Short forms", formulas: [

        ["an das → ans", "in das → ins", "zu der → zur"],
        ["bei dem → beim", "von dem → vom"],
      ] },
    ],
  },
  {
    id: "verbs", title: "Verbs", sub: "present, past, Konjunktiv II, Passiv",
    rules: [
      { title: "Present tense", table: {
        head: ["Person", "machen", "sein", "haben", "werden"],
        rows: personsOf(
          ["mache", "machst", "macht", "machen", "macht", "machen"],
          ["bin", "bist", "ist", "sind", "seid", "sind"],
          ["habe", "hast", "hat", "haben", "habt", "haben"],
          ["werde", "wirst", "wird", "werden", "werdet", "werden"],
        ),
      }, note: "Regular endings: -e, -st, -t, -en, -t, -en." },
      { title: "Modal verbs — present", table: {
        head: ["Person", "können", "müssen", "wollen"],
        rows: personsOf(
          ["kann", "kannst", "kann", "können", "könnt", "können"],
          ["muss", "musst", "muss", "müssen", "müsst", "müssen"],
          ["will", "willst", "will", "wollen", "wollt", "wollen"],
        ),
      } },
      { table: {
        head: ["Person", "dürfen", "sollen", "möchten"],
        rows: personsOf(
          ["darf", "darfst", "darf", "dürfen", "dürft", "dürfen"],
          ["soll", "sollst", "soll", "sollen", "sollt", "sollen"],
          ["möchte", "möchtest", "möchte", "möchten", "möchtet", "möchten"],
        ),
      }, note: "ich and er / sie / es have the same form — no -t." },
      { title: "Präteritum", table: {
        head: ["Person", "sein", "haben", "können", "müssen"],
        rows: personsOf(
          ["war", "warst", "war", "waren", "wart", "waren"],
          ["hatte", "hattest", "hatte", "hatten", "hattet", "hatten"],
          ["konnte", "konntest", "konnte", "konnten", "konntet", "konnten"],
          ["musste", "musstest", "musste", "mussten", "musstet", "mussten"],
        ),
      }, formulas: [
        ["🟢 regular verbs", "stem + -te + ending", "machen → ich machte, wir machten"],
      ] },
      { title: "Perfekt: haben or sein, Partizip II", formulas: [
        ["🟣 sein", "movement or change of state", "gehen, fahren, kommen, aufstehen, werden, bleiben, sein"],
        ["🟣 haben", "all other verbs", "machen, essen, lernen, sehen"],
        ["🟢 regular", "ge- … -t", "gemacht, gelernt"],
        ["🔵 irregular", "ge- … -en", "gesehen, gefahren"],
        ["🟠 separable", "prefix + ge + verb", "aufgestanden, eingekauft"],
        ["🔴 no ge-", "-ieren, be-, ver-, er-, ent-, zer-, emp-", "studiert, besucht, verstanden"],
      ] },
      { title: "Konjunktiv II", table: {
        head: ["Person", "würde", "hätte", "wäre", "könnte"],
        rows: personsOf(
          ["würde", "würdest", "würde", "würden", "würdet", "würden"],
          ["hätte", "hättest", "hätte", "hätten", "hättet", "hätten"],
          ["wäre", "wärst", "wäre", "wären", "wärt", "wären"],
          ["könnte", "könntest", "könnte", "könnten", "könntet", "könnten"],
        ),
      }, formulas: [
        ["🔵 wish / polite / unreal", "würde V2 + Infinitiv END", "Ich würde gern kommen."],
        ["🟠 wenn …, würde …", "Wenn ich Zeit hätte, würde ich kommen."],
      ] },
      { title: "Passiv", formulas: [
        ["🟢 Präsens", "werden V2 + Partizip II END", "Das Haus wird gebaut."],
        ["🔵 Präteritum", "wurde V2 + Partizip II END", "Das Haus wurde gebaut."],
        ["🟣 Perfekt", "sein V2 + Partizip II + worden END", "Das Haus ist gebaut worden."],
        ["🟠 by whom", "von + Dative", "Das Haus wird von der Firma gebaut."],
      ] },
    ],
  },
  {
    id: "comparison", title: "Comparison", sub: "groß, größer, am größten",
    rules: [
      { title: "Komparativ and Superlativ", table: {
        head: ["Positiv", "Komparativ", "Superlativ"],
        rows: [
          ["klein", "kleiner", "am kleinsten"],
          ["alt", "älter", "am ältesten"],
          ["groß", "größer", "am größten"],
          ["hoch", "höher", "am höchsten"],
          ["gut", "besser", "am besten"],
          ["viel", "mehr", "am meisten"],
          ["gern", "lieber", "am liebsten"],
        ],
      }, formulas: [
        ["🟢 equal", "so + Adjektiv + wie", "Er ist so groß wie ich."],
        ["🔵 more", "Komparativ + als", "Er ist größer als ich."],
      ] },
    ],
  },
];

function FormulaRows({ rows }) {
  return (
    <div className="formulas" style={{ fontFamily: "var(--font-mono)", fontSize: "13px", lineHeight: 1.5, color: "var(--ink)" }}>
      {rows.map((row, i) => (
        <div key={i} className="frow">
          {row.map((c, j) => <div key={j} className={row.length === 1 ? "all" : row.length === 2 && j === 1 ? "wide" : undefined}>{c}</div>)}
        </div>
      ))}
    </div>
  );
}

function CaseTable({ rows }) {
  return (
    <div className="rwrap">
      <table className="rtable">
        <thead>
          <tr>
            <th rowSpan={2} className="h-case">Cases</th>
            <th colSpan={3} className="h-sing">Singular</th>
            <th rowSpan={2} className="h-pl">Plural</th>
          </tr>
          <tr><th className="h-sing">M</th><th className="h-sing">F</th><th className="h-sing">N</th></tr>
        </thead>
        <tbody>{rows.map((r) => <tr key={r[0]}>{r.map((c, j) => j === 0 ? <th key={j} scope="row">{c}</th> : <td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function RuleTable({ head, rows }) {
  return (
    <div className="rwrap">
      <table className="rtable">
        <thead><tr>{head.map((h, j) => <th key={h} className={j === 0 ? "h-case" : "h-sing"}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r, i) => <tr key={i}>{r.map((c, j) => j === 0 ? <th key={j} scope="row">{c}</th> : <td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function FormulasPage() {
  const jump = (id) => { const el = document.getElementById("rules-" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };
  return (
    <div style={{ ...srsCol, width: "100%", maxWidth: "760px", margin: "0 auto", alignItems: "stretch", gap: "18px" }}>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "26px", color: "var(--ink)" }}>Rules</div>
        <div style={{ ...monoLabel, marginTop: "6px" }}>word order, cases, endings and verb charts</div>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", justifyContent: "center" }}>
        {RULES.map((g) => <button key={g.id} onClick={() => jump(g.id)} style={{ ...smallOutline("var(--ink-soft)"), borderColor: "var(--line)" }}>{g.title}</button>)}
      </div>
      {RULES.map((g) => (
        <section key={g.id} id={"rules-" + g.id} className="rgroup">
          <div style={{ marginBottom: "4px" }}>
            <h2 style={{ margin: 0, fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: "22px", color: "var(--ink)" }}>{g.title}</h2>
            <div style={{ ...monoLabel, marginTop: "4px" }}>{g.sub}</div>
          </div>
          {g.rules.map((r, i) => (
            <div key={i} style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
              {r.title && <h3 className="rhead">{r.title}</h3>}
              {r.cases && <CaseTable rows={r.cases} />}
              {r.table && <RuleTable head={r.table.head} rows={r.table.rows} />}
              {r.formulas && <FormulaRows rows={r.formulas} />}
              {r.note && <div style={{ fontFamily: "var(--font-serif)", fontSize: "14px", fontStyle: "italic", color: "var(--ink-soft)", lineHeight: 1.5 }}>{r.note}</div>}
            </div>
          ))}
        </section>
      ))}
    </div>
  );
}

function TopBar({ storyMode, onStoryMode, formulas, onFormulas, theme, onTheme, user, onLogout }) {
  const seg = (on) => ({
    fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.1em", textTransform: "uppercase", padding: "8px 16px",
    border: "none", borderRadius: "999px", background: on ? "var(--btn-grad)" : "transparent", color: on ? "#FCF8EE" : "var(--ink-soft)",
    boxShadow: on ? "0 6px 16px -8px rgba(0,0,0,.55)" : "none", cursor: "pointer", whiteSpace: "nowrap",
  });
  const dark = theme === "dark";
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "10px", position: "relative", minHeight: "40px" }}>
      <div role="group" aria-label="mode" className="modeseg" style={{ display: "flex", gap: "3px", padding: "3px", background: "var(--tint)", border: "1px solid var(--line)", borderRadius: "999px" }}>
        <button onClick={() => { onFormulas(false); if (storyMode) onStoryMode(false); }} aria-pressed={!formulas && !storyMode} style={seg(!formulas && !storyMode)}><span className="ic">✎ </span>Practice</button>
        <button onClick={() => { onFormulas(false); if (!storyMode) onStoryMode(true); }} aria-pressed={!formulas && storyMode} style={seg(!formulas && storyMode)}><span className="ic">📖 </span>Stories</button>
        <button onClick={() => onFormulas(true)} aria-pressed={formulas} style={seg(formulas)}><span className="ic">📐 </span>Rules</button>
      </div>
      {user && <UserMenu user={user} onLogout={onLogout} />}
      <button onClick={() => onTheme(dark ? "light" : "dark")} aria-label={dark ? "switch to light mode" : "switch to dark mode"} title={dark ? "Light mode" : "Dark mode"}
        style={{ position: "absolute", right: 0, width: "36px", height: "36px", borderRadius: "999px", border: "1px solid var(--line)", background: "var(--paper-raised)", color: "var(--ink-soft)", fontSize: "15px", lineHeight: 1, cursor: "pointer", boxShadow: "var(--shadow-soft)" }}>
        {dark ? "☀" : "☾"}
      </button>
    </div>
  );
}

function StreakHeader({ header, showCounts }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "6px" }}>
      <div style={{ ...monoLabel, letterSpacing: "0.1em", color: "var(--ink-soft)", textAlign: "center" }}>
        {header.streak > 0 ? "🔥 " + header.streak + "-day streak" : "start a streak today"} · {header.reviewed}/{header.goal} today
        {showCounts && (
          <span style={{ color: "var(--ink-faint)" }}>{"  ·  " + (header.focus === "all" ? "all-words mode" : header.focus === "trouble" ? "trouble-words mode" : header.due + " due · " + header.new + " new")}</span>
        )}
      </div>
      <div style={{ width: "min(300px, 78vw)", height: "4px", background: "var(--line)", borderRadius: "999px", overflow: "hidden" }}>
        <div style={{ width: header.pct + "%", height: "100%", background: "var(--accent)", transition: "width .3s ease" }} />
      </div>
    </div>
  );
}

const SYSTEM_THEME = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
function LoginScreen({ onLoggedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [state, setState] = useState({ busy: false, error: null });
  const submit = (e) => {
    e.preventDefault();
    if (state.busy) return;
    setState({ busy: true, error: null });
    session.login(email.trim(), password)
      .then((user) => onLoggedIn(user))
      .catch((err) => setState({ busy: false, error: err.message }));
  };
  const field = { fontFamily: "var(--font-mono)", fontSize: "13px", padding: "10px 12px", borderRadius: "8px", border: "1px solid var(--line)", background: "var(--paper-raised)", color: "var(--ink)", width: "100%", boxSizing: "border-box" };
  return (
    <form onSubmit={submit} style={{ width: "min(340px, 92vw)", display: "flex", flexDirection: "column", gap: "12px" }}>
      <div style={{ textAlign: "center", fontSize: "26px", color: "var(--ink)" }}>Wortschatz</div>
      <div style={{ ...monoLabel, textAlign: "center", marginBottom: "6px" }}>log in to your account</div>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="email" autoComplete="username" required style={field} />
      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="password" autoComplete="current-password" required style={field} />
      <button type="submit" disabled={state.busy} style={{ ...navBtnStyle, opacity: state.busy ? 0.6 : 1 }}>{state.busy ? "logging in …" : "log in"}</button>
      {state.error && <div role="alert" style={{ fontFamily: "var(--font-mono)", fontSize: "11px", color: "var(--bad)", textAlign: "center" }}>{state.error}</div>}
    </form>
  );
}

// settings changes after which practice rounds start over with the new choices
const ROUND_SETTINGS = ["toggleLevel", "toggleCat", "toggleDirection", "toggleNoRepeat", "setFocus"];
// Where the learner is in the app: kept in the page only, never sent to the backend.
// Every visit starts on Practice.
const NAV_START = { storyMode: false, storyOpen: null, storyTest: null };
const NAV_SETTINGS = {
  setStoryMode: (v) => ({ storyMode: !!v }),
  openStory: (v) => ({ storyOpen: v == null ? null : String(v), storyTest: null }),
  openPhaseTest: (v) => ({ storyTest: v == null ? null : String(v) }),
};

function App() {
  const [status, setStatus] = useState("loading"); // "loading" | "ready" | "login" | { error }
  const [user, setUser] = useState(session.user());
  const [attempt, setAttempt] = useState(0);
  const [summary, setSummary] = useState(null);
  const [nav, setNav] = useState(NAV_START); // where the learner is — page only
  const visited = useRef({}); // pages opened since login (kept mounted)
  const [saveError, setSaveError] = useState(null);
  const [mode, setMode] = useState("study");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [formulas, setFormulas] = useState(false); // the Formulas page is open
  const [version, setVersion] = useState(0); // bump → practice rounds restart
  // memory only, for this visit — never saved
  const [geminiKey, setGeminiKey] = useState("");
  const [ghToken, setGhToken] = useState("");

  useEffect(() => {
    api.setErrorHandler((msg) => setSaveError(msg));
    api.setLoggedOutHandler(() => setUser(null));
  }, []);
  const logout = useCallback(() => { session.logout(); setUser(null); }, []);

  const refreshSummary = useCallback(() => {
    return api.get("/api/summary?ai=" + (geminiKey ? "true" : "false"), { quiet: true }).then(setSummary).catch(api.report);
  }, [geminiKey]);
  // After an answer: the response carries the header numbers it changed ({summary: {header, mistakeCount}}).
  const applyChange = useCallback((r) => {
    if (r && r.summary) setSummary((s) => (s ? Object.assign({}, s, r.summary) : s));
    else refreshSummary();
  }, [refreshSummary]);

  useEffect(() => {
    let cancelled = false;
    setStatus("loading");
    if (!API_CONFIGURED) { setStatus({ error: "No backend configured — set PROD_API_BASE in index.html to the Spring Boot URL." }); return; }
    if (!user) {
      // someone else may log in next: drop everything of the last user
      STORY_PROGRESS.value = null; STORY_PROGRESS.stale = true; setNav(NAV_START); visited.current = {};
      setSummary(null); setSaveError(null); setGeminiKey(""); setGhToken(""); setMode("study"); setSettingsOpen(false); setFormulas(false);
      setStatus("login");
      return;
    }
    api.get("/api/summary?ai=false")
      .then((s) => { if (!cancelled) { setSummary(s); setStatus("ready"); } })
      .catch((e) => { if (!cancelled) setStatus(e && e.status === 401 ? "login" : { error: (e && e.message) || String(e) }); });
    return () => { cancelled = true; };
  }, [attempt, user]);
  useEffect(() => { if (status === "ready") refreshSummary(); }, [geminiKey]);

  const onSettings = useCallback((action, value) => {
    // Moving around (Practice/Stories, a story, a phase test) stays in the page — no call.
    const nav = NAV_SETTINGS[action];
    if (nav) {
      setNav((n) => Object.assign({}, n, nav(value)));
      return Promise.resolve();
    }
    return api.post("/api/settings/" + action + "?ai=" + (geminiKey ? "true" : "false"), { value })
      .then((next) => { // the whole new summary — no second call
        setSummary(next);
        if (ROUND_SETTINGS.includes(action)) setVersion((v) => v + 1);
      })
      .catch(api.report);
  }, [geminiKey]);

  const theme = summary && summary.settings.theme ? summary.settings.theme : SYSTEM_THEME;
  applyCategoryPalette(theme);
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#1b1915" : "#F6F1E5");
  }, [theme]);

  const shellStyle = { minHeight: "100%", padding: "36px 20px 48px", fontFamily: "var(--font-serif)", display: "flex", alignItems: "center", justifyContent: "center" };
  if (status && status.error) {
    return (
      <div style={shellStyle}>
        <div style={{ maxWidth: "440px", textAlign: "center", display: "flex", flexDirection: "column", gap: "16px" }}>
          <div style={{ fontSize: "22px", color: "var(--ink)" }}>Couldn't reach the backend</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: "12px", color: "var(--bad)" }}>{status.error}</div>
          <div style={{ fontSize: "13px", color: "var(--ink-muted)" }}>Backend: <code>{API_CONFIGURED ? (API_BASE || location.origin) : "(not configured)"}</code></div>
          <button onClick={() => setAttempt((n) => n + 1)} style={navBtnStyle}>⟲ retry</button>
        </div>
      </div>
    );
  }
  if (status === "login") {
    return <div style={shellStyle}><LoginScreen onLoggedIn={setUser} /></div>;
  }
  if (status === "loading" || !summary) {
    return <div style={shellStyle}><div style={{ ...counterStyle, fontSize: "13px" }}>loading …</div></div>;
  }

  const s = Object.assign({}, summary.settings, nav);
  const notice = saveError ? (
    <div role="alert" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "10px", padding: "8px 12px", borderRadius: "10px", border: "1px solid var(--bad)", fontFamily: "var(--font-mono)", fontSize: "10px", letterSpacing: "0.04em", color: "var(--bad)" }}>
      <span>⚠ {saveError}</span>
      <button onClick={() => setSaveError(null)} aria-label="dismiss" style={{ background: "transparent", border: "none", color: "var(--bad)", cursor: "pointer", fontSize: "14px" }}>×</button>
    </div>
  ) : null;
  const topBar = (
    <React.Fragment>
      <TopBar storyMode={s.storyMode} onStoryMode={(v) => onSettings("setStoryMode", v)} formulas={formulas} onFormulas={setFormulas}
        theme={theme} onTheme={(t) => onSettings("setTheme", t)} user={user} onLogout={logout} />
      {notice}
    </React.Fragment>
  );

  // Practice, Stories and Rules stay mounted once opened and are only hidden,
  // so switching between them starts nothing again on the backend.
  const page = formulas ? "rules" : s.storyMode ? "stories" : "practice";
  if (!visited.current[page]) visited.current[page] = true;
  const show = (p) => ({ display: page === p ? "block" : "none" });
  const drillProps = { version, onChange: applyChange, geminiKey, settings: s };
  return (
    <div style={{ minHeight: "100%", padding: "20px 20px 56px", fontFamily: "var(--font-serif)" }}>
      <div style={{ maxWidth: page === "rules" ? "760px" : page === "stories" ? "620px" : "560px", margin: "0 auto", display: "flex", flexDirection: "column", gap: page === "practice" ? "18px" : "22px" }}>
        {topBar}
        {visited.current.rules && <div style={show("rules")}><div style={{ animation: "cardIn .35s ease both" }}><FormulasPage /></div></div>}
        {visited.current.stories && (
          <div style={show("stories")}>
            <div style={{ animation: "cardIn .35s ease both" }}>
              <StoriesPage settings={s} onSettings={onSettings} onChange={applyChange} />
            </div>
          </div>
        )}
        <div style={{ display: page === "practice" ? "flex" : "none", flexDirection: "column", gap: "18px" }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ display: "inline-block", ...monoLabel, fontSize: "9px", letterSpacing: "0.16em", border: "1px solid var(--line)", borderRadius: "999px", padding: "3px 11px", marginBottom: "14px" }}>⇣ everything served by the Java backend</div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: "10px", fontWeight: 500, letterSpacing: "0.28em", color: "var(--accent)", marginBottom: "8px" }}>{summary.levelTitle}</div>
            <div style={{ fontSize: "13px", fontStyle: "italic", color: "var(--ink-soft)", marginTop: "8px" }}>{summary.cardCount} cards — nouns, verbs, separable verbs, adjectives, connectors &amp; phrases</div>
            <div style={{ width: "48px", height: "2px", background: "var(--accent)", opacity: 0.5, borderRadius: "2px", margin: "18px auto 0" }} />
          </div>
          <div style={{ textAlign: "center" }}>
            <button onClick={() => setSettingsOpen((o) => !o)} style={{ ...monoLabel, color: "var(--ink-soft)", letterSpacing: "0.1em", background: settingsOpen ? "var(--tint)" : "transparent", border: "1px solid var(--line)", borderRadius: "999px", padding: "8px 16px", cursor: "pointer", maxWidth: "100%" }}>
              {settingsOpen ? "▾" : "▸"} {summary.settingsLabel}
            </button>
          </div>
          {settingsOpen && <SettingsPanel summary={summary} onSettings={onSettings} geminiKey={geminiKey} setGeminiKey={setGeminiKey} ghToken={ghToken} setGhToken={setGhToken} />}
          <StreakHeader header={summary.header} showCounts={mode === "study" || mode === "write"} />
          <TabBar mode={mode} setMode={setMode} mistakeCount={summary.mistakeCount} />
          <div style={{ marginTop: "6px", animation: "cardIn .35s ease both" }} key={mode}>
            {mode === "study" && <StudyMode {...drillProps} />}
            {mode === "write" && <WriteMode {...drillProps} />}
            {mode === "build" && <PatternStudy onChange={applyChange} />}
            {mode === "flash" && <Flashcards {...drillProps} />}
            {mode === "quiz" && <Quiz {...drillProps} />}
            {mode === "articles" && <ArticleQuiz {...drillProps} />}
            {mode === "sep" && <SeparableVerbs {...drillProps} />}
            {mode === "cloze" && <ClozeQuiz {...drillProps} />}
            {mode === "mistakes" && <MistakesReview {...drillProps} />}
            {mode === "add" && <AddWord summary={summary} ghToken={ghToken} onToken={setGhToken} onAdded={() => { loadContent(true).finally(() => setVersion((v) => v + 1)); refreshSummary(); }} />}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
