# Wakes the app on Render at 08:01 India time, after the keep-alive's quiet
# window (04:30–08:00 IST) has let it sleep. From then on the app keeps itself awake.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New repository
# secret APP_URL = the Render URL, e.g. https://your-app.onrender.com
name: Wake up app

on:
  schedule:
    - cron: "31 2 * * *" # 02:31 UTC = 08:01 IST (GitHub may start it a few minutes late)
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Call /health until the app answers
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          # a cold start on Render's free tier takes up to about a minute
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 120 "${APP_URL%/}/health"
